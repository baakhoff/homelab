# Hermes slot 1. Every field of the Deployment is explained here; slot-2 and
# slot-3 are the same with the number changed and fewer comments. What
# varies per slot is the name - PVC, Deployment, labels, Service, Ingress,
# claimName - HERMES_DASHBOARD_PUBLIC_URL and the host, and the resources.
#
# Hermes's whole home, /opt/data: config.yaml and .env (the LLM and platform
# keys entered in the dashboard), memories, skills, sessions, cron jobs, the
# Claude CLI and its login, and the agent's own working files. One volume
# for the reason pvc.yaml in paperless/ gives - one snapshot, one consistent
# moment. Expandable in place.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: slot-1
  namespace: hermes-slots
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slot-1
  namespace: hermes-slots
spec:
  # One agent on a ReadWriteOnce volume with SQLite on it. Recreate for the
  # reasons the Vaultwarden Deployment spells out: never two processes on one
  # database, and the RBD image maps to one node at a time.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: slot-1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slot-1
        app.kubernetes.io/part-of: hermes-slots
    spec:
      enableServiceLinks: false
      # Nothing here talks to the Kubernetes API, and an agent with a shell
      # should not find a token to try.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hermes
          # The -desktop build of this same release: TigerVNC + the Xfce core
          # baked in, which is the only way the Bot Desktop packages can
          # arrive (the pod is unprivileged, no sudo) and what the bot-screen
          # pane in Hermes Desktop needs. Nothing starts at boot - screens
          # are started per profile, on demand.
          image: docker.io/nousresearch/hermes-agent:v2026.9.24-desktop
          # The main process is the messaging gateway. With no platform
          # configured it idles; the dashboard runs beside it under the
          # image's supervisor.
          args: ["gateway", "run"]
          # Starts as root, like Stirling-PDF, and for a similar reason: the
          # image's init (s6-overlay) must be PID 1 as root, fixes the data
          # volume's ownership, then runs everything as its own user, hermes
          # (uid 10000). It refuses to start as any other uid. Root here
          # holds only what that needs: chown and file access for the
          # volume, setuid/setgid to drop, kill for the supervisor to stop
          # what it started.
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL]
          env:
            - name: TZ
              value: Europe/Copenhagen
            - name: HERMES_DASHBOARD
              value: "1"
            # The redirect address given to Pocket ID is this plus
            # /auth/callback, and the dashboard trusts this host name in its
            # Host and Origin checks. It must also be the address Desktop is
            # given: the login's two halves are joined by a cookie on this
            # host.
            - name: HERMES_DASHBOARD_PUBLIC_URL
              value: https://hermes-1.lab.baakhoff.com
            # --- Login: Pocket ID, through the dashboard's own OIDC ---------
            # The dashboard refuses to listen on anything but loopback
            # without a login provider. Who may log in at all is the
            # client's Allowed User Groups in Pocket ID.
            - name: HERMES_DASHBOARD_OIDC_ISSUER
              value: https://id.lab.baakhoff.com
            # The Claude subscription provider plugin runs the official Claude
            # Code CLI. The CLI is installed by hand onto the volume, so it
            # survives restarts, and is not on the gateway's PATH - README,
            # "Claude subscription". Its login lands in /opt/data/.claude:
            # the hermes user's home is the volume.
            - name: CLAUDE_SUBSCRIPTION_DIRECTSDK_COMMAND
              value: /opt/data/.local/bin/claude
          envFrom:
            # HERMES_DASHBOARD_OIDC_CLIENT_ID and
            # HERMES_DASHBOARD_OIDC_CLIENT_SECRET, created by hand into
            # oidc.sops.yaml beside this file: one Pocket ID client for all
            # slots, with each slot's callback URL on it. Until it exists the
            # pod waits in CreateContainerConfigError - README, step 2.
            - secretRef:
                name: hermes-slots-oidc
          ports:
            - name: dashboard
              containerPort: 9119
          # The first start seeds config and runs migrations. Five minutes
          # before liveness gets a vote.
          startupProbe:
            httpGet:
              path: /api/health
              port: dashboard
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: dashboard
          livenessProbe:
            httpGet:
              path: /api/health
              port: dashboard
            periodSeconds: 30
          # The everyday slot, so more room than the others: Claude Code
          # subprocesses and Chromium on top of the agent itself.
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 6Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            # Chromium, when the agent browses, needs more shared memory than
            # the runtime's 64Mi default.
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: slot-1
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: slot-1
  namespace: hermes-slots
spec:
  selector:
    app.kubernetes.io/name: slot-1
  ports:
    - name: http
      port: 80
      targetPort: dashboard
---
# No tls: block - the controller serves the lab wildcard as its default
# certificate. No oauth2-proxy gate either: Desktop's requests carry a Hermes
# token, not the gate's cookie. The dashboard's own Pocket ID login is the
# lock, and the lab is reachable from the house and the tailnet only.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: slot-1
  namespace: hermes-slots
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: hermes-1.lab.baakhoff.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: slot-1
                port:
                  number: 80
