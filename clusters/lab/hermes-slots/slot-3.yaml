# Hermes slot 3: slot-1.yaml with the number changed, a smaller memory
# request and limit, and fewer comments - slot-1.yaml explains every field.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: slot-3
  namespace: hermes-slots
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slot-3
  namespace: hermes-slots
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: slot-3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slot-3
        app.kubernetes.io/part-of: hermes-slots
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hermes
          image: docker.io/nousresearch/hermes-agent:v2026.9.24
          args: ["gateway", "run"]
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL]
          env:
            - name: TZ
              value: Europe/Copenhagen
            - name: HERMES_DASHBOARD
              value: "1"
            # Also where Pocket ID sends the login back to, so it must be the
            # address Desktop is given: the login's two halves are joined by
            # a cookie on this host.
            - name: HERMES_DASHBOARD_PUBLIC_URL
              value: https://hermes-3.lab.baakhoff.com
            - name: HERMES_DASHBOARD_OIDC_ISSUER
              value: https://id.lab.baakhoff.com
            # The Claude CLI for the subscription provider plugin, installed
            # by hand onto the volume - README, "Claude subscription".
            - name: CLAUDE_SUBSCRIPTION_DIRECTSDK_COMMAND
              value: /opt/data/.local/bin/claude
          envFrom:
            # One Pocket ID client for all slots, with each slot's callback
            # URL on it - README, step 2. Until the Secret exists the pod
            # waits in CreateContainerConfigError.
            - secretRef:
                name: hermes-slots-oidc
          ports:
            - name: dashboard
              containerPort: 9119
          startupProbe:
            httpGet:
              path: /api/health
              port: dashboard
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: dashboard
          livenessProbe:
            httpGet:
              path: /api/health
              port: dashboard
            periodSeconds: 30
          # Half the main Hermes's request: a test slot idles most of the
          # time. The limit leaves room for Chromium when it browses.
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: slot-3
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: slot-3
  namespace: hermes-slots
spec:
  selector:
    app.kubernetes.io/name: slot-3
  ports:
    - name: http
      port: 80
      targetPort: dashboard
---
# No tls: block - the controller serves the lab wildcard as its default
# certificate. No oauth2-proxy gate either: Desktop's requests carry a Hermes
# token, not the gate's cookie. The dashboard's own Pocket ID login is the
# lock, and the lab is reachable from the house and the tailnet only.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: slot-3
  namespace: hermes-slots
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: hermes-3.lab.baakhoff.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: slot-3
                port:
                  number: 80
