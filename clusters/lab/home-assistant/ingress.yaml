# No tls: block - the controller serves the lab wildcard as its default
# certificate, so this gets HTTPS without naming a Secret (like the rest).
#
# Deliberately NOT behind the oauth2-proxy gate, unlike the other admin
# tools: Home Assistant has its own login (the first-run owner account), and
# the gate's cookie model would break the websocket API that the frontend and
# the Companion app live on. Same reasoning as the Hermes slots' no-gate note,
# different constraint.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-assistant
  namespace: home-assistant
  annotations:
    # HA does uploads through the UI (snapshots, backups); nginx's 1m default
    # would 413 on anything real - 128m, like Vaultwarden's attachments.
    nginx.ingress.kubernetes.io/proxy-body-size: "128m"
    # The frontend holds a long-lived websocket to /api/websocket. The 60s
    # defaults cut idle connections and the UI silently reconnects all day;
    # 3600s follows the Hermes slots' precedent.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Home Assistant
    gethomepage.dev/group: Lab
    gethomepage.dev/icon: mdi-home-assistant
    gethomepage.dev/description: Home automation
    gethomepage.dev/href: https://hass.lab.baakhoff.com
spec:
  rules:
    - host: hass.lab.baakhoff.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: home-assistant
                port:
                  number: 80
