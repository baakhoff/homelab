# Trivy Operator: every container image running in the cluster, both repos'
# workloads alike, checked against the public CVE databases, again every day.
# Its findings become Prometheus metrics, and
# clusters/lab/monitoring/trivy-rules.yaml turns the critical ones into a
# Telegram message.
#
# Vulnerabilities only. The operator can also audit manifests, RBAC, the
# nodes' own configuration and secrets baked into images; those are off:
#   - manifests and RBAC: hundreds of findings about upstream charts' defaults
#     (no CPU limit, a writable root), which the lab's own security review
#     covers with judgement the rules do not have;
#   - the nodes' configuration (CIS): a privileged pod on every node checking
#     file paths k3s does not use, so mostly false findings;
#   - secrets in images: in third-party images these are test keys and
#     examples, and nothing here can change them.
# This is the one stream with a clear action at the end of it: a newer image.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: trivy-system
spec:
  interval: 1h
  chart:
    spec:
      chart: trivy-operator
      version: "0.38.1"
      sourceRef:
        kind: HelmRepository
        name: aquasecurity
        namespace: flux-system
      interval: 1h
  # The report CRDs live in the chart's crds/ directory, and Helm leaves those
  # alone on upgrade unless told otherwise - the same reason as
  # kube-prometheus-stack's.
  install:
    remediation:
      retries: 3
    crds: CreateReplace
  upgrade:
    remediation:
      retries: 3
    crds: CreateReplace
  values:
    operator:
      vulnerabilityScannerEnabled: true
      configAuditScannerEnabled: false
      rbacAssessmentScannerEnabled: false
      infraAssessmentScannerEnabled: false
      clusterComplianceEnabled: false
      exposedSecretScannerEnabled: false
      sbomGenerationEnabled: false

      # A report is deleted a day after it was made, which is what makes the
      # operator scan the image again: an image that has not changed still
      # gains CVEs as they are published.
      scannerReportTTL: "24h"

      # One Trivy server in the namespace keeps the vulnerability database
      # and, more to the point, what it has already read out of each image
      # layer. A daily rescan of an unchanged image then fetches its manifest
      # and nothing else, instead of every layer of every image every day.
      builtInTrivyServer: true

      # Two scans at a time. A scan reads an image's layers onto the node's
      # disk, and the nodes' one NVMe is also etcd's: the first pass over
      # every image is the heavy one, and spread out it stays out of etcd's
      # way. Slow mode, below, makes each scan longer, hence the timeout.
      scanJobsConcurrentLimit: 2
      scanJobTimeout: 10m

      # One series per container saying which OS its image is built on, and
      # whether that OS still gets security fixes. An end-of-life base gets
      # no fixed versions, so ignoreUnfixed below would hide everything in it
      # and the CVE alert would stay quiet about exactly the worst images;
      # trivy-rules.yaml alerts on these separately.
      metricsImageInfo: true

    # The metrics the alert rules read. Prometheus watches the whole cluster
    # for ServiceMonitors (clusters/lab/monitoring/helmrelease.yaml).
    serviceMonitor:
      enabled: true

    trivy:
      # Only what a newer package fixes, and only HIGH and CRITICAL. Every
      # image carries CVEs nobody has fixed yet; reporting those would make
      # the alert permanent and therefore ignored. What is left is the list
      # where waiting for, or asking for, a rebuilt image is the answer.
      ignoreUnfixed: true
      severity: HIGH,CRITICAL
      slow: true
      storageClassName: ceph-block
      storageSize: 5Gi
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 1Gi
      server:
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
