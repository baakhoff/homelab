apiVersion: apps/v1
kind: Deployment
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
spec:
  # Stateless - every operation is one request in and one PDF out - so one
  # replica is a sizing decision, not a correctness one.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stirling-pdf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stirling-pdf
    spec:
      enableServiceLinks: false
      # Starts as root, unlike everything else here, because the image's init
      # script is written for it and not for the alternative. It has non-root
      # branches, but it also creates symlinks in /usr/local/bin under
      # `set -e`, and started as uid 1000 it dies there, in a CrashLoopBackOff
      # whose log ends in `ln: ... Permission denied`. The root it gets is
      # the minimum the script uses (see the capabilities below), and it hands
      # off: Java and every LibreOffice server run as the image's own user,
      # switched to with setpriv. What stays root is the script itself and a
      # virtual display. Bypassing the script instead would mean losing the
      # LibreOffice pool it runs and watches, which is the Office conversion.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        # kubelet sets the emptyDirs' group to this; the script chowns them
        # to its user as well, and either is enough.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stirling-pdf
          # The standard image: LibreOffice, Calibre, Tesseract and OCRmyPDF
          # included. Its OCR languages are English and four the household
          # does not use - see the README for why that is left alone.
          image: ghcr.io/stirling-tools/stirling-pdf:2.14.3
          securityContext:
            # setpriv switches user with the capabilities below, not through a
            # setuid binary, so no_new_privs does not get in its way.
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              # What root is for in this pod: CHOWN and FOWNER to hand the
              # writable directories to the runtime user, DAC_OVERRIDE for the
              # symlinks and for reading what it does not own, SETUID and
              # SETGID for setpriv to become that user.
              add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
          # Every setting here overrides its line in settings.yml, which the
          # app writes to /configs at start from its built-in template.
          env:
            # No login. Pocket ID in front of the Ingress decides who gets
            # this far. The template defaults this to on, which with an empty
            # volume means a first-run admin account nobody would use.
            - name: SECURITY_ENABLELOGIN
              value: "false"
            # Off, not unset: unset means asking the admin on first visit,
            # and there is no admin.
            - name: SYSTEM_ENABLEANALYTICS
              value: "false"
            # Renovate proposes new versions here; a banner saying so in the
            # UI would only be a second, unactionable copy.
            - name: SYSTEM_SHOWUPDATE
              value: "false"
            # $HOME is on a volume below: LibreOffice keeps its profile there.
            # Set because the script chowns $HOME to its user, and root's
            # would otherwise be /root.
            - name: HOME
              value: /home/stirlingpdfuser
          ports:
            - name: http
              containerPort: 8080
          # A JVM and a LibreOffice pool starting together, on a node shared
          # with others: give it five minutes before liveness gets a vote.
          startupProbe:
            httpGet:
              path: /api/v1/info/status
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/info/status
              port: http
          livenessProbe:
            httpGet:
              path: /api/v1/info/status
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              # The init script sizes the JVM heap as a share of this, and the
              # rest is LibreOffice's. A limit hit is a failed operation and a
              # restart, not a lost file - nothing is kept here.
              memory: 2Gi
          volumeMounts:
            - name: configs
              mountPath: /configs
            - name: logs
              mountPath: /logs
            - name: custom-files
              mountPath: /customFiles
            - name: pipeline
              mountPath: /pipeline
            - name: storage
              mountPath: /storage
            - name: home
              mountPath: /home/stirlingpdfuser
            - name: tmp
              mountPath: /tmp
      # All emptyDirs. The settings file is regenerated from the template and
      # the env above on every start; logs go to stdout as well; server-side
      # file storage needs login, which is off. Mounted rather than left to the
      # image so that writability comes from fsGroup, not from the image's
      # ownership of each path.
      volumes:
        - name: configs
          emptyDir: {}
        - name: logs
          emptyDir:
            sizeLimit: 512Mi
        - name: custom-files
          emptyDir: {}
        - name: pipeline
          emptyDir: {}
        - name: storage
          emptyDir: {}
        - name: home
          emptyDir: {}
        # Every upload and every intermediate file of an operation. Sized so a
        # runaway job cannot fill the node's disk; going past it evicts the pod.
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
