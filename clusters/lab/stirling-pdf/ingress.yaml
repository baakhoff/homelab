# No tls: block - the controller serves the lab wildcard as its default
# certificate, so this gets HTTPS without naming a Secret, like every other
# Ingress here.
#
# Behind Pocket ID, and that is the whole of Stirling-PDF's login: the
# Deployment switches its own off. ingress-nginx sends each request to
# oauth2-proxy's auth endpoint first and only proxies it on a 202.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
  annotations:
    nginx.ingress.kubernetes.io/auth-url: http://oauth2-proxy.oauth2-proxy.svc.cluster.local/oauth2/auth
    nginx.ingress.kubernetes.io/auth-signin: https://auth.lab.baakhoff.com/oauth2/start?rd=$scheme://$host$request_uri
    # A stack of phone photos on its way to becoming one PDF is tens of
    # megabytes; ingress-nginx's default cap is 1m.
    nginx.ingress.kubernetes.io/proxy-body-size: "512m"
    # Unlike ConvertX, the work happens inside the request: the browser waits
    # on the POST until the PDF comes back. OCR of a long scan or a big
    # LibreOffice conversion runs past nginx's 60-second default, and the
    # symptom is a 504 while the pod carries on working for nobody.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Stirling-PDF
    gethomepage.dev/group: Lab
    gethomepage.dev/icon: stirling-pdf.png
    gethomepage.dev/description: Merge, split, reorder and edit PDFs
    # Explicit because there is no tls block for Homepage to infer https from.
    gethomepage.dev/href: https://pdf.lab.baakhoff.com
    # No pod-selector: the pods carry app.kubernetes.io/name=stirling-pdf,
    # which is what Homepage infers from this Ingress's name.
spec:
  rules:
    - host: pdf.lab.baakhoff.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stirling-pdf
                port:
                  number: 80
