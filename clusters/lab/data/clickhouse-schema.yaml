# The schema job: creates the Kafka topics, the warehouse's databases, and
# the raw tables that consume the topics. Idempotent, so it runs every hour
# and whenever it is started by hand (README) - a new source is one entry
# in SOURCES below.
#
# The warehouse has four layers, one ClickHouse database each:
#
#   raw  one table per source system, filled from its Kafka topic: every
#        message exactly as the system produced it, the payload untouched.
#        This job owns it.
#   ods  operational data store - raw parsed into typed, cleaned,
#        deduplicated tables, still one system at a time.
#   ads  aggregated data storage - joins and aggregates across systems.
#   dm   data marts - the tables a question or a dashboard reads.
#
# ods, ads and dm are created empty here, with the `dbt` user that builds
# every table in them from the layer below (pipelines/dbt/, run by
# Airflow). Nothing writes into them by hand.
#
# The plumbing between Kafka and raw - one Kafka engine table and one
# materialized view per source - lives in a fifth database, `kafka`, so
# that raw holds data and nothing else.
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-schema
  namespace: data
data:
  # One per source system: its topic is raw.<name>, its table raw.<name>
  # (a dash in the name becomes an underscore in the table). Producers
  # write to the topic; nothing is auto-created (kafka.yaml), so a producer
  # with a wrong name fails instead of disappearing into a topic nobody
  # reads.
  SOURCES: homeassistant logs k8s-events firefly vikunja mealie paperless sparkyfitness dawarich telegram

  topics.sh: |
    set -eu
    # One quick check first, so an unreachable broker fails this run in
    # half a minute with one clear line - not once per topic, each after
    # the admin client's own long timeout.
    if ! timeout 30 /opt/kafka/bin/kafka-broker-api-versions.sh \
        --bootstrap-server kafka.data.svc.cluster.local:9092 >/dev/null 2>&1; then
      echo "Kafka is not answering at kafka.data.svc.cluster.local:9092 - check kafka-0" >&2
      exit 1
    fi
    for s in $SOURCES; do
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka.data.svc.cluster.local:9092 \
        --create --if-not-exists --topic "raw.$s" --partitions 1 --replication-factor 1
    done

  schema.sh: |
    set -eu
    ch() {
      clickhouse-client --host clickhouse.data.svc.cluster.local --user admin \
        --password "$CLICKHOUSE_PASSWORD" --multiquery "$@"
    }

    ch --query "
      CREATE DATABASE IF NOT EXISTS raw;
      CREATE DATABASE IF NOT EXISTS ods;
      CREATE DATABASE IF NOT EXISTS ads;
      CREATE DATABASE IF NOT EXISTS dm;
      CREATE DATABASE IF NOT EXISTS kafka;
    "

    for s in $SOURCES; do
      t=$(printf '%s' "$s" | tr '-' '_')

      # Log lines are the one source kept for a limited time; every other
      # table keeps everything until deleted.
      ttl=""
      case "$s" in
        logs) ttl="TTL toDateTime(kafka_ts) + INTERVAL 90 DAY" ;;
      esac

      ch --query "
        CREATE TABLE IF NOT EXISTS raw.$t (
          partition   UInt64,
          offset      UInt64,
          key         String,
          kafka_ts    DateTime64(3),
          ingested_at DateTime64(3) DEFAULT now64(3),
          payload     String CODEC(ZSTD(3))
        )
        ENGINE = MergeTree
        PARTITION BY toYYYYMM(kafka_ts)
        ORDER BY (kafka_ts, offset)
        $ttl;

        CREATE TABLE IF NOT EXISTS kafka.${t}_queue (payload String)
        ENGINE = Kafka
        SETTINGS
          kafka_broker_list = 'kafka.data.svc.cluster.local:9092',
          kafka_topic_list = 'raw.$s',
          kafka_group_name = 'clickhouse-$s',
          -- The whole message as one string: nothing is parsed, so nothing
          -- a producer sends can be rejected for its shape.
          kafka_format = 'RawBLOB',
          kafka_num_consumers = 1;

        CREATE MATERIALIZED VIEW IF NOT EXISTS kafka.${t}_to_raw TO raw.$t AS
        SELECT
          _partition AS partition,
          _offset AS offset,
          _key AS key,
          coalesce(_timestamp_ms, now64(3)) AS kafka_ts,
          payload
        FROM kafka.${t}_queue;
      "
    done

    # The user dbt runs as (pipelines/dbt/, run by Airflow): reads raw,
    # owns the three layers above it, nothing else - it cannot change raw
    # or create users. The password is set on every run, so rotating it is
    # a change to both copies of the Secret (clusters/lab/airflow/README.md)
    # and the next run of this job. Hex only, so it needs no quoting here.
    ch --query "
      CREATE USER IF NOT EXISTS dbt IDENTIFIED WITH sha256_password BY '$DBT_PASSWORD';
      ALTER USER dbt IDENTIFIED WITH sha256_password BY '$DBT_PASSWORD';
      GRANT SELECT ON raw.* TO dbt;
      GRANT ALL ON ods.* TO dbt;
      GRANT ALL ON ads.* TO dbt;
      GRANT ALL ON dm.* TO dbt;
      GRANT TABLE ENGINE ON MergeTree TO dbt;
      GRANT CREATE TEMPORARY TABLE ON *.* TO dbt;
    "
    echo "schema in place for: $SOURCES"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: clickhouse-schema
  namespace: data
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  # One failed run kept to read, not three: each kept run is a KubeJobFailed
  # alert, and an hourly job that is failing for a reason that needs a person
  # would otherwise page once an hour, all night - which it did, while Kafka
  # was crash-looping.
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # No retries within a run: the next run is an hour away anyway, and
      # every retry is one more failed pod left behind (and one more
      # KubeContainerWaiting alert an hour later).
      backoffLimit: 0
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: clickhouse-schema
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: topics
              image: docker.io/apache/kafka:4.3.1
              command: ["sh", "/scripts/topics.sh"]
              env:
                - name: SOURCES
                  valueFrom:
                    configMapKeyRef:
                      name: clickhouse-schema
                      key: SOURCES
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
          containers:
            - name: schema
              image: docker.io/clickhouse/clickhouse-server:26.8.15.10
              command: ["bash", "/scripts/schema.sh"]
              env:
                - name: SOURCES
                  valueFrom:
                    configMapKeyRef:
                      name: clickhouse-schema
                      key: SOURCES
                - name: CLICKHOUSE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: clickhouse-admin
                      key: CLICKHOUSE_PASSWORD
                - name: DBT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: clickhouse-dbt
                      key: DBT_PASSWORD
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
          volumes:
            - name: scripts
              configMap:
                name: clickhouse-schema
