# The schema job: creates the Kafka topics, and the ClickHouse tables that
# consume them. Idempotent, so it runs every hour and whenever it is started
# by hand (README) - a new topic is a one-line change to TOPICS below.
#
# The data model is one raw table. Every message from every topic lands in
# raw.events exactly as it was produced - the payload is the original JSON,
# untouched - with the topic, the Kafka offset and the time beside it.
# Shaping it into per-source tables is a view on top, written when a
# question needs it; the raw rows stay the source of truth.
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-schema
  namespace: data
data:
  # One per source. Producers write here; nothing is auto-created
  # (kafka.yaml), so a producer with a wrong name fails instead of
  # disappearing into an unconsumed topic.
  TOPICS: raw.homeassistant,raw.logs,raw.k8s-events,raw.firefly,raw.vikunja,raw.mealie,raw.paperless

  topics.sh: |
    set -eu
    for t in $(echo "$TOPICS" | tr ',' ' '); do
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka.data.svc.cluster.local:9092 \
        --create --if-not-exists --topic "$t" --partitions 1 --replication-factor 1
    done

  schema.sh: |
    set -eu
    ch() {
      clickhouse-client --host clickhouse.data.svc.cluster.local --user admin \
        --password "$CLICKHOUSE_PASSWORD" --multiquery "$@"
    }

    ch --query "
      CREATE DATABASE IF NOT EXISTS raw;

      CREATE TABLE IF NOT EXISTS raw.events (
        topic       LowCardinality(String),
        partition   UInt64,
        offset      UInt64,
        key         String,
        kafka_ts    DateTime64(3),
        ingested_at DateTime64(3) DEFAULT now64(3),
        payload     String CODEC(ZSTD(3))
      )
      ENGINE = MergeTree
      PARTITION BY (topic, toYYYYMM(kafka_ts))
      ORDER BY (topic, kafka_ts, offset)
      -- Log lines are the one source kept for a limited time: 90 days.
      -- Everything else is kept until deleted.
      TTL toDateTime(kafka_ts) + INTERVAL 90 DAY DELETE WHERE topic = 'raw.logs';
    "

    # The consumer. A Kafka engine table cannot change its topic list in
    # place, so when TOPICS no longer matches, it and its view are dropped
    # and recreated. Nothing is lost: the consumer group's position lives in
    # Kafka, and the new consumer resumes from it.
    current=$(ch --format TSVRaw --query "
      SELECT extract(create_table_query, 'kafka_topic_list = ''([^'']*)''')
      FROM system.tables WHERE database = 'raw' AND name = 'kafka_queue'")
    if [ -n "$current" ] && [ "$current" != "$TOPICS" ]; then
      echo "topic list changed: recreating the consumer"
      ch --query "DROP VIEW IF EXISTS raw.kafka_to_events; DROP TABLE IF EXISTS raw.kafka_queue;"
    fi

    ch --query "
      CREATE TABLE IF NOT EXISTS raw.kafka_queue (payload String)
      ENGINE = Kafka
      SETTINGS
        kafka_broker_list = 'kafka.data.svc.cluster.local:9092',
        kafka_topic_list = '$TOPICS',
        kafka_group_name = 'clickhouse-raw',
        -- The whole message as one string: nothing is parsed, so nothing
        -- a producer sends can be rejected for its shape.
        kafka_format = 'RawBLOB',
        kafka_num_consumers = 1;

      CREATE MATERIALIZED VIEW IF NOT EXISTS raw.kafka_to_events TO raw.events AS
      SELECT
        _topic AS topic,
        _partition AS partition,
        _offset AS offset,
        _key AS key,
        coalesce(_timestamp_ms, now64(3)) AS kafka_ts,
        payload
      FROM raw.kafka_queue;
    "
    echo "schema in place for: $TOPICS"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: clickhouse-schema
  namespace: data
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: clickhouse-schema
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: topics
              image: docker.io/apache/kafka:4.3.1
              command: ["sh", "/scripts/topics.sh"]
              env:
                - name: TOPICS
                  valueFrom:
                    configMapKeyRef:
                      name: clickhouse-schema
                      key: TOPICS
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
          containers:
            - name: schema
              image: docker.io/clickhouse/clickhouse-server:26.8.15.10
              command: ["bash", "/scripts/schema.sh"]
              env:
                - name: TOPICS
                  valueFrom:
                    configMapKeyRef:
                      name: clickhouse-schema
                      key: TOPICS
                - name: CLICKHOUSE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: clickhouse-admin
                      key: CLICKHOUSE_PASSWORD
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
          volumes:
            - name: scripts
              configMap:
                name: clickhouse-schema
