# Homepage reads a fixed set of files from /app/config. The Deployment mounts
# each one individually with subPath, which has a sharp edge worth knowing:
# a subPath naming a key that does not exist in this ConfigMap does not fall
# back to a default, it fails the MOUNT - the pod sticks in ContainerCreating
# with the reason buried in `kubectl describe`. So every key mounted there must
# exist here, including the ones deliberately left empty.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
data:
  # `mode: cluster` means authenticate with the pod's own ServiceAccount rather
  # than a kubeconfig. `ingress: true` is what turns on annotation discovery.
  kubernetes.yaml: |
    mode: cluster
    ingress: true

  # Groups are declared here so their ORDER is fixed. A group that appears only
  # on an Ingress annotation still renders, just wherever Homepage decides -
  # which changes as services come and go.
  settings.yaml: |
    title: lab
    headerStyle: clean
    theme: dark
    color: slate
    layout:
      Platform:
        style: row
        columns: 2
      Services:
        style: row
        columns: 2
      Cluster:
        style: row
        columns: 2
      Lab:
        style: row
        columns: 2

  # Everything with an Ingress discovers itself from annotations - see the
  # gethomepage.dev/* keys on each Ingress. What is left here is the things
  # that have no Ingress and therefore no URL to discover.
  #
  # Prometheus and Alertmanager are reachable only through a port-forward, so
  # the href is where they land AFTER you run the command in the description.
  # Clicking before forwarding gets a connection refused, which is the honest
  # behaviour: they are genuinely not exposed.
  services.yaml: |
    - Cluster:
        - Prometheus:
            icon: prometheus.png
            href: http://localhost:9090
            description: port-forward -n monitoring svc/kube-prometheus-stack-prometheus 9090:9090
        - Alertmanager:
            icon: mdi-bell-alert
            href: http://localhost:9093
            description: port-forward -n monitoring svc/kube-prometheus-stack-alertmanager 9093:9093
    # Minecraft has no Ingress - it is not HTTP - so nothing discovers it. No
    # href either: there is no page to open, the description is the thing you
    # type into the launcher.
    #
    # The widget is the one live element on this page besides the cluster
    # header, and it earns its place the same way: no credential. Homepage
    # does a server-list ping - the same request a launcher sends before it
    # shows a server as reachable - and gets status, players online and the
    # running Minecraft version back. The version is the useful one: the
    # server floats on LATEST and every restart may move it (the Deployment
    # says why), so this is where you read what the world is on today.
    #
    # `udp://` is only what Homepage's URL parser expects for this widget
    # type; the ping itself is TCP to the game port, so the in-cluster Service
    # name is the right target and no NetworkPolicy stands in the way.
    - Lab:
        - Minecraft:
            icon: minecraft.png
            description: mc.lab · Java Edition
            widget:
              type: minecraft
              url: udp://minecraft.minecraft.svc.cluster.local:25565

  bookmarks.yaml: |
    - Elsewhere:
        - Repo:
            - abbr: GH
              href: https://github.com/baakhoff/homelab
        - Heartbeat:
            - abbr: HC
              href: https://healthchecks.io/

  # Deliberately (almost) no service widgets. Those pull live status from each
  # service and nearly every one of them wants an API key, which would mean a
  # SOPS secret per widget for a dashboard whose job is links. The two that
  # exist are the two that need no credential: the cluster widget below reads
  # the API with the same ServiceAccount already used for discovery, and the
  # Minecraft widget in services.yaml is an unauthenticated server ping.
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: lab
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - search:
        provider: duckduckgo
        target: _blank

  # Present and empty on purpose - see the subPath note at the top. docker.yaml
  # stays empty here for a simpler reason than it did on node01: there is no
  # Docker daemon anywhere on this cluster to point it at.
  docker.yaml: ""
  custom.css: ""
  custom.js: ""
