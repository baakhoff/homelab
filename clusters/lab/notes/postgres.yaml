# Outline's database: every document, its revisions, the collections, users
# and API keys. Its own Postgres, like Dawarich's, rather than a shared one.
#
# The user created here is the database's superuser, and Outline signs in as
# it to run its migrations, which it does by itself at every start.
apiVersion: v1
kind: Service
metadata:
  name: outline-postgres
  namespace: notes
spec:
  selector:
    app.kubernetes.io/name: outline-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: outline-postgres
  namespace: notes
spec:
  serviceName: outline-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: outline-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outline-postgres
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The alpine image's postgres user.
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: docker.io/library/postgres:18.6-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: outline
            - name: POSTGRES_DB
              value: outline
            # Read only when the database is first created. Changing it in
            # the Secret later does not change it here - README.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: outline
                  key: DATABASE_PASSWORD
            # A subdirectory, because the volume's root holds lost+found and
            # initdb refuses a non-empty directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "outline", "-d", "outline"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "outline", "-d", "outline"]
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-block
        resources:
          requests:
            storage: 5Gi
