# SilverBullet's data folder: the server's own state (accounts, the Pocket ID
# client in authentication.json, API tokens, space settings) and the notes
# space itself - Markdown files plus the git repository Revisions keeps
# beside them. One volume, so one snapshot is one consistent moment.
#
# 5Gi: notes are text. Expandable in place if pasted images ever add up.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: silverbullet-data
  namespace: notes
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 5Gi
