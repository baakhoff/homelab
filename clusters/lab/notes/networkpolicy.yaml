# Three ways in, each with its own reason:
#
# - ingress-nginx, for browsers, through the gate in ingress.yaml.
# - The brand agent pod, which reads and writes notes through SilverBullet's
#   HTTP API (/.fs) with an API token of its own account. The matching
#   egress rule is in clusters/lab/agents/networkpolicy-brand.yaml.
# - Airflow's scheduler, for the ingest_silverbullet DAG, which copies the
#   notes into the warehouse with a read-only token
#   (pipelines/dags/ingest.py; the egress rule is in
#   clusters/lab/airflow/networkpolicy.yaml).
#
# The last two reach the server ungated, so the setup wizard's first admin
# must exist before either has a token - which it does, since tokens are
# issued from that admin's Dashboard.
#
# k3s enforces NetworkPolicy - see the agents policy for the smoke test.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: silverbullet-ingress
  namespace: notes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: silverbullet
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agents
          podSelector:
            matchLabels:
              app.kubernetes.io/name: brand
      ports:
        - protocol: TCP
          port: 3000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: airflow
          podSelector:
            matchLabels:
              component: scheduler
      ports:
        - protocol: TCP
          port: 3000
