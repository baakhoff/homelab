# How the index is built - on the workstation, never in the cluster (README,
# "Building the index"): the OpenStreetMap dumps GraphHopper publishes for
# Photon, one per country or region, streamed one after another straight
# into Photon's importer - decompressed on the way, nothing written to disk
# but the index itself. Photon skips the second and later files' headers
# with a warning, and -country-codes keeps only the countries asked for,
# which trims the Central Asia dump to Kazakhstan.
#
# stream.py and import.sh are here for the workstation to fetch with the
# settings below, so its build is this exact one; check.sh is what the pod
# runs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: photon-import
  namespace: photon
data:
  stream.py: |
    """Each dump in turn to stdout, decompressed; fails on a bad checksum."""
    import hashlib
    import sys
    import time
    import urllib.error
    import urllib.request

    import zstandard

    BASE = "https://download1.graphhopper.com/public"
    HEADERS = {"User-Agent": "photon-import (homelab; github.com/baakhoff/homelab)"}
    out = sys.stdout.buffer


    def fetch(url, timeout):
        """The response, after up to six tries: a name lookup that fails
        once, or a server that answers 5xx, is no reason to throw the
        import away. A 4xx is - the file is not there."""
        for attempt in range(6):
            try:
                return urllib.request.urlopen(urllib.request.Request(url, headers=HEADERS), timeout=timeout)
            except urllib.error.HTTPError as e:
                if e.code < 500 or attempt == 5:
                    raise
                error = e
            except OSError as e:
                if attempt == 5:
                    raise
                error = e
            wait = 15 * 2 ** attempt
            print(f"{url}: {error}; trying again in {wait}s", file=sys.stderr, flush=True)
            time.sleep(wait)


    for path in sys.argv[1:]:
        name = path.rsplit("/", 1)[-1]
        url = f"{BASE}/{path}/photon-dump-{name}-1.0-latest.jsonl.zst"
        with fetch(url + ".md5", timeout=60) as r:
            want = r.read().split()[0].decode()
        md5 = hashlib.md5()

        class Hashed:
            def __init__(self, raw):
                self.raw = raw

            def read(self, size=-1):
                chunk = self.raw.read(size)
                md5.update(chunk)
                return chunk

        with fetch(url, timeout=300) as r:
            for chunk in zstandard.ZstdDecompressor().read_to_iter(Hashed(r), read_size=1 << 20):
                out.write(chunk)
        if md5.hexdigest() != want:
            sys.exit(f"{name}: checksum mismatch - GraphHopper may have been mid-upload; restart the pod")
        print(f"{name}: streamed", file=sys.stderr, flush=True)
    out.flush()

  import.sh: |
    #!/bin/bash
    # The build, run on the workstation in this image (README, "Building the
    # index"), with /photon/data and /build as folders there. Builds the
    # index unless the one in /photon/data was built from exactly these
    # settings, in /build, and swaps it in only once the import has
    # succeeded.
    #
    # Not in the cluster: an hour of indexing tens of millions of places
    # stalled OpenSearch past the importer's fixed 30-second timeout on the
    # Ceph volume, and on a node's own NVMe - shared with etcd and the Ceph
    # OSD - it starved the node and took the control plane down.
    set -euo pipefail
    cd /photon/data
    want="$IMPORT_STAMP | $DUMPS | $COUNTRIES | $LANGUAGES"
    if [ -d photon_data ] && [ "$(cat import-settings 2>/dev/null)" = "$want" ]; then
      echo "The index was built from these settings; nothing to import."
      exit 0
    fi
    echo "Building the index: $want"
    rm -rf /build/next next
    mkdir /build/next
    # shellcheck disable=SC2086 # DUMPS is a list
    python /scripts/stream.py $DUMPS \
      | java $JAVA_OPTS -jar /photon/photon.jar import \
          -import-file - \
          -data-dir /build/next \
          -country-codes "$COUNTRIES" \
          -languages "$LANGUAGES"
    echo "Copying the index to the volume: $(du -sh /build/next/photon_data | cut -f1)"
    mkdir next
    cp -a /build/next/photon_data next/
    rm -rf /build/next
    rm -rf photon_data
    mv next/photon_data photon_data
    rmdir next
    printf '%s' "$want" > import-settings
    echo "Index built."

  check.sh: |
    #!/bin/bash
    # Lets the server start only on an index built from exactly the
    # settings below. Anything else - no index yet, or a country, language
    # or IMPORT_STAMP changed - stops here instead of building one in the
    # cluster, and says how.
    set -euo pipefail
    want="$IMPORT_STAMP | $DUMPS | $COUNTRIES | $LANGUAGES"
    have="$(cat /photon/data/import-settings 2>/dev/null || true)"
    if [ -d /photon/data/photon_data ] && [ "$have" = "$want" ]; then
      echo "The index matches the settings: $want"
      exit 0
    fi
    echo "No index built from these settings on the volume."
    echo "  wanted: $want"
    echo "  found:  ${have:-nothing}"
    echo "Build it on the workstation and copy it in: clusters/lab/photon/README.md, \"Building the index\"."
    exit 1
---
# One pod: a check that the volume holds the index these settings describe,
# then the server. Photon keeps its index in an OpenSearch it runs inside
# its own process, on the volume, so one replica and Recreate: two would
# open the same index.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: photon
  namespace: photon
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: photon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: photon
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The image's photon user. Its entrypoint would start as root to
        # chown; starting as the user skips that.
        runAsUser: 9011
        runAsGroup: 9011
        fsGroup: 9011
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Through in a second when the index matches the settings; otherwise
        # the pod stops here, in Init:Error, and the log says what to do.
        # The settings are also what the workstation's build reads.
        - name: check
          image: docker.io/rtuszik/photon-docker:2.4.0
          command: ["/bin/bash", "/scripts/check.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            # Change to rebuild from GraphHopper's latest dumps - README,
            # "Changing the countries, or fresher maps".
            - name: IMPORT_STAMP
              value: "2026-10"
            # Paths under download1.graphhopper.com/public/. Russia's is
            # the whole country, the Asian part included.
            - name: DUMPS
              value: >-
                europe/denmark
                europe/serbia europe/bosnia-herzegovina europe/montenegro
                europe/croatia europe/kosovo europe/macedonia europe/albania
                europe/slovenia europe/bulgaria europe/greece europe/romania
                europe/turkey europe/georgia europe/russia
                asia/china asia/central-asia
            # What the index keeps. Central Asia comes as one dump; this
            # keeps Kazakhstan from it.
            - name: COUNTRIES
              value: DK,RS,BA,ME,HR,XK,MK,AL,SI,BG,GR,RO,TR,GE,RU,CN,KZ
            # Names are always kept in the local language; these are the
            # translations kept besides, the household's languages.
            # Serbian covers both scripts where OpenStreetMap has them.
            - name: LANGUAGES
              value: en,ru,sr,kk
            # The workstation build's heap. Russia is one country, so the
            # importer's cache of its addresses is the largest it holds.
            - name: JAVA_OPTS
              value: -Xmx4g
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /photon/data
              readOnly: true
            - name: scripts
              mountPath: /scripts
      containers:
        - name: photon
          image: docker.io/rtuszik/photon-docker:2.4.0
          command:
            - java
            - -Xmx2g
            - -jar
            - /photon/photon.jar
            - serve
            - -data-dir
            - /photon/data
            - -listen-ip
            - 0.0.0.0
            - -listen-port
            - "2322"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 2322
          # OpenSearch opens the index before Photon listens.
          startupProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /status
              port: http
          livenessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 30
          # The heap above, plus OpenSearch's memory outside it; the index
          # itself is read through the page cache, which is not counted
          # here.
          resources:
            requests:
              cpu: 100m
              memory: 3Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /photon/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: photon-data
        - name: scripts
          configMap:
            name: photon-import
