# Grafana Alloy as the log collector, running one pod per node - three here,
# where node01 ran one.
#
# NOT Promtail. Almost every Loki tutorial still says Promtail; it was
# deprecated in 2025 and is now end of life. Following those guides installs a
# dead agent that works right up until it does not.
#
# Alloy reads logs through the KUBERNETES API rather than tailing files off the
# host. That is why there is no hostPath mount here and no privileged
# container - the pod needs permission, not access to the node's disk. The
# trade is load on the API server, and it is worth re-stating rather than
# copying: this cluster's API server is three servers with embedded etcd, and
# every watch Alloy opens is served by whichever one it connects to. Three
# collectors watching pods is still nothing next to what Prometheus and Flux
# already ask of the same endpoint.
#
# Two destinations: Loki, for reading logs in Grafana, and Kafka, for the
# data warehouse (clusters/lab/data/) - the same lines, plus the cluster's
# events, which go to Kafka only. Both get every line with its secrets
# masked first (mask_secrets below; pipelines/sensitive.md).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: logging
spec:
  interval: 1h
  chart:
    spec:
      chart: alloy
      version: "1.12.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      type: daemonset

    # The chart's DEFAULT rules are much broader than this - among other things
    # they grant get/list/watch on secrets and configmaps across every
    # namespace, because the chart supports Alloy doing far more than collecting
    # logs. Ours does one job, so it gets one job's permissions. A log collector
    # has no business being able to read every Secret in the cluster.
    #
    # pods/log is the one that actually matters: it is what lets Alloy read logs
    # through the API instead of off the disk.
    #
    # clusterRules is deliberately NOT set, though it is tempting: the chart
    # renders `rules` and `clusterRules` into one list, and toYaml on an empty
    # list emits a bare `[]`, which lands under real list items and produces
    # invalid YAML the chart cannot render. So it keeps its default, which is
    # read-only access to nodes - unremarkable for a telemetry agent, and not
    # where the risk was.
    rbac:
      create: true
      rules:
        - apiGroups: [""]
          resources: ["pods", "pods/log", "namespaces"]
          verbs: ["get", "list", "watch"]
        # Kubernetes events, for the raw.k8s-events topic.
        - apiGroups: ["", "events.k8s.io"]
          resources: ["events"]
          verbs: ["get", "list", "watch"]

    alloy:
      # The node this pod runs on, so it reads only that node's pods (the
      # pod discovery below). Without it every collector read every pod:
      # three copies of each line, which Loki quietly merged and Kafka
      # would not.
      extraEnv:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

      # The three collectors form a cluster so that cluster-wide work - the
      # Kubernetes event stream - is done once, by one of them, rather than
      # three times. Per-node log reading does not need it.
      clustering:
        enabled: true

      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi

      # Alloy's own config language. Components are wired by referencing each
      # other's outputs, so this reads bottom-up: discover pods, relabel them,
      # read their logs, push to Loki.
      #
      # The relabel block is where the cost of this system is decided. Each rule
      # promotes one piece of Kubernetes metadata to a Loki label, and every
      # distinct combination of label values becomes its own stream. These four
      # are bounded by the size of the cluster. Anything derived from log
      # CONTENT - a request id, a user id, a trace id - is unbounded and is how
      # Loki installations die.
      #
      # `node` earns its place here in a way it did not on a single-node
      # cluster, where it was one value forever. With three nodes and pods that
      # move between them, it is the label that answers "was this one node
      # misbehaving, or all of them?" - the first question worth asking about
      # Ceph, the agent pods, or anything else that is now spread out.
      configMap:
        content: |-
          discovery.kubernetes "pods" {
            role = "pod"
            selectors {
              role  = "pod"
              field = "spec.nodeName=" + sys.env("NODE_NAME")
            }
          }

          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_node_name"]
              target_label  = "node"
            }
          }

          // Secrets and identity numbers masked out of every log line and
          // event before they leave the collector, so neither Loki nor the
          // warehouse ever holds them; with them invisible characters,
          // scripts, long base64 and instructions aimed at an AI, since a
          // request's path and User-Agent are written by whoever sends it.
          // The same idea as the ingest jobs'
          // pipelines/dags/sensitive.py, with the patterns that need no
          // checksum (RE2 has no way to run Luhn), and cards only when
          // written in groups, which is how a person writes one.
          //
          // Each kind is first detected, then masked: the detection sets
          // the labels `sensitive` ("true") and `sensitive_kinds` (a comma
          // list), which reach the warehouse as attributes on the line.
          // Both are bounded - a handful of kinds - so they cost Loki next
          // to nothing in streams. What a mask keeps is what sensitive.py
          // keeps: a key's first seven and last four characters, a card's
          // last four digits, nothing of a password.
          declare "mask_secrets" {
            argument "forward_to" { }

            loki.process "mask" {
              // Invisible characters out first - the Unicode tag block, zero-width
              // spaces, direction overrides - so a phrase split by them cannot slip
              // past the patterns below. The emoji joiner (U+200D) stays.
              stage.regex { expression = "(?P<sens_invisible_text>[\\x{E0000}-\\x{E007F}\\x{200B}\\x{200C}\\x{2060}-\\x{2064}\\x{202A}-\\x{202E}\\x{2066}-\\x{2069}\\x{FEFF}\\x{00AD}])" }
              stage.replace {
                expression = "([\\x{E0000}-\\x{E007F}\\x{200B}\\x{200C}\\x{2060}-\\x{2064}\\x{202A}-\\x{202E}\\x{2066}-\\x{2069}\\x{FEFF}\\x{00AD}]+)"
                replace    = ""
              }

              stage.regex { expression = "(?P<sens_private_key>-----BEGIN [A-Z0-9 ]*PRIVATE KEY)" }
              stage.regex { expression = "(?P<sens_age_key>AGE-SECRET-KEY-1[0-9A-Z]{58})" }
              stage.regex { expression = "(?P<sens_github_token>\\b(?:gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{60,}))" }
              stage.regex { expression = "(?P<sens_gitlab_token>\\bglpat-[A-Za-z0-9_-]{20,})" }
              stage.regex { expression = "(?P<sens_aws_access_key>\\b(?:AKIA|ASIA)[0-9A-Z]{16}\\b)" }
              stage.regex { expression = "(?P<sens_google_api_key>\\bAIza[0-9A-Za-z_-]{35})" }
              stage.regex { expression = "(?P<sens_google_oauth>\\b(?:1//0[0-9A-Za-z_-]{40,}|GOCSPX-[A-Za-z0-9_-]{28}|ya29\\.[0-9A-Za-z_-]{30,}))" }
              stage.regex { expression = "(?P<sens_slack_token>\\bxox[abposr]-[A-Za-z0-9-]{10,})" }
              stage.regex { expression = "(?P<sens_stripe_key>\\b(?:sk|rk)_(?:live|test)_[A-Za-z0-9]{20,})" }
              stage.regex { expression = "(?P<sens_anthropic_key>\\bsk-ant-[A-Za-z0-9_-]{20,})" }
              stage.regex { expression = "(?P<sens_openai_key>\\bsk-(?:proj-|svcacct-)[A-Za-z0-9_-]{20,})" }
              stage.regex { expression = "(?P<sens_npm_token>\\bnpm_[A-Za-z0-9]{36})" }
              stage.regex { expression = "(?P<sens_telegram_bot_token>\\b\\d{8,10}:AA[A-Za-z0-9_-]{33})" }
              stage.regex { expression = "(?P<sens_jwt>\\beyJ[A-Za-z0-9_-]{10,}\\.eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,})" }
              stage.regex { expression = "(?P<sens_url_password>[a-z][a-z0-9+.-]*://[^\\s:/@]+:[^\\s@/]+@)" }
              stage.regex { expression = "(?i)(?P<sens_password>(?:password|passwd|pwd|пароль|лозинка|lozinka)[\"']?\\s*[:=]\\s*[\"']?[^\\s\"',]{4,})" }
              stage.regex { expression = "(?i)(?P<sens_bearer>authorization:\\s*bearer\\s+[A-Za-z0-9._~+/=-]{16,})" }
              stage.regex { expression = "(?P<sens_card>\\b(?:4\\d{3}|5[1-5]\\d{2}|2[2-7]\\d{2}|6\\d{3}|3[47]\\d{2}|9891)[ -]\\d{4}[ -]\\d{4}[ -]\\d{1,4}\\b)" }
              stage.regex { expression = "(?P<sens_prompt_injection>(?i)(?:(?:ignore|disregard|forget|override|bypass)\\s+(?:(?:all|any|the|your|every)\\s+)*(?:previous|prior|above|earlier|preceding|existing|system|original)\\s+(?:instructions?|prompts?|rules|directions|messages|guidelines|context)|(?:new|updated|real|actual)\\s+(?:system\\s+)?instructions?\\s*:|you\\s+are\\s+now\\s+(?:a|an|in|the|my|no\\s+longer)\\s|system\\s+prompt\\b|developer\\s+mode|jailbreak|do\\s+not\\s+(?:tell|inform|alert)\\s+the\\s+user|(?:игнорируй|игнорируйте|забудь|забудьте)\\s+(?:все\\s+)?(?:предыдущие|прошлые|прежние|системные)?\\s*(?:инструкции|указания|правила)|(?:ignoriši|ignorisi|zaboravi)\\s+(?:sve\\s+)?(?:prethodne|prethodna|ranije)?\\s*(?:instrukcije|uputstva|pravila)|(?:игнориши|заборави)\\s+(?:све\\s+)?(?:претходне|претходна|раније)?\\s*(?:инструкције|упутства|правила)|<\\|(?:im_start|im_end|system|endoftext)\\|>|\\[/?INST\\]))" }
              stage.regex { expression = "(?P<sens_encoded_blob>(?:[A-Za-z0-9+/]{200,}={0,2}|(?i)<script\\b[\\s\\S]*?</script\\s*>|(?i)javascript:[^\\s\"'<>]{4,}))" }

              stage.template {
                source   = "sensitive_kinds"
                template = "{{ if .sens_private_key }}private_key,{{ end }}{{ if .sens_age_key }}age_key,{{ end }}{{ if .sens_github_token }}github_token,{{ end }}{{ if .sens_gitlab_token }}gitlab_token,{{ end }}{{ if .sens_aws_access_key }}aws_access_key,{{ end }}{{ if .sens_google_api_key }}google_api_key,{{ end }}{{ if .sens_google_oauth }}google_oauth,{{ end }}{{ if .sens_slack_token }}slack_token,{{ end }}{{ if .sens_stripe_key }}stripe_key,{{ end }}{{ if .sens_anthropic_key }}anthropic_key,{{ end }}{{ if .sens_openai_key }}openai_key,{{ end }}{{ if .sens_npm_token }}npm_token,{{ end }}{{ if .sens_telegram_bot_token }}telegram_bot_token,{{ end }}{{ if .sens_jwt }}jwt,{{ end }}{{ if .sens_url_password }}url_password,{{ end }}{{ if .sens_password }}password,{{ end }}{{ if .sens_bearer }}bearer_token,{{ end }}{{ if .sens_card }}card,{{ end }}{{ if .sens_invisible_text }}invisible_text,{{ end }}{{ if .sens_prompt_injection }}prompt_injection,{{ end }}{{ if .sens_encoded_blob }}encoded_blob,{{ end }}"
              }
              stage.template {
                source   = "sensitive_kinds"
                template = "{{ TrimSuffix .Value \",\" }}"
              }
              stage.template {
                source   = "sensitive"
                template = "{{ if .sensitive_kinds }}true{{ end }}"
              }
              stage.labels {
                values = { sensitive = "", sensitive_kinds = "" }
              }

              // The masks. Only the captured group is replaced; what is
              // around it - the key's prefix and tail, the field name - stays.
              stage.replace {
                expression = "-----BEGIN [A-Z0-9 ]*PRIVATE KEY(?: BLOCK)?-----([\\s\\S]*?)-----END"
                replace    = " [masked] "
              }
              stage.replace {
                expression = "AGE-SEC(RET-KEY-1[0-9A-Z]{47})[0-9A-Z]{4}"
                replace    = "****"
              }
              stage.replace {
                expression = "\\b(?:gh[pousr]_[A-Za-z0-9]{3}|github_pat_)([A-Za-z0-9_]{25,})[A-Za-z0-9]{4}"
                replace    = "****"
              }
              stage.replace {
                expression = "\\bglpat-[A-Za-z0-9_-]{1}([A-Za-z0-9_-]{15,})[A-Za-z0-9_-]{4}"
                replace    = "****"
              }
              stage.replace {
                expression = "\\b(?:AKIA|ASIA)[0-9A-Z]{3}([0-9A-Z]{9})[0-9A-Z]{4}\\b"
                replace    = "****"
              }
              stage.replace {
                expression = "\\bAIzaSyA?([0-9A-Za-z_-]{24,})[0-9A-Za-z_-]{4}"
                replace    = "****"
              }
              stage.replace {
                expression = "\\b(?:1//0[0-9A-Za-z_-]{3}|GOCSPX-|ya29\\.[0-9A-Za-z_-]{2})([0-9A-Za-z_-]{20,})[0-9A-Za-z_-]{4}"
                replace    = "****"
              }
              stage.replace {
                expression = "\\bxox[abposr]-[A-Za-z0-9]{2}([A-Za-z0-9-]{4,})[A-Za-z0-9-]{4}"
                replace    = "****"
              }
              stage.replace {
                expression = "\\b(?:sk|rk)_(?:live|test)([A-Za-z0-9_]{16,})[A-Za-z0-9]{4}"
                replace    = "****"
              }
              stage.replace {
                expression = "\\bsk-ant-([A-Za-z0-9_-]{16,})[A-Za-z0-9_-]{4}"
                replace    = "****"
              }
              stage.replace {
                expression = "\\bsk-(?:proj-|svcacct-)([A-Za-z0-9_-]{16,})[A-Za-z0-9_-]{4}"
                replace    = "****"
              }
              stage.replace {
                expression = "\\bnpm_[A-Za-z0-9]{3}([A-Za-z0-9]{29})[A-Za-z0-9]{4}"
                replace    = "****"
              }
              stage.replace {
                expression = "\\b\\d{8,10}:(AA[A-Za-z0-9_-]{29})[A-Za-z0-9_-]{4}"
                replace    = "****"
              }
              stage.replace {
                expression = "\\beyJ[A-Za-z0-9_-]{4}([A-Za-z0-9_-]{6,}\\.eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{6,})[A-Za-z0-9_-]{4}"
                replace    = "****"
              }
              stage.replace {
                expression = "[a-z][a-z0-9+.-]*://[^\\s:/@]+:([^\\s@/]+)@"
                replace    = "****"
              }
              stage.replace {
                expression = "(?i)(?:password|passwd|pwd|пароль|лозинка|lozinka)[\"']?\\s*[:=]\\s*[\"']?([^\\s\"',]{4,})"
                replace    = "********"
              }
              stage.replace {
                expression = "(?i)authorization:\\s*bearer\\s+[A-Za-z0-9._~+/=-]{3}([A-Za-z0-9._~+/=-]{9,})[A-Za-z0-9._~+/=-]{4}"
                replace    = "****"
              }
              stage.replace {
                expression = "\\b((?:4\\d{3}|5[1-5]\\d{2}|2[2-7]\\d{2}|6\\d{3}|3[47]\\d{2}|9891)[ -]\\d{4}[ -]\\d{4})[ -]\\d{1,4}\\b"
                replace    = "**** **** ****"
              }

              stage.replace {
                expression = "((?i)(?:(?:ignore|disregard|forget|override|bypass)\\s+(?:(?:all|any|the|your|every)\\s+)*(?:previous|prior|above|earlier|preceding|existing|system|original)\\s+(?:instructions?|prompts?|rules|directions|messages|guidelines|context)|(?:new|updated|real|actual)\\s+(?:system\\s+)?instructions?\\s*:|you\\s+are\\s+now\\s+(?:a|an|in|the|my|no\\s+longer)\\s|system\\s+prompt\\b|developer\\s+mode|jailbreak|do\\s+not\\s+(?:tell|inform|alert)\\s+the\\s+user|(?:игнорируй|игнорируйте|забудь|забудьте)\\s+(?:все\\s+)?(?:предыдущие|прошлые|прежние|системные)?\\s*(?:инструкции|указания|правила)|(?:ignoriši|ignorisi|zaboravi)\\s+(?:sve\\s+)?(?:prethodne|prethodna|ranije)?\\s*(?:instrukcije|uputstva|pravila)|(?:игнориши|заборави)\\s+(?:све\\s+)?(?:претходне|претходна|раније)?\\s*(?:инструкције|упутства|правила)|<\\|(?:im_start|im_end|system|endoftext)\\|>|\\[/?INST\\]))"
                replace    = "[instruction to an AI removed]"
              }
              stage.replace {
                expression = "((?i)<script\\b[\\s\\S]*?</script\\s*>)"
                replace    = "[script removed]"
              }
              stage.replace {
                expression = "((?i)javascript:[^\\s\"'<>]{4,})"
                replace    = "[javascript link removed]"
              }
              stage.replace {
                expression = "([A-Za-z0-9+/]{200,}={0,2})"
                replace    = "[base64 blob masked]"
              }

              forward_to = argument.forward_to.value
            }

            export "receiver" {
              value = loki.process.mask.receiver
            }
          }

          loki.source.kubernetes "pod_logs" {
            targets    = discovery.relabel.pod_logs.output
            forward_to = [loki.process.multiline.receiver]
          }

          // Postgres writes a statement over several lines as it was typed,
          // the first with the timestamp prefix and the rest as bare
          // continuation lines. Joined back into one entry here, so a query
          // run from CloudBeaver reaches the warehouse whole
          // (pipelines/dbt/models/ods/cloudbeaver_postgres_log.sql). Every
          // Postgres container in the lab is named `postgres` and every one
          // starts its lines with the date; nothing else is touched.
          loki.process "multiline" {
            stage.match {
              selector = "{container=\"postgres\"}"
              stage.multiline {
                firstline     = "^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}"
                max_wait_time = "3s"
                max_lines     = 1000
              }
            }
            forward_to = [mask_secrets.logs.receiver]
          }

          // Masked before the split, so Loki and the warehouse get the same
          // masked line.
          mask_secrets "logs" {
            forward_to = [loki.write.default.receiver, loki.process.to_kafka.receiver]
          }

          // Everything but the collectors' own logs goes on to Kafka. Their
          // own lines must not: when an export to Kafka fails, Alloy logs
          // the failure - one line per rejected item - and that line is
          // collected and exported too, and fails, and is logged again. On
          // the first day that loop put 13 million lines into raw.logs in
          // two hours and filled Kafka's disk. Loki still gets them (above);
          // Kafka never does.
          loki.process "to_kafka" {
            stage.match {
              selector = "{namespace=\"logging\"}"
              action   = "drop"
            }
            forward_to = [otelcol.receiver.loki.logs.receiver]
          }

          // The same lines, and the cluster's events, to Kafka for the data
          // warehouse (clusters/lab/data/). Each line goes out as OTLP JSON,
          // its Loki labels - namespace, pod, container, node - as
          // attributes beside the line itself.
          otelcol.receiver.loki "logs" {
            output {
              logs = [otelcol.exporter.kafka.logs.input]
            }
          }

          otelcol.exporter.kafka "logs" {
            brokers          = ["kafka.data.svc.cluster.local:9092"]
            protocol_version = "3.6.0"
            logs {
              topic    = "raw.logs"
              encoding = "otlp_json"
            }
          }

          // Every Kubernetes event in every namespace, as JSON. Clustered:
          // one collector holds the watch, so each event is sent once. A
          // rollout of the collectors may re-send a few as the watch moves.
          loki.source.kubernetes_events "events" {
            log_format = "json"
            forward_to = [mask_secrets.events.receiver]
            clustering {
              enabled = true
            }
          }

          // An event's message can quote a command line or an environment
          // value; masked like the log lines.
          mask_secrets "events" {
            forward_to = [otelcol.receiver.loki.events.receiver]
          }

          otelcol.receiver.loki "events" {
            output {
              logs = [otelcol.exporter.kafka.events.input]
            }
          }

          otelcol.exporter.kafka "events" {
            brokers          = ["kafka.data.svc.cluster.local:9092"]
            protocol_version = "3.6.0"
            logs {
              topic    = "raw.k8s-events"
              encoding = "otlp_json"
            }
          }

          loki.write "default" {
            endpoint {
              url = "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
            }
          }
