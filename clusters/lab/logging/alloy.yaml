# Grafana Alloy as the log collector, running one pod per node - three here,
# where node01 ran one.
#
# NOT Promtail. Almost every Loki tutorial still says Promtail; it was
# deprecated in 2025 and is now end of life. Following those guides installs a
# dead agent that works right up until it does not.
#
# Alloy reads logs through the KUBERNETES API rather than tailing files off the
# host. That is why there is no hostPath mount here and no privileged
# container - the pod needs permission, not access to the node's disk. The
# trade is load on the API server, and it is worth re-stating rather than
# copying: this cluster's API server is three servers with embedded etcd, and
# every watch Alloy opens is served by whichever one it connects to. Three
# collectors watching pods is still nothing next to what Prometheus and Flux
# already ask of the same endpoint.
#
# Two destinations: Loki, for reading logs in Grafana, and Kafka, for the
# data warehouse (clusters/lab/data/) - the same lines, plus the cluster's
# events, which go to Kafka only.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: logging
spec:
  interval: 1h
  chart:
    spec:
      chart: alloy
      version: "1.12.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      type: daemonset

    # The chart's DEFAULT rules are much broader than this - among other things
    # they grant get/list/watch on secrets and configmaps across every
    # namespace, because the chart supports Alloy doing far more than collecting
    # logs. Ours does one job, so it gets one job's permissions. A log collector
    # has no business being able to read every Secret in the cluster.
    #
    # pods/log is the one that actually matters: it is what lets Alloy read logs
    # through the API instead of off the disk.
    #
    # clusterRules is deliberately NOT set, though it is tempting: the chart
    # renders `rules` and `clusterRules` into one list, and toYaml on an empty
    # list emits a bare `[]`, which lands under real list items and produces
    # invalid YAML the chart cannot render. So it keeps its default, which is
    # read-only access to nodes - unremarkable for a telemetry agent, and not
    # where the risk was.
    rbac:
      create: true
      rules:
        - apiGroups: [""]
          resources: ["pods", "pods/log", "namespaces"]
          verbs: ["get", "list", "watch"]
        # Kubernetes events, for the raw.k8s-events topic.
        - apiGroups: ["", "events.k8s.io"]
          resources: ["events"]
          verbs: ["get", "list", "watch"]

    alloy:
      # The node this pod runs on, so it reads only that node's pods (the
      # pod discovery below). Without it every collector read every pod:
      # three copies of each line, which Loki quietly merged and Kafka
      # would not.
      extraEnv:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

      # The three collectors form a cluster so that cluster-wide work - the
      # Kubernetes event stream - is done once, by one of them, rather than
      # three times. Per-node log reading does not need it.
      clustering:
        enabled: true

      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi

      # Alloy's own config language. Components are wired by referencing each
      # other's outputs, so this reads bottom-up: discover pods, relabel them,
      # read their logs, push to Loki.
      #
      # The relabel block is where the cost of this system is decided. Each rule
      # promotes one piece of Kubernetes metadata to a Loki label, and every
      # distinct combination of label values becomes its own stream. These four
      # are bounded by the size of the cluster. Anything derived from log
      # CONTENT - a request id, a user id, a trace id - is unbounded and is how
      # Loki installations die.
      #
      # `node` earns its place here in a way it did not on a single-node
      # cluster, where it was one value forever. With three nodes and pods that
      # move between them, it is the label that answers "was this one node
      # misbehaving, or all of them?" - the first question worth asking about
      # Ceph, the agent pods, or anything else that is now spread out.
      configMap:
        content: |-
          discovery.kubernetes "pods" {
            role = "pod"
            selectors {
              role  = "pod"
              field = "spec.nodeName=" + sys.env("NODE_NAME")
            }
          }

          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_node_name"]
              target_label  = "node"
            }
          }

          loki.source.kubernetes "pod_logs" {
            targets    = discovery.relabel.pod_logs.output
            forward_to = [loki.write.default.receiver, otelcol.receiver.loki.logs.receiver]
          }

          // The same lines, and the cluster's events, to Kafka for the data
          // warehouse (clusters/lab/data/). Each line goes out as OTLP JSON,
          // its Loki labels - namespace, pod, container, node - as
          // attributes beside the line itself.
          otelcol.receiver.loki "logs" {
            output {
              logs = [otelcol.exporter.kafka.logs.input]
            }
          }

          otelcol.exporter.kafka "logs" {
            brokers          = ["kafka.data.svc.cluster.local:9092"]
            protocol_version = "3.6.0"
            logs {
              topic    = "raw.logs"
              encoding = "otlp_json"
            }
          }

          // Every Kubernetes event in every namespace, as JSON. Clustered:
          // one collector holds the watch, so each event is sent once. A
          // rollout of the collectors may re-send a few as the watch moves.
          loki.source.kubernetes_events "events" {
            log_format = "json"
            forward_to = [otelcol.receiver.loki.events.receiver]
            clustering {
              enabled = true
            }
          }

          otelcol.receiver.loki "events" {
            output {
              logs = [otelcol.exporter.kafka.events.input]
            }
          }

          otelcol.exporter.kafka "events" {
            brokers          = ["kafka.data.svc.cluster.local:9092"]
            protocol_version = "3.6.0"
            logs {
              topic    = "raw.k8s-events"
              encoding = "otlp_json"
            }
          }

          loki.write "default" {
            endpoint {
              url = "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
            }
          }
