# Firefly takes the logged-in user from a header, so whoever can reach this pod
# with that header set IS that user. ingress-nginx sets it from oauth2-proxy's
# answer and overwrites any value a browser sends; this policy is what makes
# ingress-nginx the only way in. Without it any pod in the cluster could send
# `X-Auth-Request-Email: <owner's address>` to the Service and be the owner.
#
# The second rule is the daily cron call from this namespace (cronjob.yaml),
# which carries no header and is authorised by its token alone.
#
# k3s enforces NetworkPolicy - see the agents policy for the smoke test.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: firefly-ingress
  namespace: firefly
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: firefly
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: firefly-cron
      ports:
        - protocol: TCP
          port: 8080
