apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.1"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      enabled: true

    # OFF here, where node01's copy has it on, and it has to stay off until a
    # monitoring stack exists on this cluster.
    #
    # The chart creates a ServiceMonitor unconditionally when this is enabled,
    # and ServiceMonitor is a Prometheus-operator CRD that nothing has
    # installed here yet. Helm does not skip an object whose kind is unknown -
    # it fails the release, and the HelmRelease then retries three times and
    # gives up. So this single `true` would take cert-manager itself down with
    # it, which is the opposite of what a monitoring toggle should be able to do.
    #
    # Turn it on in the SAME change that installs kube-prometheus-stack, and
    # bring `servicemonitor.honorLabels: true` across with it - see
    # clusters/homelab/cert-manager/helmrelease.yaml for the label collision
    # that setting exists to fix.
    prometheus:
      servicemonitor:
        enabled: false
