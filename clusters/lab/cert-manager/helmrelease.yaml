apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.1"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      enabled: true

    # OFF here, where node01's copy has it on, and it has to stay off until a
    # monitoring stack exists on this cluster.
    #
    # The chart creates a ServiceMonitor unconditionally when this is enabled,
    # and ServiceMonitor is a Prometheus-operator CRD that nothing has
    # installed here yet. Helm does not skip an object whose kind is unknown -
    # it fails the release, and the HelmRelease then retries three times and
    # gives up. So this single `true` would take cert-manager itself down with
    # it, which is the opposite of what a monitoring toggle should be able to do.
    #
    # This used to say "turn it on in the SAME change that installs
    # kube-prometheus-stack". That change is the one adding
    # clusters/lab/monitoring/ beside this file, and it deliberately does NOT
    # flip this - so the instruction is corrected here rather than quietly
    # disobeyed.
    #
    # The reason is a race that the CRD rule from 5978838 does not cover. That
    # rule is about kustomize-controller, which dry-runs the whole git tree
    # before applying any of it. This object is not in the tree: it is rendered
    # by Helm. What happens instead is that both HelmReleases reconcile at
    # once, and nothing orders cert-manager's upgrade after the Prometheus CRDs
    # have actually been installed. If it loses that race the release fails,
    # burns its three retries in seconds, and then sits broken until the next
    # hourly interval - a working cert-manager taken down by a monitoring
    # toggle, which is precisely what the paragraph above says must not happen.
    #
    # So it goes in the follow-up, once kube-prometheus-stack is RUNNING rather
    # than merely committed, together with Rook's CSI ServiceMonitor and the
    # snapshot controller's. Bring `servicemonitor.honorLabels: true` across
    # with it - see clusters/homelab/cert-manager/helmrelease.yaml for the
    # label collision that setting exists to fix.
    prometheus:
      servicemonitor:
        enabled: false
