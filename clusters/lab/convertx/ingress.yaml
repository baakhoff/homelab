# No tls: block - the controller serves the lab wildcard as its default
# certificate, so this gets HTTPS without naming a Secret, like every other
# Ingress here.
#
# Behind Pocket ID, and that is the whole of ConvertX's login: the Deployment
# switches its own accounts off. ingress-nginx sends each request to
# oauth2-proxy's auth endpoint first and only proxies it on a 202.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: convertx
  namespace: convertx
  annotations:
    nginx.ingress.kubernetes.io/auth-url: http://oauth2-proxy.oauth2-proxy.svc.cluster.local/oauth2/auth
    nginx.ingress.kubernetes.io/auth-signin: https://auth.lab.baakhoff.com/oauth2/start?rd=$scheme://$host$request_uri
    # A video is the largest thing anyone converts, and ingress-nginx caps
    # request bodies at 1m by default with a 413 that names nginx, not
    # ConvertX. 2g is a phone video; the scratch volume holds it and its
    # output twice over.
    nginx.ingress.kubernetes.io/proxy-body-size: "2g"
    # Stream the upload through instead of spooling all of it to the
    # controller pod's disk first and then sending it on.
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: ConvertX
    gethomepage.dev/group: Lab
    gethomepage.dev/icon: convertx.png
    gethomepage.dev/description: Convert files between formats
    # Explicit because there is no tls block for Homepage to infer https from.
    gethomepage.dev/href: https://convert.lab.baakhoff.com
    # No pod-selector: the pods carry app.kubernetes.io/name=convertx, which
    # is what Homepage infers from this Ingress's name.
spec:
  rules:
    - host: convert.lab.baakhoff.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: convertx
                port:
                  number: 80
