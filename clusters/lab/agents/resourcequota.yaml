apiVersion: v1
kind: ResourceQuota
metadata:
  name: agents
  namespace: agents
spec:
  hard:
    # Raised from node01's numbers, which is what that copy's comment said to
    # do once the three-node cluster existed. Raised again for eight pods when
    # the general slots landed, and to nine for slot-4.
    #
    # The arithmetic is deliberately NINE times the per-pod shape in
    # homelab.yaml - 250m and 512Mi requested, 3Gi limit - so nine pods can run
    # at once and the quota is what stops a tenth, rather than a node quietly
    # filling up. There is no headroom in that on purpose: a pod that wants more
    # than the per-pod shape should have to come here and say so.
    #
    # slot-3 came here and said so. It carries a second container, the Xray
    # sidecar that proxies its one VPN-only remote, and a NATIVE sidecar's
    # requests are ADDED to the pod's total rather than max()'d like an ordinary
    # initContainer's - so the quota has to know about it or the pod is rejected
    # at admission. Hence 50m / 64Mi / 256Mi on top of nine times the shape:
    #   cpu     9 x 250m  + 50m   = 2300m
    #   memory  9 x 512Mi + 64Mi  = 4672Mi
    #   limits  9 x 3Gi   + 256Mi = 27904Mi
    # `pods` is unchanged: a sidecar is another container, not another pod.
    #
    # slot-4 came here too. Its limit is 6Gi rather than 3Gi, after four
    # OOM kills at 3Gi in one day - its file records the measurement - so
    # limits.memory carries 3Gi (3072Mi) more on top of the line above:
    #   limits  27904Mi + 3072Mi = 30976Mi
    # Requests are unchanged: the limit is for build spikes, and idle use is
    # under the per-pod request.
    #
    # codex.yaml is a tenth pod at exactly the per-pod shape, so one more of
    # each on top of everything above:
    #   pods    9 + 1               = 10
    #   cpu     2300m   + 250m      = 2550m
    #   memory  4672Mi  + 512Mi     = 5184Mi
    #   limits  30976Mi + 3072Mi    = 34048Mi
    #
    # requests.cpu was previously "3" against a stated six times 250m, which is
    # 1.5 - the comment and the number disagreed. Corrected here rather than
    # scaled up, so the arithmetic above is the arithmetic in the file.
    #
    # limits.memory exceeds what the nodes can actually back: ~27Gi across three
    # machines that also carry etcd, the Ceph OSDs and the mons. That
    # overcommit is safe HERE and would not be anywhere else in this cluster,
    # because agent pods are the only workload at negative priority - under
    # memory pressure the kubelet evicts them first, and preemptionPolicy:
    # Never means they never push anything else off a node to get scheduled in
    # the first place. The quota bounds the blast radius; the priority decides
    # who pays when the bound is optimistic.
    #
    # A quota on a resource also forces every container in the namespace to
    # DECLARE that resource - a project file without requests and limits is
    # rejected at admission rather than scheduled unbounded. limits.cpu is
    # deliberately absent so containers need no CPU limit: throttling an
    # agent's build causes more mystery latency than it prevents.
    requests.cpu: "2550m"
    requests.memory: 5184Mi
    limits.memory: 34048Mi
    pods: "10"
