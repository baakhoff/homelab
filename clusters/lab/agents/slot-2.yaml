# Anonymous slot 2.
#
# The annotated template is homelab.yaml in this directory: every field here is
# explained there and nothing structural varies. What varies per file is the
# name - PVC, Deployment, two label blocks, PROJECT, claimName - and whether
# there is a REPO_URL.
#
# A general slot: no REPO_URL, so it starts with an empty ~/work and you clone
# whatever you want from inside a session. It gives up --spawn worktree, which
# needs a repository to branch from; give the slot a REPO_URL to get it back.
#
# Deliberately says nothing about what runs in it. See images/claude-agent/
# README.md for why that is a property of the manifest and not of a Secret.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: slot-2
  namespace: agents
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slot-2
  namespace: agents
  labels:
    app.kubernetes.io/name: slot-2
    app.kubernetes.io/part-of: agents
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: slot-2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slot-2
        app.kubernetes.io/part-of: agents
    spec:
      priorityClassName: agents
      automountServiceAccountToken: false
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: claude
          image: ghcr.io/baakhoff/claude-agent:2.1.278
          # Always, not IfNotPresent, because the tag is MUTABLE: it is the
          # Claude Code version, so any change to the image that is not a CLI
          # release rebuilds the same tag in place. IfNotPresent keys on the
          # tag, so a node that already holds it never pulls again - and no
          # restart fixes that, because a restart does not pull either. The
          # cost is a registry round-trip per pod start, which for a pod that
          # starts monthly is nothing.
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          tty: true
          stdin: true
          env:
            - name: PROJECT
              value: slot-2
            - name: PERMISSION_MODE
              value: acceptEdits
            # No GIT_AUTHOR_* here, deliberately. A slot exists so that what runs
            # in it is not declared in a public repository, and a baked-in name
            # and address would put that identity on every commit it makes -
            # including in a repo that has nothing to do with this one. Set
            # `git config user.name` and `user.email` per checkout inside the
            # pod; it lands in the checkout's own .git/config, on the volume.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: home
              mountPath: /home/node
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: slot-2
