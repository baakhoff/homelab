# Anonymous slot 3.
#
# The annotated template is homelab.yaml in this directory: every field here is
# explained there and nothing structural varies. What varies per file is the
# name - PVC, Deployment, two label blocks, PROJECT, claimName - and whether
# there is a REPO_URL.
#
# A general slot: no REPO_URL, so it starts with an empty ~/work and you clone
# whatever you want from inside a session. It gives up --spawn worktree, which
# needs a repository to branch from; give the slot a REPO_URL to get it back.
#
# Deliberately says nothing about what runs in it. See images/claude-agent/
# README.md for why that is a property of the manifest and not of a Secret.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: slot-3
  namespace: agents
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slot-3
  namespace: agents
  labels:
    app.kubernetes.io/name: slot-3
    app.kubernetes.io/part-of: agents
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: slot-3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slot-3
        app.kubernetes.io/part-of: agents
    spec:
      priorityClassName: agents
      # A NATIVE SIDECAR - an initContainer with restartPolicy: Always - not an
      # ordinary container. The difference is ordering: this one is started and
      # ready BEFORE the agent container starts, and is torn down after it
      # stops. The agent in this slot cannot reach its remote without the proxy,
      # so "the proxy is up first" is a property worth having from the platform
      # rather than from remembering.
      #
      # WHY A PROXY AT ALL: this slot's remote is a corporate GitLab that is not
      # on the public internet. The pod has no LAN and no tailnet by policy, and
      # that boundary is why an agent is safe to run here - see
      # networkpolicy.yaml. A userspace SOCKS client does not touch it: it needs
      # no capability, and its own outbound connection goes to a server on a
      # public address the policy already allows. ssh reaches it with
      # `ProxyCommand nc -x 127.0.0.1:1080 %h %p` in ~/.ssh/config, so ONLY that
      # one host is proxied and nothing else in the pod is affected.
      initContainers:
        - name: xray
          restartPolicy: Always
          image: ghcr.io/xtls/xray-core:26.9.9
          # IfNotPresent here, unlike the agent container's Always, and the
          # difference is not an oversight: this tag is an upstream VERSION and
          # is immutable, so a cached copy is the same bytes forever. The agent
          # image's tag is mutable - it is the Claude Code version, rebuilt in
          # place when the entrypoint changes - which is why that one must
          # always re-pull.
          imagePullPolicy: IfNotPresent
          # The image's own command reads a config directory; point it at the
          # single file on the volume instead. The config holds the server
          # address and credentials, so it is entered by a person into the
          # volume and is NOT in this repository, which is public.
          args: ["run", "-c", "/home/node/.config/xray/config.json"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: home
              mountPath: /home/node
      automountServiceAccountToken: false
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: claude
          image: ghcr.io/baakhoff/claude-agent:2.1.280
          # Always, not IfNotPresent, because the tag is MUTABLE: it is the
          # Claude Code version, so any change to the image that is not a CLI
          # release rebuilds the same tag in place. IfNotPresent keys on the
          # tag, so a node that already holds it never pulls again - and no
          # restart fixes that, because a restart does not pull either. The
          # cost is a registry round-trip per pod start, which for a pod that
          # starts monthly is nothing.
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          tty: true
          stdin: true
          env:
            - name: PROJECT
              value: slot-3
            - name: PERMISSION_MODE
              value: acceptEdits
            # No GIT_AUTHOR_* here, deliberately. A slot exists so that what runs
            # in it is not declared in a public repository, and a baked-in name
            # and address would put that identity on every commit it makes -
            # including in a repo that has nothing to do with this one. Set
            # `git config user.name` and `user.email` per checkout inside the
            # pod; it lands in the checkout's own .git/config, on the volume.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: home
              mountPath: /home/node
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: slot-3
