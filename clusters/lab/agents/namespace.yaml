apiVersion: v1
kind: Namespace
metadata:
  name: agents
  labels:
    # Pod Security Admission, enforced: every pod in this namespace must meet
    # the `restricted` profile or the API server refuses it. Each Deployment
    # here sets its securityContext by hand anyway; this is the check that a
    # future project file which forgets `capabilities.drop` is rejected at
    # admission instead of scheduled. Agents run arbitrary commands on behalf
    # of a model - this is the namespace where that check earns its keep.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
