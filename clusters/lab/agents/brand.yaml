# Brand work: the personal site, marketing, and whatever joins them.
#
# The annotated template is homelab.yaml in this directory: every field here is
# explained there and nothing structural varies. What varies per file is the
# name - PVC, Deployment, two label blocks, PROJECT, claimName - and whether
# there is a REPO_URL.
#
# A general slot: no REPO_URL, so it starts with an empty ~/work and you clone
# whatever you want from inside a session. It gives up --spawn worktree, which
# needs a repository to branch from; give the slot a REPO_URL to get it back.
#
# Named but repo-less on purpose: it is a group of small repos rather than
# one project, so there is nothing single to clone.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: brand
  namespace: agents
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brand
  namespace: agents
  labels:
    app.kubernetes.io/name: brand
    app.kubernetes.io/part-of: agents
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: brand
  template:
    metadata:
      labels:
        app.kubernetes.io/name: brand
        app.kubernetes.io/part-of: agents
    spec:
      priorityClassName: agents
      # The one agent pod with a Kubernetes identity: it manages its own
      # CronJobs in the brand-jobs namespace and nothing else
      # (clusters/lab/brand-jobs/rbac.yaml). The token is what the Role binds
      # to; networkpolicy-brand.yaml is what lets it reach the API at all.
      serviceAccountName: brand
      automountServiceAccountToken: true
      # The pause container becomes PID 1 and reaps orphans. Otherwise
      # PID 1 is `claude remote-control`, which does not: every headless
      # browser a session's tests start leaves its exited helpers behind as
      # zombies until the pod restarts - slot-4 held 5979 after six days.
      shareProcessNamespace: true
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: claude
          image: ghcr.io/baakhoff/claude-agent:2.1.284
          # Always, not IfNotPresent, because the tag is MUTABLE: it is the
          # Claude Code version, so any change to the image that is not a CLI
          # release rebuilds the same tag in place. IfNotPresent keys on the
          # tag, so a node that already holds it never pulls again - and no
          # restart fixes that, because a restart does not pull either. The
          # cost is a registry round-trip per pod start, which for a pod that
          # starts monthly is nothing.
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          tty: true
          stdin: true
          env:
            - name: PROJECT
              value: brand
            - name: PERMISSION_MODE
              value: acceptEdits
            # Commits the agent makes carry the repo's usual identity.
            - name: GIT_AUTHOR_NAME
              value: baakhoff
            - name: GIT_AUTHOR_EMAIL
              value: a@baakhoff.com
            - name: GIT_COMMITTER_NAME
              value: baakhoff
            - name: GIT_COMMITTER_EMAIL
              value: a@baakhoff.com
            # kubectl's default namespace is the pod's own, agents, where
            # brand may do nothing. This kubeconfig points it at brand-jobs,
            # so `kubectl get cronjobs` means the right thing without -n.
            - name: KUBECONFIG
              value: /etc/kube/config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: home
              mountPath: /home/node
            - name: kubeconfig
              mountPath: /etc/kube
              readOnly: true
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: brand
        - name: kubeconfig
          configMap:
            name: brand-kubeconfig
---
# kubectl's configuration for the brand pod: the in-cluster API, the pod's
# own mounted token and CA, and brand-jobs as the default namespace. Nothing
# secret - the token is read from the file the kubelet mounts and rotates.
apiVersion: v1
kind: ConfigMap
metadata:
  name: brand-kubeconfig
  namespace: agents
data:
  config: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: lab
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: brand
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: brand-jobs
        context:
          cluster: lab
          user: brand
          namespace: brand-jobs
    current-context: brand-jobs
