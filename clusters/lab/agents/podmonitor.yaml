# Prometheus reads, from every agent pod, the date its Claude login runs out
# (images/claude-agent/login-metrics). A claude.ai login lasts 30 days from
# `claude auth login` whatever the use, and a pod past that date serves no
# sessions until someone logs it in again; the alert that warns ahead is
# clusters/lab/monitoring/agent-login-rules.yaml.
#
# By port number, not by name: naming the port would mean a containerPort in
# every agent Deployment, and a change to a pod template restarts the pod and
# ends what its sessions are running.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: agents
  namespace: agents
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: agents
  podMetricsEndpoints:
    - portNumber: 9101
      path: /metrics
      # The date changes once a month. Five minutes is often enough to see a
      # pod that has stopped answering.
      interval: 5m
