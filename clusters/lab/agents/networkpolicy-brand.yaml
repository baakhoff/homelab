# The brand pod's four doors into the lab, on top of networkpolicy.yaml's
# DNS-and-internet egress. Policies add up, so this widens that one pod and
# no other: brand reaches the Firefly API broker and Vikunja's API, and
# manages both through them; the Kubernetes API, where its ServiceAccount
# may manage CronJobs in brand-jobs and nothing else
# (clusters/lab/brand-jobs/rbac.yaml); and ClickHouse's HTTP port, where
# its `brand` user reads the ods layer (clusters/lab/data/clickhouse-schema.yaml).
#
# Each in-cluster door has a matching ingress rule on the far side - in
# clusters/lab/firefly-broker/networkpolicy.yaml,
# clusters/lab/vikunja/networkpolicy.yaml and
# clusters/lab/data/networkpolicy.yaml - and both halves are needed.
# Policies are evaluated after Service DNAT, so the destinations are the
# pods and their container ports, not the Services' port 80.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: brand-lab-apis
  namespace: agents
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: brand
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: firefly-broker
          podSelector:
            matchLabels:
              app.kubernetes.io/name: firefly-broker
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vikunja
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vikunja
      ports:
        - protocol: TCP
          port: 3456
    # ClickHouse over HTTP only; the native port 9000 stays shut.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: clickhouse
      ports:
        - protocol: TCP
          port: 8123
    # The Kubernetes API. Policies see the destination after the Service
    # DNAT, so this is not 10.43.0.1:443 but the API server itself: k3s runs
    # it on every server node's own address, port 6443, and all three nodes
    # are servers (docs/network.md has the addresses). RBAC is what limits
    # what brand can do there; this only lets it ask.
    - to:
        - ipBlock:
            cidr: 192.168.68.102/32
        - ipBlock:
            cidr: 192.168.68.103/32
        - ipBlock:
            cidr: 192.168.68.104/32
      ports:
        - protocol: TCP
          port: 6443
