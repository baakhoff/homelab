# Scratch: work that is not a project yet, and may never be one.
#
# The annotated template is homelab.yaml in this directory: every field here is
# explained there and nothing structural varies. What varies per file is the
# name - PVC, Deployment, two label blocks, PROJECT, claimName - and whether
# there is a REPO_URL.
#
# A general slot: no REPO_URL, so it starts with an empty ~/work and you clone
# whatever you want from inside a session. It gives up --spawn worktree, which
# needs a repository to branch from; give the slot a REPO_URL to get it back.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scratch
  namespace: agents
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scratch
  namespace: agents
  labels:
    app.kubernetes.io/name: scratch
    app.kubernetes.io/part-of: agents
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scratch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scratch
        app.kubernetes.io/part-of: agents
    spec:
      priorityClassName: agents
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/part-of: agents
      automountServiceAccountToken: false
      # The pause container becomes PID 1 and reaps orphans. Otherwise
      # PID 1 is `claude remote-control`, which does not: every headless
      # browser a session's tests start leaves its exited helpers behind as
      # zombies until the pod restarts - slot-4 held 5979 after six days.
      shareProcessNamespace: true
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: claude
          image: ghcr.io/baakhoff/claude-agent:2.1.319
          # Always, not IfNotPresent, because the tag is MUTABLE: it is the
          # Claude Code version, so any change to the image that is not a CLI
          # release rebuilds the same tag in place. IfNotPresent keys on the
          # tag, so a node that already holds it never pulls again - and no
          # restart fixes that, because a restart does not pull either. The
          # cost is a registry round-trip per pod start, which for a pod that
          # starts monthly is nothing.
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          tty: true
          stdin: true
          env:
            # Lets the session send files to the app. Sessions that
            # `claude remote-control` starts otherwise have no upload route
            # and every file is refused ("not on a project thread"):
            # anthropics/claude-code#97301. Undocumented; take it out when
            # that issue is closed.
            - name: CLAUDE_CODE_BRIEF_UPLOAD
              value: "1"
            # Gives the session the Artifact tool, which is how it shows a
            # rendered page; a sent .html file only downloads. Missing from
            # these sessions for the same reason:
            # anthropics/claude-code#88731. Undocumented too.
            - name: CLAUDE_CODE_ARTIFACT
              value: "1"
            - name: PROJECT
              value: scratch
            - name: PERMISSION_MODE
              value: acceptEdits
            # Commits the agent makes carry the repo's usual identity.
            - name: GIT_AUTHOR_NAME
              value: baakhoff
            - name: GIT_AUTHOR_EMAIL
              value: a@baakhoff.com
            - name: GIT_COMMITTER_NAME
              value: baakhoff
            - name: GIT_COMMITTER_EMAIL
              value: a@baakhoff.com
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: home
              mountPath: /home/node
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: scratch
