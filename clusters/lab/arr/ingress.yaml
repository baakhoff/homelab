# Three hosts behind the admin gate (lab-admins only). The apps' own login
# is off - `External`, trusting the gate (radarr.yaml and its siblings).
#
# No tls: block - the controller serves the lab wildcard as its default
# certificate, like every other Ingress here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radarr
  namespace: arr
  annotations:
    nginx.ingress.kubernetes.io/auth-url: http://oauth2-proxy.oauth2-proxy.svc.cluster.local/oauth2/auth?allowed_groups=lab-admins
    nginx.ingress.kubernetes.io/auth-signin: https://auth.lab.baakhoff.com/oauth2/start?rd=$scheme://$host$request_uri
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Radarr
    gethomepage.dev/group: Play
    gethomepage.dev/icon: radarr.png
    gethomepage.dev/description: Pick a film, it arrives in Plex
    gethomepage.dev/href: https://films.lab.baakhoff.com
spec:
  rules:
    - host: films.lab.baakhoff.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: radarr
                port:
                  number: 7878
---
