# FlareSolverr: a headless Chromium that gets past Cloudflare's "checking
# your browser" page for Prowlarr. Since July 2026 RuTracker's login page
# answers anything that is not a real browser with that challenge - a 403
# to Prowlarr - so Prowlarr sends RuTracker's requests here, as an indexer
# proxy (README, step 4), and gets the page back once the browser has passed.
#
# It keeps nothing: each request is a fresh browser session. No volume, no
# backup, nothing for the warehouse.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: arr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: flaresolverr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flaresolverr
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The image's own `flaresolverr` user.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: TZ
              value: Europe/Copenhagen
            - name: LOG_LEVEL
              value: info
          ports:
            - name: http
              containerPort: 8191
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 6
          # A browser: idle it is small, and each challenge opens a tab for
          # a few seconds.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            # Chromium keeps its pages in shared memory; the runtime's 64Mi
            # default makes it crash on a heavy page.
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: flaresolverr
  namespace: arr
spec:
  selector:
    app.kubernetes.io/name: flaresolverr
  ports:
    - name: http
      port: 8191
      targetPort: http
