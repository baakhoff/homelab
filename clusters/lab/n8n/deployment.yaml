apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
spec:
  # One replica on a ReadWriteOnce volume with SQLite on it. Recreate for the
  # reasons the Vaultwarden Deployment spells out: never two processes on one
  # database, and the RBD image maps to one node at a time.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        # node, which the image already runs as.
        runAsUser: 1000
        runAsGroup: 1000
        # kubelet hands the fresh volume's root to this group.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: n8n
          image: docker.io/n8nio/n8n:2.40.7
          # Not read-only at the root: Code nodes run in task runners that
          # the main process starts, and community nodes install under the
          # home directory. Neither has one fixed place to mount over.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            # The address n8n puts in every link it hands out: webhook URLs
            # shown in the editor, OAuth redirect URLs for connecting a
            # Google or GitHub account. Without it they say localhost:5678.
            - name: N8N_HOST
              value: n8n.lab.baakhoff.com
            - name: N8N_PROTOCOL
              value: https
            - name: WEBHOOK_URL
              value: https://n8n.lab.baakhoff.com/
            # ingress-nginx is the one hop in front: read the client's
            # address and scheme from its X-Forwarded headers.
            - name: N8N_PROXY_HOPS
              value: "1"
            # The zone Schedule triggers fire in. TZ is the process's own,
            # for timestamps in the logs.
            - name: GENERIC_TIMEZONE
              value: Europe/Copenhagen
            - name: TZ
              value: Europe/Copenhagen
            # No encryption key from a Secret: on first start n8n generates
            # one into ~/.n8n/config, on the volume beside the database it
            # protects (pvc.yaml). This keeps that file readable by n8n only.
            - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
              value: "true"
            # No telemetry, no phoning home for the update banner - Renovate
            # does updates - and no usage questionnaire at signup.
            - name: N8N_DIAGNOSTICS_ENABLED
              value: "false"
            - name: N8N_VERSION_NOTIFICATIONS_ENABLED
              value: "false"
            - name: N8N_PERSONALIZATION_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 5678
          # Migrations run before the server listens, and a major version's
          # can take a while. Five minutes before liveness gets a vote.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 30
          # Checks the database too, not only that the process answers.
          readinessProbe:
            httpGet:
              path: /healthz/readiness
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data
