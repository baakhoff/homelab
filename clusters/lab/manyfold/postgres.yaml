# Manyfold's database: every model's details, tags, creators, collections,
# users and API applications. Its own Postgres, like Outline's, rather than
# a shared one. The files themselves are on the NAS (pvc.yaml); each
# model's folder there also carries its details in datapackage.json.
#
# The user created here is the database's superuser, and Manyfold signs in as
# it to run its migrations, which it does by itself at every start.
apiVersion: v1
kind: Service
metadata:
  name: manyfold-postgres
  namespace: manyfold
spec:
  selector:
    app.kubernetes.io/name: manyfold-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: manyfold-postgres
  namespace: manyfold
spec:
  serviceName: manyfold-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: manyfold-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: manyfold-postgres
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The alpine image's postgres user.
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: docker.io/library/postgres:18.6-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: manyfold
            - name: POSTGRES_DB
              value: manyfold
            # Read only when the database is first created. Changing it in
            # the Secret later does not change it here - README.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: manyfold
                  key: DATABASE_PASSWORD
            # A subdirectory, because the volume's root holds lost+found and
            # initdb refuses a non-empty directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "manyfold", "-d", "manyfold"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "manyfold", "-d", "manyfold"]
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-block
        resources:
          requests:
            storage: 2Gi
