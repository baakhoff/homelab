apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
  namespace: backup
spec:
  # 02:00, an hour ahead of node01's 03:00 timer. Both machines write to the
  # same bucket over the same domestic uplink, and while they are separate
  # repositories they are not separate bandwidth. Moves to whenever suits once
  # node01 is gone.
  schedule: "0 2 * * *"

  # LOAD-BEARING, not hygiene. The driver names its temporary objects
  # deterministically and deletes any leftovers it finds before starting, so a
  # second concurrent run would delete the first one's snapshot and clone out
  # from under a restic Job that is still reading them.
  concurrencyPolicy: Forbid

  # A missed schedule is retried for an hour rather than skipped silently.
  # Beyond that the next night's run is the better answer than a backup
  # starting at lunchtime.
  startingDeadlineSeconds: 3600

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      # The driver is not idempotent-by-retry in a useful way: if it failed,
      # the next scheduled run does the same work from a clean state. A
      # backoffLimit above zero mostly produces a second failure and a
      # confusing pair of pods.
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: backup-driver
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
          containers:
            - name: driver
              # Alpine-based because the driver is a shell script and BOTH
              # official kubectl images are distroless - registry.k8s.io/kubectl
              # and rancher/kubectl are scratch plus a static binary, with no
              # /bin/sh to run anything in. This one carries a shell, kubectl
              # and jq.
              #
              # It also carries helm, kustomize and the AWS CLI, none of which
              # are wanted here - 300MB for a job that needs perhaps 60MB. The
              # clean fix is an image built in this repo alongside
              # images/claude-agent, holding exactly kubectl and restic, which
              # would also let the driver and the restic Jobs share one image.
              # Worth doing; not worth blocking the first backup on.
              image: alpine/k8s:1.35.8
              command: ["/bin/sh", "/script/backup.sh"]
              env:
                # WHITESPACE-SEPARATED namespace/pvc pairs.
                #
                # Derived from hosts/node01/backup/restic-excludes.txt, whose
                # arguments transfer directly: Prometheus and Loki are left out
                # (both already delete themselves on a retention policy, their
                # blocks churn constantly, and losing them costs history rather
                # than capability), and the agents volume is left out because
                # nothing on it is an original - a clone, a login and caches.
                #
                # That leaves Grafana and Alertmanager, which is barely
                # anything, and that is the honest state of this cluster: the
                # first volume here worth protecting arrives with Vaultwarden.
                # The system exists now so that it is proven before then.
                #
                # BOTH NAMES SHOULD BE CONFIRMED against `kubectl -n monitoring
                # get pvc` on first run. Grafana's is predictable; the
                # Alertmanager one is generated by the operator from the
                # StatefulSet and its volumeClaimTemplate and is long and
                # version-sensitive. The driver fails loudly on a name it
                # cannot find rather than skipping it.
                - name: BACKUP_TARGETS
                  value: >-
                    monitoring/kube-prometheus-stack-grafana
                    monitoring/alertmanager-kube-prometheus-stack-alertmanager-db-alertmanager-kube-prometheus-stack-alertmanager-0
                - name: SNAPSHOT_CLASS
                  value: ceph-block
                - name: STORAGE_CLASS
                  value: ceph-block
                # renovate: datasource=docker depName=restic/restic
                - name: RESTIC_IMAGE
                  value: restic/restic:0.19.1
                # The Secret the spawned Jobs read their repository credentials
                # from. It has to exist in every namespace named in
                # BACKUP_TARGETS - Secrets do not cross namespaces, and the Job
                # runs where the volume is. See README.md.
                - name: RESTIC_SECRET
                  value: restic-repo
                # Every snapshot in this repository is written as host `lab`,
                # regardless of which pod wrote it. See the long note in the
                # driver script - this is what keeps parent detection and
                # retention working at all.
                - name: RESTIC_HOST
                  value: lab
                - name: SNAPSHOT_TIMEOUT
                  value: 10m
                - name: JOB_TIMEOUT_SECONDS
                  value: "10800"
                # Only this key, rather than envFrom on the whole Secret: the
                # driver never touches the repository and has no business
                # holding an S3 key that can delete backups. Optional, so the
                # backup runs before any heartbeat check exists - which is the
                # state it is landing in.
                - name: HC_URL
                  valueFrom:
                    secretKeyRef:
                      name: restic-repo
                      key: HC_URL
                      optional: true
                # kubectl writes a discovery cache under $HOME and warns
                # noisily on every call when it cannot. uid 65534 has no home
                # directory in this image, so it gets a writable one.
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: script
                  mountPath: /script
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: script
              configMap:
                name: backup-driver
            - name: tmp
              emptyDir: {}
