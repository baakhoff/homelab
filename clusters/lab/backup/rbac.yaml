apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-driver
  namespace: backup
---
# A ClusterRole used as a DEFINITION, not as a cluster-wide grant. Nothing
# binds it with a ClusterRoleBinding; each target namespace gets its own
# RoleBinding below, and the driver has these rights there and nowhere else.
#
# That distinction is the whole security argument here. `create` cannot be
# restricted by resourceNames - Kubernetes has no way to say "may create Jobs
# called bk-*" - so the only available scope is the namespace. And the right
# to create a Job in a namespace IS the right to read every Secret in it: a
# Job is a pod spec, and a pod spec can mount anything. A single
# ClusterRoleBinding would therefore hand this ServiceAccount every secret on
# the cluster in exchange for backing up two volumes.
#
# Same reasoning as the trimmed rules in clusters/lab/logging/alloy.yaml. A
# backup driver has no business in namespaces that hold nothing it backs up.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backup-driver
rules:
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # The clone, created from the snapshot and thrown away afterwards. `get` on
  # the source PVC comes from the same rule - the driver reads its size and
  # storage class to build the clone.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # Reading the restic Job's output back into the driver's own log, so one
  # `kubectl logs` on the CronJob shows what restic actually did rather than
  # only whether it exited zero.
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # The preflight check reads the restic-repo Secret in the target's namespace
  # before it takes a snapshot. Missing on 2026-09-19, which is worse than it
  # sounds: `kubectl get secret` came back Forbidden, the check swallowed stderr,
  # saw no output and reported "the Secret is missing" - for all three targets,
  # while all three Secrets existed with all six keys. A check that cannot tell
  # "absent" from "not allowed to look" sends you to fix the wrong thing.
  #
  # NOT an escalation. This ClusterRole already grants `create` on Jobs in these
  # namespaces, and a Job is a pod spec that can mount any Secret in its own
  # namespace - which is why the binding is per-namespace in the first place.
  # Reading one directly is strictly less than what creating a Job already
  # allows.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
# One of these per namespace holding a backed-up volume. Adding a namespace to
# the backup is this object, a copy of the restic-repo Secret, and one entry in
# BACKUP_TARGETS - nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-driver
  namespace: monitoring
subjects:
  - kind: ServiceAccount
    name: backup-driver
    namespace: backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backup-driver
---
# The volume this whole backup was built ahead of. Until now the driver
# protected Grafana and Alertmanager, which are convenient to have and
# reconstructible without them; this is the first claim on the cluster whose
# loss is not recoverable from git, a registry or an upstream.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-driver
  namespace: vaultwarden
subjects:
  - kind: ServiceAccount
    name: backup-driver
    namespace: backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backup-driver
---
# The world. A game save is not a password vault, but it is the same class of
# thing: the only copy of something that cannot be regenerated. Bound ahead of
# the BACKUP_TARGETS entry on purpose - see clusters/lab/minecraft/README.md
# for the order the three pieces have to land in, and why.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-driver
  namespace: minecraft
subjects:
  - kind: ServiceAccount
    name: backup-driver
    namespace: backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backup-driver
---
# The identity provider. Passkey public keys, users and OIDC clients: all
# rebuildable by hand, none of it pleasant to rebuild. Bound ahead of the
# BACKUP_TARGETS entry for the reason the Minecraft binding above gives -
# clusters/lab/pocket-id/README.md has the order.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-driver
  namespace: pocket-id
subjects:
  - kind: ServiceAccount
    name: backup-driver
    namespace: backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backup-driver
---
# The paper. Contracts, receipts, the letters that arrive once - the archive
# exists so that these are no longer only on paper, which makes the volume the
# only copy of things that were scanned and then recycled. Bound ahead of the
# BACKUP_TARGETS entry, in the order clusters/lab/paperless/README.md gives.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-driver
  namespace: paperless
subjects:
  - kind: ServiceAccount
    name: backup-driver
    namespace: backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backup-driver
---
# The budget. Years of transactions and the categories they were sorted
# into; every device holds a copy, but only until its browser data is
# cleared, and the server's is the one they all sync from. Bound ahead of the
# BACKUP_TARGETS entry, in the order clusters/lab/actual/README.md gives.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-driver
  namespace: actual
subjects:
  - kind: ServiceAccount
    name: backup-driver
    namespace: backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backup-driver
