apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  # 0 = PARKED, and this is the whole reason the cutover is safe.
  #
  # THE DATA IS IN PLACE, so this is 1. Was 0 while the Deployment existed
  # ahead of its data: started empty it would have generated a fresh RSA
  # keypair and an empty database into the volume, and the window between
  # "manifests applied" and "data copied" would have contained a running,
  # reachable, EMPTY password vault.
  #
  # One replica, and that is not a capacity decision. Vaultwarden keeps
  # everything in a single SQLite file on the volume below, so two replicas
  # would be two processes writing one database.
  #
  # Both the park and this unpark are commits rather than `kubectl scale`,
  # because Flux reverts a hand-scaled Deployment within a minute - which, mid
  # copy, would have started Vaultwarden on top of a half-written database.
  # Same class as the two-commit rules already established here for SOPS and
  # for cert-manager's CRDs: a declarative system that converges still cannot
  # converge around an ordering constraint.
  #
  # What arrived on the volume, verified rather than assumed: every file's
  # sha256 matched node01's, `db.sqlite3-wal` among them. The WAL had survived
  # the shutdown instead of being checkpointed away, so it held writes the
  # database file alone did not - which is why the copy took the whole
  # directory rather than just db.sqlite3.
  replicas: 1
  # Recreate, NOT the default RollingUpdate - the most consequential line in
  # this file. RollingUpdate starts the new pod BEFORE terminating the old one,
  # and every image bump would briefly run two Vaultwarden processes against one
  # SQLite database. WAL mode makes that survivable more often than not, which
  # is the worst property a corruption risk can have: it fails rarely, silently,
  # and inside the data rather than in the logs.
  #
  # It carries a second meaning on this cluster, the same one the agent pods'
  # Deployment notes: a ReadWriteOnce RBD image is mapped by exactly one node,
  # so if the pod is moving nodes the old one must unmap before the new one can
  # map. RollingUpdate would start the replacement first and deadlock waiting
  # for a volume its predecessor still holds.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vaultwarden
  template:
    metadata:
      labels:
        # Homepage builds its health-badge selector as
        # `app.kubernetes.io/name=<name inferred from the Ingress>`. Following
        # the convention here means the Ingress needs no pod-selector
        # annotation, unlike Grafana's which predates it.
        app.kubernetes.io/name: vaultwarden
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # kubelet chowns the volume to this GID and sets setgid on it, which is
        # what lets an unprivileged uid write to a freshly provisioned PV. Drop
        # this and the container cannot create its database, which presents as
        # CrashLoopBackOff with a permission error in `logs --previous`.
        #
        # It is also why the cutover runbook ends with a chown: fsGroup fixes
        # the GROUP on the volume's contents, not the owner, and files arriving
        # from node01 by tar carry node01's uids.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vaultwarden
          # THE SAME VERSION NODE01 WAS RUNNING, on purpose. Vaultwarden
          # migrates its database schema forward on startup, so a newer image
          # meeting the copied data would do a migration and a machine move at
          # once - and if the vault then misbehaved there would be two
          # candidates and no way to separate them.
          #
          # The cutover is done and verified, so that reason has expired: this
          # is now an ordinary pin and Renovate's bump can be taken like any
          # other.
          image: vaultwarden/server:1.37.3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            # Required, and not cosmetic. DOMAIN is the origin Vaultwarden
            # hands to WebAuthn, so getting it wrong does not break the site -
            # it breaks hardware security keys, at the moment you need them.
            #
            # UNCHANGED FROM NODE01, which is the migration working as
            # designed: both clusters hold a certificate for this name and DNS
            # decides which one answers. Had the hostname changed, every
            # passkey registered against the old origin would stop working -
            # the single best argument in this repo for why a service moves by
            # gaining an A record rather than by being renamed.
            - name: DOMAIN
              value: https://vault.lab.baakhoff.com
            # Vaultwarden listens on 80 by default, and binding below 1024
            # needs CAP_NET_BIND_SERVICE - which the capability drop above
            # removes. Moving the listener above 1024 is what makes running
            # unprivileged with no capabilities possible at all.
            - name: ROCKET_PORT
              value: "8080"
            # Closed, and it must STAY closed through the cutover. The copied
            # database brings its accounts with it; this being "true" for even
            # a few minutes while the new host is reachable is public
            # registration against a password vault.
            - name: SIGNUPS_ALLOWED
              value: "false"
            # Inert while signups are closed, and kept anyway. If this is ever
            # flipped back on, the whitelist is already in place rather than
            # being a second thing to remember at the moment it matters.
            - name: SIGNUPS_DOMAINS_WHITELIST
              value: baakhoff.com
            # Explicitly at its default so the behaviour is visible in git
            # rather than assumed. Vaultwarden fetches a favicon for every
            # entry in the vault, from the server, which means this cluster
            # makes an outbound request to every site you hold an account with.
            # Set this to "true" to stop that; the cost is a vault list with no
            # icons.
            - name: DISABLE_ICON_DOWNLOAD
              value: "false"
          ports:
            - name: http
              containerPort: 8080
          # /alive is Vaultwarden's own health endpoint and returns the server
          # time. Deliberately not probing / - that serves the web vault's
          # static assets and would report healthy with a broken database
          # underneath it.
          readinessProbe:
            httpGet:
              path: /alive
              port: http
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-data
