# The server's two SQLite databases (accounts and the sync index) and every
# budget file, on one volume for the reason pvc.yaml in paperless/ gives: one
# volume is one snapshot is one consistent moment for the nightly backup.
#
# 2Gi: a budget file is a few megabytes after years of transactions, and the
# server keeps one per budget plus its sync messages. Expandable in place if
# that ever turns out wrong.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: actual-data
  namespace: actual
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 2Gi
