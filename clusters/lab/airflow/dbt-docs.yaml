# dbt's documentation site for the warehouse project (pipelines/dbt/): the
# lineage graph from raw to dm, every model's SQL, and every column with its
# description and its type as ClickHouse reports it.
# https://dbt.lab.baakhoff.com, behind the admin gate (the Ingress at the end).
#
# One pod, two containers sharing an emptyDir:
#
#   generate  the Airflow image, for the dbt in /opt/dbt that the warehouse
#             DAG runs. Hourly: download main's pipelines/dbt/ from GitHub,
#             run `dbt docs generate --static` against ClickHouse as the same
#             `dbt` user, and swap the one-file site into place. A failed run
#             logs why and leaves the previous page up.
#   nginx     serves that file.
#
# Why not the dbt Docs page Cosmos can add to Airflow's own UI: it reads the
# generated files from a local path or object storage, and they would be
# written in the scheduler pod but read in the API server pod. The lab has no
# ReadWriteMany volume and no bucket Airflow reaches, so that route needs
# storage this page does not.
#
# Hourly, so the page trails main by at most an hour; delete the pod to
# regenerate now. Nothing here is state: the page is rebuilt from the repo and
# the warehouse on every start, so there is nothing to back up and nothing to
# feed into ClickHouse.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dbt-docs
  namespace: airflow
data:
  generate.py: |
    """Regenerate the dbt docs site from main, hourly, forever."""
    import io
    import os
    import shutil
    import subprocess
    import tarfile
    import time
    import urllib.request

    # A tarball of main rather than a git clone: no git needed in the image,
    # and only pipelines/dbt/ is unpacked.
    TARBALL = "https://codeload.github.com/baakhoff/homelab/tar.gz/refs/heads/main"
    DBT = "/opt/dbt/bin/dbt"
    WORK = "/work"
    SITE = "/site"
    PERIOD = 3600
    RETRY = 300

    PLACEHOLDER = (
        "<!doctype html><title>dbt docs</title>"
        "<p>The first generation has not finished yet. "
        "It runs at pod start; the generate container's log says how it went.</p>"
    )


    def log(msg):
        print(f"dbt-docs: {msg}", flush=True)


    def fetch():
        dest = os.path.join(WORK, "src")
        shutil.rmtree(dest, ignore_errors=True)
        os.makedirs(dest)
        with urllib.request.urlopen(TARBALL, timeout=60) as r:
            data = r.read()
        with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as t:
            members = [m for m in t.getmembers() if "/pipelines/dbt/" in m.name]
            t.extractall(dest, members=members, filter="data")
        top = next(os.scandir(dest)).path
        return os.path.join(top, "pipelines", "dbt")


    def generate(project):
        target = os.path.join(WORK, "target")
        shutil.rmtree(target, ignore_errors=True)
        env = dict(
            os.environ,
            DBT_PROJECT_DIR=project,
            DBT_PROFILES_DIR=project,
            DBT_TARGET_PATH=target,
            DBT_LOG_PATH=os.path.join(WORK, "logs"),
        )
        subprocess.run([DBT, "docs", "generate", "--static"], env=env, check=True)
        tmp = os.path.join(SITE, ".index.html.new")
        shutil.copyfile(os.path.join(target, "static_index.html"), tmp)
        os.replace(tmp, os.path.join(SITE, "index.html"))


    if not os.path.exists(os.path.join(SITE, "index.html")):
        with open(os.path.join(SITE, "index.html"), "w") as f:
            f.write(PLACEHOLDER)

    while True:
        try:
            generate(fetch())
            log(f"generated; next run in {PERIOD}s")
            time.sleep(PERIOD)
        except Exception as e:  # noqa: BLE001 - any failure keeps the old page
            log(f"generation failed, previous page kept: {e!r}; retry in {RETRY}s")
            time.sleep(RETRY)

  # Serves the one file, and a health path for the probes.
  default.conf: |
    server {
      listen 8080;
      root /site;
      index index.html;
      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }
      location / {
        try_files $uri /index.html;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: dbt-docs
  namespace: airflow
spec:
  selector:
    app.kubernetes.io/name: dbt-docs
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbt-docs
  namespace: airflow
  labels:
    app.kubernetes.io/name: dbt-docs
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dbt-docs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dbt-docs
      annotations:
        # Bump with every edit to the ConfigMap above, so Flux rolls the pod:
        # neither the script nor the nginx config is re-read while running.
        dbt-docs.lab/config-revision: "1"
    spec:
      # The Airflow image reads AIRFLOW_* variables as its own settings; the
      # Services in this namespace would otherwise inject some.
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generate
          # The same tag as the Airflow release (helmrelease.yaml); keep the
          # two together. Always, for the reason given there: the tag is
          # rebuilt in place when the image's dbt pins move.
          image: ghcr.io/baakhoff/airflow:3.2.2
          imagePullPolicy: Always
          # Straight to Python, past the image's entrypoint, which would
          # otherwise look for an Airflow database this pod has no use for.
          command: ["python", "/config/generate.py"]
          securityContext:
            # The image's airflow user; group 0 is how that image is built.
            runAsUser: 50000
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            # dbt keeps per-user files under HOME; the root filesystem is
            # read-only.
            - name: HOME
              value: /work
            # dbt reports anonymous usage to its maker by default.
            - name: DBT_SEND_ANONYMOUS_USAGE_STATS
              value: "false"
            # The `dbt` ClickHouse user's password, the one key this pod
            # needs from the Secret the scheduler reads all of.
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: airflow-sources
                  key: CLICKHOUSE_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: work
              mountPath: /work
            - name: site
              mountPath: /site
            - name: tmp
              mountPath: /tmp
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.30.5-alpine
          securityContext:
            # The account the unprivileged image is built around.
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: site
              mountPath: /site
              readOnly: true
            # The image's pid file and request buffers live under /tmp.
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: dbt-docs
        - name: site
          emptyDir: {}
        - name: work
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
---
# Behind the admin gate (lab-admins only), its only lock: the page shows
# every table and column in the warehouse. No tls: block - the controller
# serves the lab wildcard as its default certificate.
#
# networkpolicy.yaml already admits ingress-nginx to port 8080 on every pod
# here and lets every pod out to ClickHouse and GitHub; the ClickHouse side
# admits this pod by name (clusters/lab/data/networkpolicy.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dbt-docs
  namespace: airflow
  annotations:
    nginx.ingress.kubernetes.io/auth-url: http://oauth2-proxy.oauth2-proxy.svc.cluster.local/oauth2/auth?allowed_groups=lab-admins
    nginx.ingress.kubernetes.io/auth-signin: https://auth.lab.baakhoff.com/oauth2/start?rd=$scheme://$host$request_uri
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: dbt docs
    gethomepage.dev/group: Data
    gethomepage.dev/icon: mdi-graph-outline
    gethomepage.dev/description: Models, lineage and columns
    gethomepage.dev/href: https://dbt.lab.baakhoff.com
    gethomepage.dev/pod-selector: app.kubernetes.io/name=dbt-docs
spec:
  rules:
    - host: dbt.lab.baakhoff.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dbt-docs
                port:
                  number: 80
