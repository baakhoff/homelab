# SparkyFitness's database: every diary entry, meal, measurement and setting,
# and the users. Its own Postgres, like Airflow's, rather than a shared one.
#
# The user created here is the database's superuser, and the server signs in
# as it to run migrations, as upstream's Docker Compose does. At its first
# start the server creates a second, limited role for everyday queries,
# with row-level security, from SPARKY_FITNESS_APP_DB_PASSWORD.
apiVersion: v1
kind: Service
metadata:
  name: sparkyfitness-postgres
  namespace: sparkyfitness
spec:
  selector:
    app.kubernetes.io/name: sparkyfitness-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sparkyfitness-postgres
  namespace: sparkyfitness
spec:
  serviceName: sparkyfitness-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sparkyfitness-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sparkyfitness-postgres
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The alpine image's postgres user.
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: docker.io/library/postgres:18.6-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: sparky
            - name: POSTGRES_DB
              value: sparkyfitness
            # Read only when the database is first created. Changing it in
            # the Secret later does not change it here - README.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sparkyfitness
                  key: SPARKY_FITNESS_DB_PASSWORD
            # A subdirectory, because the volume's root holds lost+found and
            # initdb refuses a non-empty directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "sparky", "-d", "sparkyfitness"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "sparky", "-d", "sparkyfitness"]
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-block
        resources:
          requests:
            storage: 5Gi
