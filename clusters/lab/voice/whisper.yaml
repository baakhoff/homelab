# Speech to text - one of Assist's two speech services, Piper beside this
# file is the other. A client streams audio in, a transcript comes back. The
# protocol is Wyoming, which is just enough structure for Home Assistant to
# treat it as an stt platform and never learn what is behind the port.
#
# The image runs as root (its entrypoint is bash docker_run.sh; upstream has
# no non-root story for it), so the hardening is everything below that: no
# capabilities, no privilege escalation, no service-account token. The
# process reads a model under /data, binds a port, and receives network
# traffic - that is all it does.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wyoming-whisper-data
  namespace: voice
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wyoming-whisper
  namespace: voice
  labels:
    app.kubernetes.io/name: wyoming-whisper
    app.kubernetes.io/part-of: voice
spec:
  # One replica on a ReadWriteOnce volume, Recreate - the same reason as
  # everything else with an RBD image: it maps to one node at a time.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wyoming-whisper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wyoming-whisper
        app.kubernetes.io/part-of: voice
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wyoming-whisper
          image: rhasspy/wyoming-whisper:3.8.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          # The entrypoint already pins --uri to tcp://0.0.0.0:10300 and both
          # --data-dir and --download-dir to /data; these args are appended.
          # medium-int8 is the quality side of the trade: a ~750 MB first
          # download, ~1 GB resident, a couple of seconds per command on
          # this class of CPU. --language stays at its default (auto-detect);
          # pin it only if the house ever speaks one language to it.
          args: ["--model", "medium-int8"]
          ports:
            - name: wyoming
              containerPort: 10300
          # The server starts listening only once the model is loaded - on
          # first boot that is a download of some minutes - so the startup
          # probe holds restarts off for twenty. Past that, all probes are a
          # plain TCP connect: this image has no HTTP anywhere.
          startupProbe:
            tcpSocket:
              port: wyoming
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            tcpSocket:
              port: wyoming
          livenessProbe:
            tcpSocket:
              port: wyoming
            periodSeconds: 30
          resources:
            # Idle is ~0 CPU with the model resident in RAM; a command is a
            # 2-4 s burst across a few cores. The 1Gi request makes the
            # scheduler pay most of the model's standing cost; 3Gi is
            # headroom for the decode spike. Watch `kubectl -n voice top
            # pods` for a week and right-size from that - starting point,
            # not a measurement.
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wyoming-whisper-data
---
apiVersion: v1
kind: Service
metadata:
  name: wyoming-whisper
  namespace: voice
spec:
  selector:
    app.kubernetes.io/name: wyoming-whisper
  ports:
    - name: wyoming
      port: 10300
      targetPort: wyoming
