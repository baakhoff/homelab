# epicurus, as Kubernetes workloads rather than a compose stack in an Incus
# container on node01. The decision is ADR 0007; this file is it happening.
#
# LANDING EMPTY ON PURPOSE. Every data engine below starts on a fresh PVC, and
# the data is copied in afterwards. A working empty install is what makes a
# failed migration diagnosable: without it, a stack that will not start leaves
# you unable to tell "the chart is misconfigured" from "the data did not copy".
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: epicurus
  namespace: epicurus
spec:
  interval: 1h
  chart:
    spec:
      # A path inside the GitRepository, not a chart name in a registry - see
      # gitrepository.yaml for why there is no HelmRepository here.
      chart: ./infra/k8s/epicurus
      sourceRef:
        kind: GitRepository
        name: epicurus
        namespace: flux-system
      interval: 10m
  install:
    remediation:
      retries: 3
    # 23 workloads, several of which wait on Postgres, NATS and the OpenBao
    # bootstrap Job before they report ready. The 5m default expires while a
    # healthy stack is still coming up, and a timed-out install rolls back -
    # which reads as a broken chart.
    timeout: 20m
  upgrade:
    remediation:
      retries: 3
    timeout: 20m
  values:
    # ── Images ───────────────────────────────────────────────────────────────
    image:
      # NOT left blank. Blank resolves to `.Chart.AppVersion`, which in the
      # unreleased chart is the literal string `latest` - so the default here
      # is an unpinned tag wearing the costume of a default. `testing` matches
      # what node01 runs and what gitrepository.yaml tracks: the images CI
      # built from the same branch this chart came from.
      tag: testing

    # ── Storage ──────────────────────────────────────────────────────────────
    # Named rather than left blank. `ceph-block` IS the default on this cluster,
    # so omitting it would work today and silently produce something else on a
    # cluster where it is not - and a manifest in git should not depend on a
    # cluster-wide setting it never mentions. Applies to every PVC the chart
    # creates.
    storageClass: ceph-block

    # ── Secrets ──────────────────────────────────────────────────────────────
    # MANDATORY here, and the chart says why in its own values file: `helm
    # uninstall` deletes a chart-generated Secret while the PVCs survive, and a
    # regenerated POSTGRES_PASSWORD does not match old PGDATA. Letting the chart
    # generate these would make the data intact and unreadable.
    #
    # All seven keys are in secret.sops.yaml: POSTGRES_PASSWORD,
    # NATS_CORE_PASSWORD, NATS_MODULE_PASSWORD, NATS_SYS_PASSWORD,
    # OAUTH_STATE_SECRET, MINIO_ROOT_USER, MINIO_ROOT_PASSWORD. They are hex,
    # not base64, because POSTGRES_PASSWORD is interpolated into a DSN and hex
    # has no `+`, `/` or `=` to escape.
    secrets:
      existingSecret: epicurus-secrets

    # ── Ingress ──────────────────────────────────────────────────────────────
    ingress:
      enabled: true
      className: nginx
      # UNCHANGED from node01, which is the migration working as designed: both
      # clusters can hold a certificate for this name and DNS decides which one
      # answers. Rollback is deleting one A record.
      host: epicurus.lab.baakhoff.com
      path: /
      pathType: Prefix
      tls:
        # ingress-nginx serves the lab wildcard as its DEFAULT certificate, so
        # naming a secret here would fight that rather than help it. Every other
        # Ingress on this cluster is written the same way.
        enabled: false
      # THE MAP IS REPLACED WHOLESALE, not merged - so the chart's four defaults
      # are repeated here rather than inherited. Dropping them is not cosmetic:
      # upstream calls them the #887 lesson. An ingress that buffers a body or
      # caps it refuses a tenant-archive import long before the core sees a
      # byte, and buffering breaks streamed chat outright.
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
        nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
        # Discovered by Homepage. href given explicitly because there is no tls
        # block here, so it would otherwise be inferred as http:// and redirect.
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: epicurus
        gethomepage.dev/group: Services
        gethomepage.dev/icon: mdi-robot
        gethomepage.dev/description: Assistant - core, web shell and modules
        gethomepage.dev/href: https://epicurus.lab.baakhoff.com

    # ── NetworkPolicy ────────────────────────────────────────────────────────
    # On, because k3s enforces policy here - the agents namespace already
    # depends on that, verified by a smoke test that got a connection refused
    # rather than a certificate error.
    #
    # Ingress-only: modules answer only to the core, the core only to the web
    # and the modules, the data plane only to those. Egress is deliberately
    # unrestricted upstream - websearch and hosted LLM providers need it, and a
    # default-deny egress is a footgun.
    #
    # `webIngressFrom` left empty means any pod in the cluster may reach
    # web:8080, which is what lets ingress-nginx through without naming its
    # namespace. IF THE WEB SHELL IS UNREACHABLE AFTER A CHANGE HERE, this is
    # the first thing to suspect.
    networkPolicy:
      enabled: true

    # ── Metrics ──────────────────────────────────────────────────────────────
    # This closes one of ADR 0003's accepted costs: "the application exposes its
    # own /metrics endpoints and nothing reads them yet". kube-prometheus-stack
    # is already running on this cluster, so the PodMonitor CRD exists before
    # this release renders one - the ordering constraint that bit three times
    # elsewhere in this repo does not apply here, but it is the reason to check
    # rather than assume.
    #
    # NO `labels:` BLOCK, and that is checked rather than assumed. The chart
    # offers `metrics.podMonitor.labels` for "the labels the Prometheus
    # resource's podMonitorSelector matches on" - which on most clusters means
    # `release: kube-prometheus-stack`, because kube-prometheus-stack defaults
    # to selecting only its own. This cluster's monitoring release sets
    # `podMonitorSelectorNilUsesHelmValues: false`, so the selector is nil and
    # matches EVERY PodMonitor in the cluster. Adding the label here would be
    # harmless and would document a rule this cluster does not follow.
    metrics:
      podAnnotations: true
      podMonitor:
        enabled: true

    # ── Inference: hosted, not local ─────────────────────────────────────────
    # THE DELIBERATE BEHAVIOUR CHANGE FROM NODE01, and it is bigger than it
    # looks, so it is written down rather than left to be inferred.
    #
    # node01 runs inference ENTIRELY LOCALLY - `docker inspect` on its core
    # reports LLM_DEFAULT_MODEL=llama3.2 and MEMORY_EMBED_MODEL=nomic-embed-text.
    # That is what the 2.2 GB of models on its Ollama volume is. ADR 0003 says
    # the runtime "stays running but never loads a model" and that inference
    # goes to a hosted provider; that describes an intention the running system
    # does not match. The `llm/openrouter` entry in node01's vault was a stored
    # credential, not evidence of use.
    #
    # `enabled: false` ALONE DOES NOT WORK. The chart's `epicurus.ollamaUrl`
    # helper treats "no Ollama at all" as a configuration error rather than a
    # third valid state, and fails the install with `ollama.external.url is
    # required when ollama.enabled is false`. Pointing at a hostname that can
    # never resolve is upstream's own unblock: `.invalid` is reserved by
    # RFC 2606, so an accidental call fails fast with NXDOMAIN instead of
    # hanging on a connect timeout. Nothing should reach for it.
    ollama:
      enabled: false
      external:
        url: "http://ollama.invalid:11434"

    core:
      # NOT `nomic-embed-text`, which is the local model and the reason this
      # line cannot be copied from node01.
      #
      # THE CONSEQUENCE, stated because it is invisible otherwise: every vector
      # in node01's 51 MB Qdrant volume was produced by nomic-embed-text at 768
      # dimensions, and text-embedding-3-small is 1536. The vectors and the
      # model that made them are one unit. So `qdrant-data` is NOT migrated -
      # carrying it while changing the model gives a dimension mismatch at best
      # and a silently wrong similarity space at worst.
      #
      # The source content lives in Postgres and survives. The vectors are
      # derived data and get rebuilt, which means MEMORY AND KNOWLEDGE SEARCH
      # ARE EMPTY until a re-index runs. That is a manual step nothing else in
      # the migration implies.
      memoryEmbedModel: gpt/text-embedding-3-small
      llm:
        defaultModel: openrouter/deepseek/deepseek-v4.1-flash
        # Blank on purpose. Bootstrap models are pulled into a local runtime,
        # and there is no longer a local runtime to pull them into.
        bootstrapModels: ""
