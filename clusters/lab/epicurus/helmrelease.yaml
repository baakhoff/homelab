# epicurus, as Kubernetes workloads rather than a compose stack in an Incus
# container on node01. The decision is ADR 0007; this file is it happening.
#
# LANDING EMPTY ON PURPOSE. Every data engine below starts on a fresh PVC, and
# the data is copied in afterwards. A working empty install is what makes a
# failed migration diagnosable: without it, a stack that will not start leaves
# you unable to tell "the chart is misconfigured" from "the data did not copy".
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: epicurus
  namespace: epicurus
spec:
  interval: 1h
  chart:
    spec:
      # A path inside the GitRepository, not a chart name in a registry - see
      # gitrepository.yaml for why there is no HelmRepository here.
      chart: ./infra/k8s/epicurus
      sourceRef:
        kind: GitRepository
        name: epicurus
        namespace: flux-system
      interval: 10m
  install:
    remediation:
      # Back to 3 now that the release installs cleanly.
      #
      # It was temporarily 0 during the bring-up, and the reason is worth
      # keeping: install remediation UNINSTALLS the release before retrying,
      # which deletes every pod and therefore every log. A bootstrap Job that
      # failed four times left four pod names that no longer existed by the time
      # anyone asked them why - indistinguishable from a Job that never ran. At
      # 0, `remediateLastFailure` defaults to false and a failed install is left
      # standing to be read. Worth doing again the next time something here
      # fails in a way that needs diagnosing rather than retrying.
      retries: 3
    # 23 workloads, several of which wait on Postgres, NATS and the OpenBao
    # bootstrap Job before they report ready. The 5m default expires while a
    # healthy stack is still coming up, and a timed-out install rolls back -
    # which reads as a broken chart.
    timeout: 20m
  upgrade:
    remediation:
      retries: 3
    timeout: 20m
  # ── Two chart bugs worked around here, both real and both upstream ───────
  # postRenderers rather than values, because neither knob exists in the chart.
  # Both should become chart fixes; these go away when they do.
  postRenderers:
    - kustomize:
        patches:
          # 1. SEARXNG CANNOT START, and every workload here is one name
          #    collision away from the same fate.
          #
          #    Kubernetes injects Docker-link-style variables for every Service
          #    in the namespace: `<NAME>_PORT=tcp://<clusterIP>:<port>`. The
          #    Service named `searxng` therefore sets
          #    SEARXNG_PORT=tcp://10.43.x.x:8080, and SearXNG's entrypoint reads
          #    SEARXNG_PORT expecting an integer for granian:
          #
          #      Error: Invalid value for '--port':
          #      'tcp://10.43.247.63:8080' is not a valid integer.
          #
          #    Nothing injects those under Compose, which is why this has never
          #    been seen. It breaks any Kubernetes install of this chart.
          #
          #    Disabling the links wholesale rather than pinning SEARXNG_PORT:
          #    the release has a Service named after openbao, minio, nats,
          #    qdrant, postgres and every module, so the next collision is
          #    latent rather than hypothetical. Nothing in this stack uses the
          #    legacy variables - it addresses services by DNS name.
          - target:
              kind: Deployment
            patch: |
              - op: add
                path: /spec/template/spec/enableServiceLinks
                value: false
          - target:
              kind: StatefulSet
            patch: |
              - op: add
                path: /spec/template/spec/enableServiceLinks
                value: false

          # 3. THE WEB SHELL CANNOT RESOLVE THE CORE on the `testing` branch.
          #    nginx proxies /platform/ to CORE_APP_URL and resolves that name
          #    at REQUEST time through a resolver, and nginx does not apply
          #    /etc/resolv.conf's `search` list. The chart's
          #    `epicurus.platformUrl` helper returns the bare
          #    `http://core-app:8080`, so every /platform/ request 502s with
          #    `core-app could not be resolved (3: Host not found)` while both
          #    probes stay green - /healthz is a static handler that never
          #    touches the resolver, which is what makes a broken NAME look like
          #    a broken CORE. The core is fine throughout: its log shows the
          #    calendar and tasks pods getting 200s, because they resolve
          #    through the OS resolver, which does apply the search list.
          #
          #    FIXED UPSTREAM ON `main`, which grew a second helper described as
          #    "the core's URL *as nginx must be given it* - fully qualified,
          #    unlike every other endpoint in this chart", plus a
          #    `clusterDomain` value. Neither is on `testing`. This goes away
          #    when that merges down.
          #
          #    A STRATEGIC MERGE PATCH, not `web.extraEnv`, and the difference
          #    matters. extraEnv appends a SECOND env entry with the same name.
          #    The kubelet would take the last one, but nothing ever gets that
          #    far: Helm's server-side apply treats env as a map keyed by name
          #    and rejects the object outright -
          #
          #      failed to create typed patch object (epicurus/web):
          #      .spec.template.spec.containers[name="web"].env:
          #      duplicate entries for key [name="CORE_APP_URL"]
          #
          #    - which failed the upgrade, exhausted the retries and rolled the
          #    release back, so the pod kept the bare value and the override
          #    looked like it had simply not worked. A strategic merge patch
          #    merges env BY NAME, so this replaces the entry rather than
          #    adding to it.
          - target:
              kind: Deployment
              name: web
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: web
              spec:
                template:
                  spec:
                    containers:
                      - name: web
                        env:
                          - name: CORE_APP_URL
                            value: http://core-app.epicurus.svc.cluster.local:8080

          # 2. OPENBAO CANNOT WRITE ITS VOLUME.
          #
          #      chown: /openbao/data/core: Permission denied
          #
          #    The chart starts the container as uid 0 with CHOWN/SETUID/SETGID
          #    so it can chown a freshly provisioned root-owned volume by name,
          #    then execs the image entrypoint, which drops to uid 100. The
          #    chown fails here anyway, and because the command is
          #    `chown ... && exec ...` the exec never happens and the container
          #    exits non-zero. Everything downstream then waits forever on
          #    `http://openbao:8200`, which is what made the bootstrap Job and
          #    core-app's Init look like the problem.
          #
          #    This is the chart's own documented escape hatch, verbatim from
          #    the template: "Set fsGroup in podSecurityContext and override
          #    this command if your cluster forbids a root start."
          #
          #    fsGroup makes the kubelet chown the volume to gid 100 and set
          #    setgid, which is the mechanism this cluster already relies on for
          #    Vaultwarden and the agent pods. With the volume group-writable,
          #    no chown is needed: the container starts as uid 100 directly, the
          #    image entrypoint sees a non-root uid and skips its own chown, and
          #    the three capabilities that only existed to serve that handoff
          #    are dropped. IPC_LOCK stays - it is what lets the server mlock
          #    its memory so secrets never reach swap.
          #
          #    fsGroupChangePolicy: OnRootMismatch so the recursive chown is
          #    skipped once the top-level ownership is already right, rather
          #    than walking the volume on every restart.
          - target:
              kind: StatefulSet
              name: openbao
            patch: |
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: openbao
              spec:
                template:
                  spec:
                    securityContext:
                      runAsUser: 100
                      runAsGroup: 100
                      fsGroup: 100
                      fsGroupChangePolicy: OnRootMismatch
                    containers:
                      - name: openbao
                        securityContext:
                          runAsUser: 100
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: ["ALL"]
                            add: ["IPC_LOCK"]
                        args:
                          - "exec docker-entrypoint.sh server -config=/openbao/config/config.hcl"
  values:
    # ── Images ───────────────────────────────────────────────────────────────
    image:
      # NOT left blank. Blank resolves to `.Chart.AppVersion`, which in the
      # unreleased chart is the literal string `latest` - so the default here
      # is an unpinned tag wearing the costume of a default. `testing` is what
      # gitrepository.yaml tracks: the images CI built from the same branch
      # this chart came from.
      #
      # A tag alone does NOT keep them current. CI re-pushes `:testing` without
      # changing the name, so nothing rolls out, and the chart's IfNotPresent
      # keeps each node's cached copy. follow-testing.yaml pins every Deployment
      # to the digest `:testing` currently points at, which is what makes a new
      # build actually arrive. Leave pullPolicy alone: the chart has one global
      # setting, and `Always` would also cover Postgres and the other
      # third-party images - see follow-testing.yaml for why that is worse.
      tag: testing

    # ── Storage ──────────────────────────────────────────────────────────────
    # Named rather than left blank. `ceph-block` IS the default on this cluster,
    # so omitting it would work today and silently produce something else on a
    # cluster where it is not - and a manifest in git should not depend on a
    # cluster-wide setting it never mentions. Applies to every PVC the chart
    # creates.
    storageClass: ceph-block

    # ── Secrets ──────────────────────────────────────────────────────────────
    # MANDATORY here, and the chart says why in its own values file: `helm
    # uninstall` deletes a chart-generated Secret while the PVCs survive, and a
    # regenerated POSTGRES_PASSWORD does not match old PGDATA. Letting the chart
    # generate these would make the data intact and unreadable.
    #
    # All seven keys are in secret.sops.yaml: POSTGRES_PASSWORD,
    # NATS_CORE_PASSWORD, NATS_MODULE_PASSWORD, NATS_SYS_PASSWORD,
    # OAUTH_STATE_SECRET, MINIO_ROOT_USER, MINIO_ROOT_PASSWORD. They are hex,
    # not base64, because POSTGRES_PASSWORD is interpolated into a DSN and hex
    # has no `+`, `/` or `=` to escape.
    secrets:
      existingSecret: epicurus-secrets

    # ── Ingress ──────────────────────────────────────────────────────────────
    ingress:
      enabled: true
      className: nginx
      # UNCHANGED from node01, which is the migration working as designed: both
      # clusters can hold a certificate for this name and DNS decides which one
      # answers. Rollback is deleting one A record.
      host: epicurus.lab.baakhoff.com
      path: /
      pathType: Prefix
      tls:
        # ingress-nginx serves the lab wildcard as its DEFAULT certificate, so
        # naming a secret here would fight that rather than help it. Every other
        # Ingress on this cluster is written the same way.
        enabled: false
      # THE MAP IS REPLACED WHOLESALE, not merged - so the chart's four defaults
      # are repeated here rather than inherited. Dropping them is not cosmetic:
      # upstream calls them the #887 lesson. An ingress that buffers a body or
      # caps it refuses a tenant-archive import long before the core sees a
      # byte, and buffering breaks streamed chat outright.
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
        nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
        # Discovered by Homepage. href given explicitly because there is no tls
        # block here, so it would otherwise be inferred as http:// and redirect.
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: epicurus
        gethomepage.dev/group: Tools
        gethomepage.dev/icon: mdi-robot
        gethomepage.dev/description: The household assistant
        gethomepage.dev/href: https://epicurus.lab.baakhoff.com

    # ── NetworkPolicy ────────────────────────────────────────────────────────
    # On, because k3s enforces policy here - the agents namespace already
    # depends on that, verified by a smoke test that got a connection refused
    # rather than a certificate error.
    #
    # Ingress-only: modules answer only to the core, the core only to the web
    # and the modules, the data plane only to those. Egress is deliberately
    # unrestricted upstream - websearch and hosted LLM providers need it, and a
    # default-deny egress is a footgun.
    #
    # `webIngressFrom` left empty means any pod in the cluster may reach
    # web:8080, which is what lets ingress-nginx through without naming its
    # namespace. IF THE WEB SHELL IS UNREACHABLE AFTER A CHANGE HERE, this is
    # the first thing to suspect.
    networkPolicy:
      enabled: true

    # ── Metrics ──────────────────────────────────────────────────────────────
    # This closes one of ADR 0003's accepted costs: "the application exposes its
    # own /metrics endpoints and nothing reads them yet". kube-prometheus-stack
    # is already running on this cluster, so the PodMonitor CRD exists before
    # this release renders one - the ordering constraint that bit three times
    # elsewhere in this repo does not apply here, but it is the reason to check
    # rather than assume.
    #
    # NO `labels:` BLOCK, and that is checked rather than assumed. The chart
    # offers `metrics.podMonitor.labels` for "the labels the Prometheus
    # resource's podMonitorSelector matches on" - which on most clusters means
    # `release: kube-prometheus-stack`, because kube-prometheus-stack defaults
    # to selecting only its own. This cluster's monitoring release sets
    # `podMonitorSelectorNilUsesHelmValues: false`, so the selector is nil and
    # matches EVERY PodMonitor in the cluster. Adding the label here would be
    # harmless and would document a rule this cluster does not follow.
    #
    # Discoverable is not the same as reachable. The NetworkPolicies above shut
    # Prometheus out of port 8080 along with everyone else, and for as long as
    # nothing opened it TargetDown reported every epicurus target down.
    # networkpolicy-metrics.yaml beside this file is the door; if that alert
    # ever returns for this namespace, check that the policy still exists and
    # that the pods still carry `epicurus.io/metrics: "true"`.
    metrics:
      podAnnotations: true
      podMonitor:
        enabled: true

    # ── MinIO images: the chart's own pins, deliberately not overridden ──────
    # There used to be a `minio:` block here that moved `image.repository` and
    # `initImage.repository` to quay.io, after MinIO Inc. pulled the chart's
    # tags from Docker Hub. It set the repository and left the tag to the
    # chart - half of a two-part pin. Then chart 0.2.1 (epicurus #974,
    # 2026-09-26) changed both halves, to `docker.io/pgsty/minio` and
    # `docker.io/pgsty/mc` with new tags, because quay.io had started
    # answering 401 to anonymous pulls of the whole repository. The override
    # kept the old repository and picked up the new tags, and the result,
    # `quay.io/minio/minio:RELEASE.2026-08-04T00-00-00Z`, exists nowhere. That
    # was ImagePullBackOff on minio-0, KubeStatefulSetReplicasMismatch on
    # epicurus/minio and KubeJobFailed on minio-init-23 on 2026-09-28.
    #
    # The rule this leaves behind: a third-party image in this chart is
    # repository AND tag, and an override here sets both or neither. Neither,
    # now: the pgsty images are a community-maintained fork of the AGPL MinIO
    # server and client, not MinIO Inc., and that choice was made upstream in
    # the chart, where it is documented, tested against, and Renovate's to
    # move. Overriding it here would only recreate the drift that broke.
    #
    # Still true, and worth keeping: a running container is not evidence that
    # its image can still be fetched. node01 ran the Docker Hub images for
    # months after the tags were gone, from its local store.

    # ── SearXNG: only engines that answer from this connection ──────────────
    # Measured 2026-09-28 from the pod, one engine at a time, query "Belgrade",
    # egress = the household's Orion Telekom address:
    #
    #   duckduckgo   CAPTCHA                 startpage   suspended: CAPTCHA
    #   brave        too many requests       google      200 with zero results
    #   yahoo        HTTP protocol error     presearch   HTTP error
    #   qwant        access denied (region)  bing        200 with zero results
    #   mojeek       200 with zero results
    #   yandex       10 results              seznam      9 results
    #   wiby         12 results              wikipedia   infobox only, by design
    #
    # SearXNG's defaults for this build enable exactly five general engines:
    # duckduckgo, brave, startpage, google and wikipedia. Everything else in
    # the table is disabled upstream. So every search asked four engines that
    # cannot answer from here plus one that only returns an infobox, got back
    # an empty list with `unresponsive_engines` set, and the app showed "No
    # web results found" for everything. Each rejected request also extends
    # the suspension the engine already has on this address, so leaving them
    # on makes the situation worse over time.
    #
    # Note for the next measurement: `engines=<name>` queries an engine even
    # when it is disabled, so the probe says whether an engine answers, not
    # whether the default search uses it. The first version of this override
    # missed that, switched off the failing five and switched on bing and
    # mojeek, and the default search then asked nothing that answers.
    #
    # `settings` replaces the whole file, so the shipped one is repeated
    # here - keep it in step with infra/k8s/epicurus/files/searxng-settings.yml
    # upstream. `use_default_settings: true` merges the `engines` entries by
    # name into SearXNG's defaults, so only the flags differ. The secret_key
    # is the same placeholder the compose stack ships: SearXNG is reachable
    # only from the websearch module and the key guards CSRF on a UI nobody
    # opens, which is why it is a ConfigMap and not in secret.sops.yaml.
    #
    # Yandex is the only broad general index in the set that works; Seznam
    # is Czech-centred and Wiby is a small index of hand-made pages. Scraping
    # from one fixed home IP will always be this brittle; if search becomes
    # something that must work, the next step is an engine with an API key,
    # stored in secret.sops.yaml and mounted as a settings file instead of
    # this value.
    searxng:
      settings: |
        use_default_settings: true
        server:
          secret_key: "epicurus-internal-search-placeholder-change-me"
          limiter: false
          image_proxy: false
        search:
          formats:
            - html
            - json
          default_lang: "en"
          autocomplete: ""
        general:
          debug: false
          instance_name: "epicurus-search"
        engines:
          # Off: enabled upstream, refuse this address.
          - name: duckduckgo
            disabled: true
          - name: brave
            disabled: true
          - name: startpage
            disabled: true
          - name: google
            disabled: true
          # On: disabled upstream, answer from here.
          - name: yandex
            disabled: false
          - name: seznam
            disabled: false
          - name: wiby
            disabled: false

    # ── Inference: hosted, not local ─────────────────────────────────────────
    # THE DELIBERATE BEHAVIOUR CHANGE FROM NODE01, and it is bigger than it
    # looks, so it is written down rather than left to be inferred.
    #
    # node01 ran inference ENTIRELY LOCALLY - `docker inspect` on its core
    # reported LLM_DEFAULT_MODEL=llama3.2 and MEMORY_EMBED_MODEL=nomic-embed-text.
    # That is what the 2.2 GB of models on its Ollama volume was. ADR 0003 says
    # the runtime "stays running but never loads a model" and that inference
    # goes to a hosted provider; that describes an intention the running system
    # does not match. The `llm/openrouter` entry in node01's vault was a stored
    # credential, not evidence of use.
    #
    # `enabled: false` ALONE DOES NOT WORK. The chart's `epicurus.ollamaUrl`
    # helper treats "no Ollama at all" as a configuration error rather than a
    # third valid state, and fails the install with `ollama.external.url is
    # required when ollama.enabled is false`. Pointing at a hostname that can
    # never resolve is upstream's own unblock: `.invalid` is reserved by
    # RFC 2606, so an accidental call fails fast with NXDOMAIN instead of
    # hanging on a connect timeout. Nothing should reach for it.
    ollama:
      enabled: false
      external:
        url: "http://ollama.invalid:11434"

    core:
      # NOT `nomic-embed-text`, which is the local model and the reason this
      # line cannot be copied from node01.
      #
      # THE CONSEQUENCE, stated because it is invisible otherwise: every vector
      # in node01's 51 MB Qdrant volume was produced by nomic-embed-text at 768
      # dimensions, and text-embedding-3-small is 1536. The vectors and the
      # model that made them are one unit. So `qdrant-data` is NOT migrated -
      # carrying it while changing the model gives a dimension mismatch at best
      # and a silently wrong similarity space at worst.
      #
      # The source content lives in Postgres and survives. The vectors are
      # derived data and get rebuilt, which means MEMORY AND KNOWLEDGE SEARCH
      # ARE EMPTY until a re-index runs. That is a manual step nothing else in
      # the migration implies.
      memoryEmbedModel: gpt/text-embedding-3-small
      llm:
        defaultModel: openrouter/deepseek/deepseek-v4.1-flash
        # Blank on purpose. Bootstrap models are pulled into a local runtime,
        # and there is no longer a local runtime to pull them into.
        bootstrapModels: ""
