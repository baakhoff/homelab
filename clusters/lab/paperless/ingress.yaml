# No tls: block - the controller serves the lab wildcard as its default
# certificate, so this gets HTTPS without naming a Secret, like every other
# Ingress here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperless
  namespace: paperless
  annotations:
    # A scanned document is a multi-page PDF, and a phone's camera scan of a
    # contract can run to tens of megabytes. ingress-nginx caps request bodies
    # at 1m by default and answers with a 413 that names nginx, not Paperless.
    nginx.ingress.kubernetes.io/proxy-body-size: "256m"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Paperless
    gethomepage.dev/group: Lab
    gethomepage.dev/icon: paperless-ngx.png
    gethomepage.dev/description: Document archive
    # Explicit because there is no tls block for Homepage to infer https from.
    gethomepage.dev/href: https://paperless.lab.baakhoff.com
    # No pod-selector: the pods carry app.kubernetes.io/name=paperless, which
    # is what Homepage infers from this Ingress's name.
spec:
  rules:
    - host: paperless.lab.baakhoff.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paperless
                port:
                  number: 80
