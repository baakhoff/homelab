# Alerting on CVEs in the images the cluster runs, from Trivy Operator's
# daily scans (clusters/lab/trivy-operator/).
#
# Critical only, and only CVEs a newer package fixes - the operator reports
# nothing else at CRITICAL (its helmrelease.yaml says why). HIGH is in the
# reports too, for looking up, not for Telegram: there are too many of them
# for a message about each to mean anything.
#
# A second rule catches images whose OS no longer gets fixes at all, which
# the first cannot see.
#
# Alerts only where this lab can do something:
#   - a critical CVE in an image built here (ghcr.io/baakhoff/...): a rebuild
#     fixes it, so each image gets an alert.
#   - an image on an end-of-life OS, unless it is on the short list below of
#     images whose project has published nothing newer.
#
# Everyone else's images do not alert at all. On the first day there were
# eighty alerts, most for one library CVE in an image whose project had not
# published a newer one, and Telegram got a message each time one of them
# changed. For those the fix arrives as a Renovate PR, and that PR is the
# notice; the reports stay for looking up
# (kubectl get vulnerabilityreports -A -o wide).
#
# What does alert re-notifies weekly rather than twice a day (the route in
# helmrelease.yaml).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: trivy
  namespace: monitoring
spec:
  groups:
    - name: trivy
      rules:
        # max_over_time because each image's report is deleted and made
        # again every day: between the two the series is gone, and a plain
        # instant query would resolve the alert and fire it afresh, a
        # resolved and a firing message a day for the same CVE. Three hours
        # covers the gap; it also keeps the alert three hours after the image
        # is upgraded. max rather than sum by image: an image run by two
        # workloads has a report for each, with the same count.
        - alert: ContainerImageCriticalCVE
          expr: |-
            max by (namespace, image_registry, image_repository, image_tag) (
              max_over_time(trivy_image_vulnerabilities{severity="Critical", image_repository=~"baakhoff/.+"}[3h])
            ) > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.image_repository }}:{{ $labels.image_tag }} has {{ $value }} critical CVE(s) with a fix"
            description: >-
              A newer package fixes them, and this image is built here:
              rebuild it on a newer base, or upgrade the package in its
              Dockerfile. kubectl -n {{ $labels.namespace }} get vulnerabilityreports -o wide
              lists the reports; kubectl describe on one names its CVEs.

        # The other half of ignoreUnfixed. An image built on an OS release
        # that has reached its end of life gets no fixed packages, so its CVEs
        # never count as fixable and the rule above never sees them. This
        # asks only whether the base is still supported. The answer is a
        # newer image too, or, if upstream has stopped publishing, another
        # project.
        #
        # Left out by name: images whose project has no newer release, so
        # the alert could only repeat. Take one off the list when its
        # project publishes again, or when the app is replaced.
        #   kafbat/kafka-ui      - Renovate finds nothing newer than 1.5.0
        #   corentinth/it-tools  - no release since 2024
        - alert: ContainerImageOSEndOfLife
          expr: |-
            max by (namespace, image_registry, image_repository, image_tag, image_os_family, image_os_name) (
              max_over_time(trivy_image_info{image_os_eosl="true", image_repository!~"kafbat/kafka-ui|corentinth/it-tools"}[3h])
            ) > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.image_repository }}:{{ $labels.image_tag }} is built on {{ $labels.image_os_family }} {{ $labels.image_os_name }}, which no longer gets security fixes"
            description: >-
              Its CVEs are never fixed, so the critical-CVE alert stays quiet
              about it. Update to an image on a supported base.
