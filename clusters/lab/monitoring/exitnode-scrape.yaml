# The Pi's node-exporter (hosts/exitnode/), scraped for one reason: the
# metrics its apt-metrics timer writes, pending security updates and whether
# a reboot is due, read by host-security-rules.yaml beside this file.
#
# Its own job, not `node-exporter`: the stack's node alerts and dashboards
# select that job, and the OLED's node page lists it, both meant for the
# three cluster nodes. Only systemd's address filter on the Pi lets this
# scrape in (hosts/exitnode/prometheus-node-exporter.conf).
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: exitnode
  namespace: monitoring
spec:
  jobName: exitnode
  scrapeInterval: 5m
  staticConfigs:
    - targets: ["192.168.68.65:9100"]
