# A second door into Prometheus, for the Pi's OLED screens
# (hosts/exitnode/oled). A script cannot do the Pocket ID login the main
# Ingress demands, so this one takes a password instead and opens exactly
# one path: /api/v1/query, the instant-query endpoint. No UI, no ranges, no
# admin API — everything else on this host is a 404.
#
# A password rather than an allow-list of the Pi's address: klipper's
# ServiceLB forwards with externalTrafficPolicy Cluster, so by the time a
# request reaches nginx its source is a node, not the Pi, and an IP rule
# would admit the whole cluster while looking like it admitted one machine.
#
# The htpasswd line lives in prometheus-api-auth.sops.yaml, as APR1
# (`openssl passwd -apr1`): nginx verifies that format itself, where other
# schemes are handed to the C library's crypt() and depend on what it has.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-api
  namespace: monitoring
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: prometheus-api-auth
    nginx.ingress.kubernetes.io/auth-realm: prometheus-api
spec:
  rules:
    - host: prometheus-api.lab.baakhoff.com
      http:
        paths:
          - path: /api/v1/query
            pathType: Exact
            backend:
              service:
                name: kube-prometheus-stack-prometheus
                port:
                  number: 9090
