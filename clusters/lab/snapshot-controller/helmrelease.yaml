# The CSI snapshot controller, and with it the ability to take a
# point-in-time copy of an RBD volume.
#
# WHY THIS EXISTS AT ALL: backups. hosts/node01/backup/restic-backup.sh opens
# by admitting its own weakest property - it walks a LIVE filesystem, so a
# database is copied over several minutes and what lands in the repository is
# crash-consistent rather than atomic. That header also names the fix: "a
# copy-on-write storage pool ... so you snapshot, back up the frozen snapshot
# and delete it", followed by "This pool is `dir`" - correct but too expensive
# to take nightly, since every snapshot there is a full 58G copy.
#
# Ceph RBD snapshots ARE copy-on-write. They are instant and charge only for
# what changes afterwards. So the limitation node01 documented and accepted is
# one this cluster can simply not have, and this chart is the missing piece
# between "the storage can do it" and "Kubernetes can ask it to".
#
# k3s does not ship any of this. The VolumeSnapshot CRDs and the controller
# that acts on them are a separate SIG Storage component in every distribution
# - Rook assumes you have installed it and says so. Ceph-CSI's own snapshotter
# sidecar is already running as part of the Rook CSI driver; it is the
# cluster-wide half that was missing, which is why `kubectl get
# volumesnapshotclass` returned "the server doesn't have a resource type" and
# not an empty list.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
  namespace: snapshot-controller
spec:
  interval: 1h
  chart:
    spec:
      chart: snapshot-controller
      # 5.2.0 rather than 5.3.0, which is the current release and was cut
      # TODAY. renovate.json5 holds every other chart here behind
      # `minimumReleaseAge: 3 days` because charts get yanked and re-cut, and
      # adopting one the hour it lands is the thing that policy exists to
      # prevent - it would be strange to bypass it by hand on the way in.
      # Both versions carry the same appVersion, v8.6.0, so the wait costs
      # nothing but the chart packaging. Renovate will offer 5.3.0 once it has
      # aged.
      version: "5.3.0"
      sourceRef:
        kind: HelmRepository
        name: piraeus
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      # Same reason and same number as cert-manager's: the ServiceMonitor below
      # is a kind only kube-prometheus-stack installs, and on a bare bootstrap
      # this release must be able to outwait it rather than fail three times and
      # stay failed. The full argument is in clusters/lab/cert-manager/.
      retries: -1
  upgrade:
    remediation:
      retries: 3
  values:
    # The CRDs come from the chart, and NOTHING that needs them may be in the
    # same release. That sentence is the whole content of this block and it was
    # learned the hard way on 2026-09-18.
    #
    # This file used to define the ceph-block VolumeSnapshotClass below, on the
    # reasoning that the rule from 5978838 - kustomize-controller dry-runs every
    # object in the git tree before applying any of it - did not apply, because a
    # chart value is not an object in the tree. That reasoning was wrong, and the
    # comment it replaced confidently predicted the opposite of what happened:
    #
    #     Helm install failed ... no matches for kind "VolumeSnapshotClass"
    #     in version "snapshot.storage.k8s.io/v1" - ensure CRDs are installed first
    #
    # Helm resolves a REST mapping for EVERY object in a release before applying
    # ANY of it, and this chart ships its CRDs as ordinary templates rather than
    # in the special crds/ directory - which is the one place Helm installs ahead
    # of everything else. So the render failed client-side, nothing was applied,
    # the CRDs never landed, and each retry failed identically. Three remediation
    # retries against a deadlock rather than a race.
    #
    # The rule is about the EXISTENCE OF A TYPE, not about where the object
    # lives. kustomize-controller dry-runs the tree; helm-controller dry-runs the
    # release; both refuse a kind the API server has never heard of. Same
    # constraint, two layers.
    #
    # So the VolumeSnapshotClass is a separate file in a separate commit, exactly
    # as clusters/lab/cert-manager/clusterissuer.yaml is - and like that one, it
    # HAS TO STAY that way on a rebuild from a bare bootstrap.
    installCRDs: true

    controller:
      # One replica with leader election left on, which reads like a
      # contradiction and is not: the lease is what stops a rolling update
      # from briefly running two controllers against the same snapshots.
      replicaCount: 1

      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi

      serviceMonitor:
        # On, with cert-manager's, now that kube-prometheus-stack is running.
        # Rook's CSI one did not come along after all - see the reason in
        # clusters/lab/rook-ceph/helmrelease.yaml. What this buys is small but
        # real: the controller becomes a scrape target, so the stack's own
        # TargetDown rule notices if it stops answering, and its snapshot
        # operation metrics are there to look at when a nightly backup takes
        # longer than it should.
        create: true

    webhook:
      # The conversion webhook only matters for clusters still holding
      # VolumeGroupSnapshot objects in the older v1beta1/v1beta2 APIs. This
      # cluster has never had a snapshot of any kind, so there is nothing to
      # convert - and enabling it would mean a TLS certificate and a failure
      # mode that blocks snapshot writes when it is unhealthy.
      enabled: false
