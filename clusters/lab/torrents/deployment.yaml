# qBittorrent's settings at its first start. It rewrites the file as it
# runs, so this is copied in only when there is none yet; after that the
# web UI owns it. What matters is set here so nobody has to click it:
#
#   LocalHostAuth=false       the VPN container tells qBittorrent which port
#                             PIA forwarded, over localhost, without a login
#   AuthSubnetWhitelist       no second login behind the Pocket ID gate, and
#                             none for Radarr and Sonarr: the pod network is
#                             trusted, and the NetworkPolicy decides who in
#                             it can reach this pod at all
#   HostHeaderValidation      off, because requests arrive for
#                             torrents.lab.baakhoff.com through ingress-nginx
#   DefaultSavePath           the NAS share; Radarr and Sonarr add their own
#                             subfolders as categories
apiVersion: v1
kind: ConfigMap
metadata:
  name: qbittorrent-defaults
  namespace: torrents
data:
  qBittorrent.conf: |
    [BitTorrent]
    Session\DefaultSavePath=/data/downloads
    Session\Interface=tun0
    Session\InterfaceName=tun0

    [Preferences]
    WebUI\Port=8080
    WebUI\LocalHostAuth=false
    WebUI\AuthSubnetWhitelistEnabled=true
    WebUI\AuthSubnetWhitelist=10.42.0.0/16
    WebUI\HostHeaderValidation=false
---
# One pod, two containers sharing one network: the VPN, and qBittorrent
# inside it. qBittorrent has no way to the internet but the tunnel - the VPN
# container's firewall drops everything else, so if the tunnel is down,
# torrents stop rather than leak the house's address.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: torrents
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # Names are resolved by the VPN container, over the tunnel, rather
      # than by the cluster's DNS: a lookup is the other way an address
      # leaks, and the cluster's DNS server is outside the tunnel anyway.
      dnsPolicy: None
      dnsConfig:
        nameservers: [127.0.0.1]
      initContainers:
        # The first-start settings above, only if there are none yet.
        - name: defaults
          image: docker.io/library/busybox:1.37.0
          command: ["sh", "-c", "mkdir -p /config/qBittorrent && [ -f /config/qBittorrent/qBittorrent.conf ] || cp /defaults/qBittorrent.conf /config/qBittorrent/"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: defaults
              mountPath: /defaults
        # The VPN, as a sidecar that starts first: qBittorrent starts only
        # once the tunnel is up and its health check passes.
        - name: gluetun
          image: docker.io/qmcgaw/gluetun:v3.41.3
          restartPolicy: Always
          securityContext:
            # The tunnel device and the firewall. Nothing else here has it.
            capabilities:
              add: [NET_ADMIN]
          env:
            - name: TZ
              value: Europe/Copenhagen
            - name: VPN_SERVICE_PROVIDER
              value: private internet access
            # PIA's account name and password - secret.sops.yaml, README
            # step 1.
            - name: OPENVPN_USER
              valueFrom:
                secretKeyRef:
                  name: pia
                  key: OPENVPN_USER
            - name: OPENVPN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pia
                  key: OPENVPN_PASSWORD
            # A server that forwards a port: peers can then connect in,
            # through PIA, and torrents are as fast as with a port open at
            # home - with nothing open at home.
            - name: SERVER_REGIONS
              value: Netherlands
            - name: PORT_FORWARD_ONLY
              value: "true"
            - name: VPN_PORT_FORWARDING
              value: "on"
            # Tells qBittorrent the forwarded port and binds it to the
            # tunnel, each time PIA hands one out; upstream's own example.
            - name: VPN_PORT_FORWARDING_UP_COMMAND
              value: |-
                /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8080/api/v2/app/setPreferences'
            - name: VPN_PORT_FORWARDING_DOWN_COMMAND
              value: |-
                /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:8080/api/v2/app/setPreferences'
            # The one way into the pod from outside the tunnel: the web UI,
            # for ingress-nginx, Radarr and Sonarr.
            - name: FIREWALL_INPUT_PORTS
              value: "8080"
          # gluetun's own check, the one its image's HEALTHCHECK runs: is the
          # tunnel up and passing traffic. Its health server listens only on
          # the pod's loopback, out of the kubelet's reach.
          startupProbe:
            exec:
              command: ["/gluetun-entrypoint", "healthcheck"]
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["/gluetun-entrypoint", "healthcheck"]
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: gluetun
              mountPath: /gluetun
      containers:
        - name: qbittorrent
          # The tag is qBittorrent, libtorrent and linuxserver's build;
          # renovate.json5 reads the first and the last.
          image: ghcr.io/linuxserver/qbittorrent:5.3.0_v2.1.2-ls484
          env:
            - name: TZ
              value: Europe/Copenhagen
            # The NAS's `media` user and group, which the share maps every
            # client to; the files on the Ceph config volume get them too.
            - name: PUID
              value: "3001"
            - name: PGID
              value: "3002"
            - name: WEBUI_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: media
          persistentVolumeClaim:
            claimName: torrents-media
        - name: defaults
          configMap:
            name: qbittorrent-defaults
        # PIA's server list and the forwarded port's lease. Rebuilt at each
        # start; the port may change, and the up-command tells qBittorrent.
        - name: gluetun
          emptyDir: {}
