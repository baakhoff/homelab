# qBittorrent's settings and the list of torrents it is downloading and
# seeding. Small, and not backed up: Radarr and Sonarr keep the library, and
# what is lost with this is only which torrents were still seeding.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config
  namespace: torrents
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 2Gi
---
# The NAS's tank/media, writable, mounted whole at /data: downloads land in
# /data/downloads, and Radarr and Sonarr hard-link them into /data/films and
# /data/series on the same filesystem - instant, no second copy, and the
# torrent keeps seeding from the original. Plex reads the same share through
# a read-only volume of its own (clusters/lab/plex/pvc.yaml).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: torrents-media
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: torrents
    name: torrents-media
  mountOptions:
    - nfsvers=4.2
    - hard
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: 192.168.68.105/mnt/tank/media##torrents
    volumeAttributes:
      server: 192.168.68.105
      share: /mnt/tank/media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: torrents-media
  namespace: torrents
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: torrents-media
  resources:
    requests:
      storage: 1Ti
