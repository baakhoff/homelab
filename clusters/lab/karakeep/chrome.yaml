# The browser Karakeep's crawler drives: it opens each saved link, waits for
# the page, and hands back the HTML, a screenshot and a full copy.
#
# A pod of its own rather than a container beside Karakeep, for one reason:
# it visits whatever URL is saved, and a page can redirect anywhere. Karakeep
# refuses links to private addresses itself, but a browser follows redirects
# and runs scripts, so the line is drawn where a page cannot argue with it -
# this pod's NetworkPolicy reaches the public internet and nothing in the
# house or the cluster (networkpolicy.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep-chrome
  namespace: karakeep
spec:
  # Stateless: every crawl is a fresh browser context.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: karakeep-chrome
  template:
    metadata:
      labels:
        app.kubernetes.io/name: karakeep-chrome
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # nobody, as upstream's image sets it.
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chrome
          # Karakeep's build of Chrome Headless Shell, tested against its
          # crawler. Versioned separately from Karakeep.
          image: ghcr.io/karakeep-app/karakeep-chrome:154.0.8037.57-r1
          # Appended to the image's own command, which already sets
          # --no-sandbox (the pod is the sandbox) and listens for the
          # crawler on 9222. The rest as upstream's compose file passes them.
          args:
            - --disable-gpu
            - --disable-dev-shm-usage
            - --hide-scrollbars
            - --disable-blink-features=AutomationControlled
            - --window-size=1440,900
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: cdp
              containerPort: 9222
          readinessProbe:
            httpGet:
              path: /json/version
              port: cdp
          livenessProbe:
            httpGet:
              path: /json/version
              port: cdp
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              # One page at a time (CRAWLER_NUM_WORKERS is 1); a heavy page
              # can still take a gigabyte.
              memory: 1536Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: karakeep-chrome
  namespace: karakeep
spec:
  selector:
    app.kubernetes.io/name: karakeep-chrome
  ports:
    - name: cdp
      port: 9222
      targetPort: cdp
