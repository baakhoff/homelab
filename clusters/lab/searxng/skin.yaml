# The lab's look for SearXNG: Google's results layout and dark palette.
# SearXNG ships one theme, `simple`, and no setting for a custom stylesheet,
# so a small nginx in front of it (deployment.yaml) adds one line to every
# page's <head> that loads skin.css below. The skin only overrides the
# theme's own colour variables and a few sizes, so a SearXNG upgrade that
# restyles something shows its own look there rather than breaking.
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-skin
  namespace: searxng
data:
  default.conf: |
    server {
        listen 8080;

        # The pod's only listener. SearXNG itself is on loopback.
        location / {
            proxy_pass http://127.0.0.1:8888;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            # sub_filter can only rewrite an uncompressed body.
            proxy_set_header Accept-Encoding "";
            # A results page waits on the slowest engine, up to 10 s.
            proxy_read_timeout 30s;

            sub_filter_once on;
            sub_filter '</head>' '<link rel="stylesheet" href="/lab-skin.css?v=1"></head>';
        }

        location = /lab-skin.css {
            root /etc/searxng-skin;
            try_files /skin.css =404;
            add_header Cache-Control "public, max-age=86400";
        }
    }
  skin.css: |
    /* Dark everywhere, whatever the visitor's theme setting says. */
    :root,
    :root.theme-auto,
    :root.theme-light,
    :root.theme-dark,
    :root.theme-black {
      color-scheme: dark;
      --g-bg: #202124;
      --g-surface: #303134;
      --g-surface-hover: #3c4043;
      --g-border: #3c4043;
      --g-text: #bdc1c6;
      --g-text-strong: #e8eaed;
      --g-text-dim: #9aa0a6;
      --g-link: #8ab4f8;
      --g-visited: #c58af9;

      --color-base-font: var(--g-text);
      --color-base-font-rgb: 189, 193, 198;
      --color-base-background: var(--g-bg);
      --color-base-background-mobile: var(--g-bg);
      --color-url-font: var(--g-link);
      --color-url-visited-font: var(--g-visited);
      --color-header-background: var(--g-bg);
      --color-header-border: var(--g-border);
      --color-footer-background: var(--g-bg);
      --color-footer-border: var(--g-border);
      --color-sidebar-border: var(--g-border);
      --color-sidebar-font: var(--g-text);
      --color-sidebar-background: var(--g-bg);
      --color-backtotop-font: var(--g-text);
      --color-backtotop-border: var(--g-border);
      --color-backtotop-background: var(--g-surface);
      --color-btn-background: var(--g-link);
      --color-btn-font: #202124;
      --color-show-btn-background: var(--g-surface);
      --color-show-btn-font: var(--g-text-strong);
      --color-search-border: transparent;
      --color-search-shadow: none;
      --color-search-background: var(--g-surface);
      --color-search-font: var(--g-text-strong);
      --color-search-background-hover: var(--g-surface-hover);
      --color-categories-item-selected-font: var(--g-text-strong);
      --color-categories-item-border-selected: var(--g-link);
      --color-autocomplete-font: var(--g-text-strong);
      --color-autocomplete-border: transparent;
      --color-autocomplete-shadow: 0 4px 6px rgb(0 0 0 / 35%);
      --color-autocomplete-background: var(--g-surface);
      --color-autocomplete-background-hover: var(--g-surface-hover);
      --color-answer-font: var(--g-text);
      --color-answer-background: var(--g-surface);
      --color-result-keyvalue-col-table: var(--g-surface);
      --color-result-keyvalue-odd: var(--g-surface);
      --color-result-keyvalue-even: var(--g-bg);
      --color-result-background: var(--g-bg);
      --color-result-border: var(--g-border);
      --color-result-url-font: var(--g-text-strong);
      --color-result-vim-selected: var(--g-surface);
      --color-result-vim-arrow: var(--g-link);
      --color-result-description-highlight-font: var(--g-text-strong);
      --color-result-link-font: var(--g-link);
      --color-result-link-font-highlight: var(--g-link);
      --color-result-link-visited-font: var(--g-visited);
      --color-result-publishdate-font: var(--g-text-dim);
      --color-result-engines-font: var(--g-text-dim);
      --color-result-search-url-border: var(--g-border);
      --color-result-search-url-font: var(--g-text);
      --color-result-image-span-font: var(--g-text);
      --color-result-image-background: var(--g-surface);
      --color-settings-tr-hover: var(--g-surface);
      --color-settings-engine-description-font: var(--g-text-dim);
      --color-toolkit-badge-background: var(--g-surface-hover);
      --color-toolkit-dialog-border: var(--g-border);
      --color-toolkit-dialog-background: var(--g-surface);
      --color-toolkit-tabs-label-border: var(--g-bg);
      --color-toolkit-tabs-section-border: var(--g-border);
      --color-toolkit-select-background: var(--g-surface);
      --color-toolkit-select-border: var(--g-border);
      --color-toolkit-select-background-hover: var(--g-surface-hover);
      --color-toolkit-input-text-font: var(--g-text-strong);
      --color-toolkit-checkbox-onoff-on-mark-background: var(--g-link);
      --color-toolkit-checkbox-input-border: var(--g-link);
      --color-toolkit-engine-tooltip-border: var(--g-border);
      --color-toolkit-engine-tooltip-background: var(--g-surface);
      --color-favicon-background-color: var(--g-surface-hover);
      --color-favicon-border-color: var(--g-border);
    }

    body {
      font-family: Roboto, "Google Sans", Arial, "Helvetica Neue", sans-serif;
    }

    /* The search box: one pill, lighter on hover and focus, like Google's. */
    .search_box {
      border-radius: 24px;
      border: 1px solid var(--g-surface);
      background: var(--g-surface);
      transition: background 0.15s, box-shadow 0.15s;
    }
    .search_box:hover,
    .search_box:focus-within {
      background: var(--g-surface-hover);
      box-shadow: 0 1px 6px rgb(0 0 0 / 40%);
    }
    #q,
    #send_search,
    #clear_search {
      background: transparent !important;
      color: var(--g-text-strong);
    }
    #q {
      border-radius: 24px 0 0 24px;
    }
    #send_search {
      border-radius: 0 24px 24px 0;
    }

    /* Category tabs: plain text, the selected one underlined in blue. */
    .category_button,
    .category label {
      color: var(--g-text-dim);
    }

    /* Results: site line on top, a large blue title, a grey snippet. */
    .result {
      border-left: none;
      padding-top: 0.6rem;
      padding-bottom: 0.6rem;
    }
    .result .url_wrapper {
      font-size: 0.875rem;
      color: var(--g-text-strong);
    }
    .result h3 {
      margin: 0.25rem 0 0.3rem;
    }
    .result h3 a {
      font-size: 1.25rem;
      line-height: 1.3;
    }
    .result .content {
      font-size: 0.875rem;
      line-height: 1.58;
      color: var(--g-text);
    }
    .result .content .highlight {
      font-weight: normal;
      color: var(--g-text-strong);
    }
    .result .engines span,
    .result .engines a {
      font-size: 0.75rem;
    }

    /* Wikipedia and the other answer boxes as raised cards. */
    #infoboxes .infobox,
    .answer {
      background: var(--g-surface);
      border: 1px solid var(--g-border);
      border-radius: 8px;
    }

    a {
      color: var(--g-link);
    }
    a:visited {
      color: var(--g-visited);
    }
