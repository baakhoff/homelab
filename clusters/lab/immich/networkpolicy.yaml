# One way in at each layer: ingress-nginx to the server, the server to
# machine learning and to Postgres. Redis listens on the server pod's
# loopback only (deployment.yaml), so it needs no rule.
#
# One exception: Airflow's scheduler reaches the server directly, for two
# DAGs with a key each: ingest_immich (pipelines/dags/ingest.py), whose key
# reads the server's statistics and its users and nothing else, and
# immich_sort (pipelines/dags/immich_sort.py), whose key reads the owner's
# photos and their previews and adds tags, the types' albums and the album
# "To delete" (README, step 8).
#
# No rule for the agents, brand-jobs or n8n namespaces, and none should be
# added: the photos are the family's, and those run code that reads text
# from outside the house.
#
# Egress is open but for the NAS (networkpolicy-no-nas.yaml): the server
# goes out to Pocket ID for the login, and machine learning to Hugging Face
# for its models. The library is mounted by the node's kubelet, not reached
# from a pod, so no pod here needs the NAS either.
#
# k3s enforces NetworkPolicy - see the agents policy for the smoke test.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: immich-server
  namespace: immich
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: immich-server
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 2283
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: airflow
          podSelector:
            matchLabels:
              component: scheduler
      ports:
        - protocol: TCP
          port: 2283
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: immich-machine-learning
  namespace: immich
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: immich-machine-learning
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: immich-server
      ports:
        - protocol: TCP
          port: 3003
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: immich-postgres
  namespace: immich
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: immich-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: immich-server
      ports:
        - protocol: TCP
          port: 5432
