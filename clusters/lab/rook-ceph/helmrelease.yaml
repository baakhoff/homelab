apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  interval: 1h
  chart:
    spec:
      chart: rook-ceph
      version: "v1.20.7"
      sourceRef:
        kind: HelmRepository
        name: rook-release
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # The chart named `rook-ceph` is the OPERATOR only: a controller plus the
    # Ceph CRDs. It creates no storage on its own and touches no disk. The
    # cluster itself arrives as a CephCluster custom resource in a later
    # change, written out rather than templated from a second chart, so that
    # every field it sets is visible in this repo.
    #
    # Deliberately not upgraded past the newest stable release: v1.21.0-beta.0
    # was published two days before this landed. A storage layer is the last
    # place to run a pre-release.

    # WHAT IS NOT SET HERE, AND WHY
    #
    # `csi.enableRbdDriver`, `csi.enableCephfsDriver` and `csi.kubeletDirPath`
    # were set in the first version of this file. They are not values of the
    # v1.20 chart - up to v1.19 they built the CSI provisioner Deployment and
    # node-plugin DaemonSet, and v1.20 moved that job to the separate
    # ceph-csi-operator. Helm accepts unknown values silently, so they
    # installed cleanly and did nothing, and the cluster came up healthy with
    # no CSI driver at all.
    #
    # The lesson is worth more than the fix: verify that something READ a
    # value, not that you set it. `kubectl get csidriver` returning nothing is
    # what found this; no amount of re-reading the values file would have.
    #
    # The drivers now come from helmrelease-csi-drivers.yaml, where
    # kubeletDirPath lives too.
    csi:
      # No ServiceMonitor. This cluster has no Prometheus operator yet, so the
      # monitoring.coreos.com CRDs do not exist, and a manifest referring to a
      # missing CRD fails the whole reconcile rather than just itself. Flip
      # this on in the same change that installs the monitoring stack, not
      # before.
      serviceMonitor:
        enabled: false
