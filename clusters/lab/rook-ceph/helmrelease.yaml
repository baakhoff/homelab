apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  interval: 1h
  chart:
    spec:
      chart: rook-ceph
      version: "v1.20.7"
      sourceRef:
        kind: HelmRepository
        name: rook-release
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # The chart named `rook-ceph` is the OPERATOR only: a controller plus the
    # Ceph CRDs. It creates no storage on its own and touches no disk. The
    # cluster itself arrives as a CephCluster custom resource in a later
    # change, written out rather than templated from a second chart, so that
    # every field it sets is visible in this repo.
    #
    # Deliberately not upgraded past the newest stable release: v1.21.0-beta.0
    # was published two days before this landed. A storage layer is the last
    # place to run a pre-release.

    # WHAT IS NOT SET HERE, AND WHY
    #
    # `csi.enableRbdDriver`, `csi.enableCephfsDriver` and `csi.kubeletDirPath`
    # were set in the first version of this file. They are not values of the
    # v1.20 chart - up to v1.19 they built the CSI provisioner Deployment and
    # node-plugin DaemonSet, and v1.20 moved that job to the separate
    # ceph-csi-operator. Helm accepts unknown values silently, so they
    # installed cleanly and did nothing, and the cluster came up healthy with
    # no CSI driver at all.
    #
    # The lesson is worth more than the fix: verify that something READ a
    # value, not that you set it. `kubectl get csidriver` returning nothing is
    # what found this; no amount of re-reading the values file would have.
    #
    # The drivers now come from helmrelease-csi-drivers.yaml, where
    # kubeletDirPath lives too.
    csi:
      # Off, for a different reason than the one written here before.
      #
      # The old reason was ordering: no Prometheus CRDs on this cluster yet.
      # That has expired - kube-prometheus-stack is running, and the CephCluster
      # beside this file now has monitoring on. This stays off because of what
      # the ServiceMonitor it would render actually selects: Services labelled
      # `app: csi-metrics` in this namespace. That label belonged to the
      # metrics Service the operator chart created back when it deployed the
      # CSI drivers itself. In v1.20 it does not (see above), and the
      # ceph-csi-operator that does creates a metrics Service only for a
      # Driver with a liveness sidecar - which the Driver here has not asked
      # for. So this toggle would produce a ServiceMonitor with zero targets:
      # not broken, just nothing. The same lesson as the block above, from the
      # other side - check what a value would select before setting it.
      serviceMonitor:
        enabled: false

    # RBAC only: a Role and RoleBinding letting the operator create
    # ServiceMonitors in this namespace. Nothing this renders is of a
    # Prometheus kind, so it is safe to have on before those CRDs exist -
    # unlike the toggle above, and unlike cert-manager's. The ServiceMonitors
    # themselves are created by the operator when the CephCluster asks for
    # them, and that is where the missing-CRD case is handled; see the
    # monitoring block in cephcluster.yaml.
    monitoring:
      enabled: true
