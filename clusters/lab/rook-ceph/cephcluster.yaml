apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    # A full version-and-build tag, which is what Rook recommends for anything
    # holding data: `v20.2.4` alone can be rebuilt and repushed, so the same
    # tag would not always mean the same image. The build date pins it.
    #
    # Tentacle v20.2.0 is explicitly NOT safe - a data corruption issue, fixed
    # in v20.2.1. Never pin below that on this release line.
    image: quay.io/ceph/ceph:v20.2.4-20260818
    allowUnsupported: false

  security:
    cephx:
      csi:
        # The CSI keys are rotated DOWN to the older cipher. That is not an
        # oversight, and it took a failed volume to establish.
        #
        # Ceph v20.2.4 fixed CVE-2025-30156 by introducing a new cephx key
        # type, aes256k. Rook autodetects it, so this cluster was born with
        # every key - daemon and CSI alike - already on the new cipher. Good,
        # except that nothing on the client side here can speak it yet:
        #
        #   - the IN-KERNEL rbd and cephfs clients gained aes256k in Linux
        #     7.0; these nodes run 6.8
        #   - ceph-csi's own bundled librados gained it in v3.17.1; the image
        #     this Rook release ships is older
        #
        # The second one is why the failure appears at PROVISIONING rather
        # than only at mount. Every PVC against ceph-block failed with
        # `rpc error: code = Internal desc = failed to get connection:
        # connecting failed: rados: ret=-22, Invalid argument` - the
        # provisioner's userspace librados rejecting its own key.
        #
        # keyType alone cannot fix it: with keyRotationPolicy left at its
        # default of Disabled, keyType only binds the NEXT rotation and never
        # re-types an existing key. Both settings plus a generation bump are
        # required. Generation 1 was created with the cluster.
        keyRotationPolicy: KeyGeneration
        keyGeneration: 2
        keyType: aes
        #
        # This works only because the monitors still ACCEPT aes keys - which
        # is what AUTH_INSECURE_KEYS_ALLOWED and AUTH_INSECURE_KEYS_CREATABLE
        # have been reporting since day one. Those two warnings are monitor
        # policy, not key state, and they are now load-bearing rather than
        # noise: restricting security.cephx.allowedCiphers to aes256k would
        # lock the CSI clients out of their own cluster.
        #
        # TRIGGER TO REVERSE THIS: nodes on Linux 7.0+ AND a ceph-csi image at
        # v3.17.1 or newer. Then rotate CSI back to aes256k (a further
        # generation bump), confirm with `ceph auth dump-keys` that no key
        # anywhere is still aes, and only then restrict allowedCiphers - which
        # is what finally clears both warnings.
        #
        # The daemon keys are deliberately left alone. They are already
        # aes256k, they are userspace-only and unaffected by the kernel, and
        # rotating them would restart every mon, mgr and OSD for no gain.

  # Ceph's own state: the monitor database, keyrings, and per-daemon
  # directories. Not object data - that lives on the OSD devices below.
  #
  # This sits on the root logical volume. Monitor stores are normally a few
  # hundred megabytes, but they grow while a cluster is degraded because the
  # monitors keep history until everything is healthy again. Root is 100 GB
  # with an operating system on it, so there is plenty of slack; worth
  # remembering as the one Ceph path that is NOT on a size-capped volume of
  # its own.
  dataDirHostPath: /var/lib/rook

  mon:
    count: 3
    # One monitor per host. Three monitors on three hosts means the monitor
    # quorum matches the node count: lose one and the remaining two still
    # form a majority. Allowing several on one node would let a single
    # machine's failure take the quorum with it, which is the failure this
    # whole layout exists to survive.
    allowMultiplePerNode: false

  mgr:
    # Two managers: one active, one on standby. Only one serves at a time, so
    # a third buys nothing on a three-node cluster.
    count: 2
    allowMultiplePerNode: false
    modules:
      - name: rook
        enabled: true

  dashboard:
    enabled: true
    # No TLS on the dashboard itself, and still no Ingress.
    #
    # The condition this used to wait on has arrived: ingress-nginx and the lab
    # wildcard certificate both exist now. So `kubectl port-forward` is a
    # CHOICE from here rather than the only thing available, and it stays the
    # access path deliberately. The moment this has a name it is reachable from
    # the whole tailnet, and what stands in front of it is one generated
    # password. Port-forwarding keeps the traffic inside the API server's
    # tunnel and the audience down to whoever holds a kubeconfig.
    #
    # Giving it an Ingress is now a decision about exposure, not a missing
    # piece of plumbing. `ssl: false` is what would make that straightforward
    # if it is ever taken: the dashboard speaks plain HTTP inside the pod
    # network and ingress-nginx terminates TLS at the edge, rather than two
    # certificates in series.
    ssl: false

  # Crash reports and daily log rotation inside the Ceph daemons. Both cost
  # very little and are the difference between diagnosing an OSD that died
  # last night and guessing about it.
  crashCollector:
    disable: false
  logCollector:
    enabled: true
    periodicity: daily
    maxLogSize: 500M

  storage:
    # Every device is named explicitly. `useAllDevices: true` is how people
    # accidentally hand Ceph a disk that had something on it - and while Rook
    # refuses devices carrying a filesystem, that check is the last line of
    # defence rather than the plan.
    useAllNodes: false
    useAllDevices: false
    nodes:
      - name: node02
        devices:
          - name: /dev/ubuntu-vg/cephosd
      - name: node03
        devices:
          - name: /dev/ubuntu-vg/cephosd
      - name: node04
        devices:
          - name: /dev/ubuntu-vg/cephosd

  resources:
    # OSDs are the memory-hungry daemon; Ceph sizes its internal cache
    # (osd_memory_target) from the limit Rook passes it, so setting a limit
    # here is how the cache gets bounded rather than a blunt cap.
    osd:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        memory: 4Gi
    mon:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    mgr:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi

  # Monitors and OSDs are infrastructure: if the node is under memory
  # pressure, evicting them to make room for a workload trades a slow
  # application for an unavailable filesystem.
  priorityClassNames:
    mon: system-node-critical
    osd: system-node-critical
    mgr: system-cluster-critical

  # Rook maintains PodDisruptionBudgets so a drain cannot take out more OSDs
  # than the pool can tolerate. On three nodes with three replicas that means
  # draining one node at a time, which is exactly the constraint you want
  # enforced by the cluster rather than remembered by a person.
  disruptionManagement:
    managePodBudgets: true
