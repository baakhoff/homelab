apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ceph-block
  annotations:
    # The gate this replaces was "wait for HEALTH_OK for a while". That gate
    # can never be met here: the cluster carries two cephx key-type warnings
    # deliberately and permanently, because the CSI keys had to be rotated
    # back to the older `aes` type for this stack's librados to use them at
    # all. A warning that is never going away is not a health signal, so the
    # gate became a test instead - a PVC provisioned from this class, mapped,
    # written to and read back from a pod. That passed before this annotation
    # went on.
    #
    # local-path stays installed and stays correct for scratch, but it is the
    # wrong default on three nodes: it writes into a directory on whichever
    # node the pod first landed on, and from then on the data pins the pod to
    # that node. Its own default annotation has to be cleared by hand, because
    # k3s ships it as a server addon rather than as something this repo owns -
    # and two defaults is not a tie-break worth depending on.
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: rook-ceph.rbd.csi.ceph.com
parameters:
  clusterID: rook-ceph
  pool: replicapool

  # Format 2 is the only RBD image format Ceph still supports; `layering` is
  # the feature set the CSI driver and the kernel client agree on. Enabling
  # more features here produces images the node's kernel may refuse to map,
  # and the error arrives at mount time on one node rather than at creation.
  imageFormat: "2"
  imageFeatures: layering

  csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
  csi.storage.k8s.io/fstype: ext4

# Volumes can be grown in place by editing the PVC. They cannot be shrunk -
# no filesystem Kubernetes supports can do that safely - so small and
# extended later is the right default for every claim.
allowVolumeExpansion: true

# Deleting the PVC deletes the RBD image and the data in it. That is the
# correct behaviour for a cluster whose durable state is backed up
# separately, and the reason backups are a different concern from replication:
# three copies of a deleted volume is still no copies.
reclaimPolicy: Delete
