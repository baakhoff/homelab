# The lab's services as MCP tools, for an agent outside the cluster
# (README.md). The code is images/lab-mcp.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-mcp
  namespace: lab-mcp
spec:
  # One replica: files a tool saves land in this pod's scratch volume, and
  # the next call has to find them there.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lab-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lab-mcp
      annotations:
        # Bump after changing the Secret, so the pod restarts and reads it.
        lab-mcp/secret: "2"
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lab-mcp
          # The tag is images/lab-mcp/VERSION. A code change bumps both in
          # one commit; until the new image is built the old pod keeps
          # serving, because the rollout waits for the new one to be ready.
          image: ghcr.io/baakhoff/lab-mcp:0.1.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: PUBLIC_URL
              value: https://mcp.lab.baakhoff.com
            - name: WORK_DIR
              value: /work
            # Scratch files are deleted this long after they were written.
            - name: KEEP_HOURS
              value: "48"
          # MCP_TOKEN, the warehouse password and one key per service, all
          # made by hand (README.md). A service whose key is missing is
          # simply not offered; only MCP_TOKEN is required to start.
          envFrom:
            - secretRef:
                name: lab-mcp
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              # Downloads are streamed to disk, not held in memory. The
              # room is for pypdf joining large PDFs and for reading a long
              # web page.
              memory: 1Gi
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
      volumes:
        # The file workspace: downloads, results, uploads. On the node's
        # disk, capped, and gone with the pod. Nothing here is kept.
        - name: work
          emptyDir:
            sizeLimit: 4Gi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
