# The broker's whole behaviour: one nginx server block, rendered from this
# template into /etc/nginx/conf.d by the image's entrypoint on every start
# (20-envsubst-on-templates.sh). ${FIREFLY_TOKEN} is the only substitution -
# it comes from the Secret's environment, so the token lives in the pod and
# never in git.
#
# Rendered at start, not watched: an edit here takes effect on the next pod
# start. After merging a change:
#   kubectl -n firefly-broker rollout restart deployment/firefly-broker
apiVersion: v1
kind: ConfigMap
metadata:
  name: firefly-broker-config
  namespace: firefly-broker
data:
  default.conf.template: |
    # A caller's own Accept header wins; with none, JSON:API's media type is
    # what Firefly answers. No text/csv - Firefly answers 406 for it, and
    # the export returns its CSV on the default accept (README).
    map $http_accept $firefly_accept {
        default $http_accept;
        ""      application/vnd.api+json;
    }

    server {
        listen 8080;

        # What the Service and both probes use: no upstream, no token.
        location = /healthz {
            access_log off;
            return 200 "ok";
        }

        # The Firefly API. GET, POST, PUT and DELETE pass - the brand pod
        # manages the books through here, deletions included. Anything else
        # (PATCH, TRACE, ...) stays 403: Firefly's API does not use it. This
        # is also where the token is added and the login headers are
        # stripped. limit_except answers every method not listed with 403.
        location /v1/ {
            limit_except GET POST PUT DELETE {
                deny all;
            }
            proxy_pass http://firefly.firefly.svc.cluster.local/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host firefly.firefly.svc.cluster.local;
            proxy_set_header Authorization "Bearer ${FIREFLY_TOKEN}";
            proxy_set_header Accept $firefly_accept;
            proxy_set_header X-Auth-Request-Email "";
            proxy_set_header X-Auth-Request-User "";
            proxy_set_header X-Forwarded-User "";
            proxy_set_header Remote-User "";
        }

        # Nothing else exists here.
        location / {
            return 404;
        }
    }
