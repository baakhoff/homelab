# Cluster-internal only by construction: no Ingress file exists for this
# component, and networkpolicy.yaml is what narrows it to the agent host.
apiVersion: v1
kind: Service
metadata:
  name: firefly-broker
  namespace: firefly-broker
spec:
  selector:
    app.kubernetes.io/name: firefly-broker
  ports:
    - name: http
      port: 80
      targetPort: http
