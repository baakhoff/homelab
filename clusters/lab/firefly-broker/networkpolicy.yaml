# Who may talk to the broker, and what it may talk to.
#
# In: nobody, for now. The broker holds a token with the household owner's
# rights, so every pod is refused even though the name resolves
# cluster-wide. Its caller was the Hermes slot-1, which is gone; an agent
# that is given an API client needs one ingress rule here, naming its pods,
# on port 8080.
#
# Out: cluster DNS and Firefly's pod, nothing else - not the internet, not
# another lab namespace. Policies are evaluated after Service DNAT, so the
# Firefly destination below is the pod the Service points at.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: firefly-broker
  namespace: firefly-broker
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  # Empty, with Ingress in policyTypes: every inbound connection is refused.
  ingress: []
  egress:
    # Cluster DNS, matched by the CoreDNS pods' labels as elsewhere.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Firefly, and nothing else.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: firefly
          podSelector:
            matchLabels:
              app.kubernetes.io/name: firefly
      ports:
        - protocol: TCP
          port: 8080
