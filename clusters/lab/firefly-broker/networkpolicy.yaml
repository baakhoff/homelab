# Who may talk to the broker, and what it may talk to.
#
# In: the brand agent pod, and nothing else. The broker holds a token with
# the household owner's rights, so every other pod is refused even though
# the name resolves cluster-wide. brand's egress half of this door is
# clusters/lab/agents/networkpolicy-brand.yaml; another agent given access
# needs a rule in both places.
#
# Out: cluster DNS and Firefly's pod, nothing else - not the internet, not
# another lab namespace. Policies are evaluated after Service DNAT, so the
# Firefly destination below is the pod the Service points at.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: firefly-broker
  namespace: firefly-broker
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agents
          podSelector:
            matchLabels:
              app.kubernetes.io/name: brand
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Cluster DNS, matched by the CoreDNS pods' labels as elsewhere.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Firefly, and nothing else.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: firefly
          podSelector:
            matchLabels:
              app.kubernetes.io/name: firefly
      ports:
        - protocol: TCP
          port: 8080
