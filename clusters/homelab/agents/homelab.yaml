# The homelab repo itself, as the first agent project. To add another project
# copy this file: the name appears in four places (PVC, Deployment, labels,
# PROJECT), then REPO_URL and the resources. Nothing else varies. Bootstrapping
# the pod once it runs: docs/runbooks/agent-pods.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homelab
  namespace: agents
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      # Nominal, as with every local-path claim here. Holds the checkout, its
      # worktrees, and the CLI's login and session history. Excluded from the
      # nightly restic backup: everything on it is a clone, a login, or a
      # cache, and deleting this file prunes it - commit before that.
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab
  namespace: agents
  labels:
    app.kubernetes.io/name: homelab
    app.kubernetes.io/part-of: agents
spec:
  # 1 = active, 0 = parked. Never more: a second replica would be a second
  # server in the same checkout, and two servers in one directory conflict.
  # More concurrent sessions come from the one server (it serves up to 32),
  # not from more pods.
  replicas: 1
  revisionHistoryLimit: 2
  # Recreate, not RollingUpdate: one ReadWriteOnce volume and one server per
  # directory mean the old pod must be gone before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: homelab
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homelab
        app.kubernetes.io/part-of: agents
    spec:
      priorityClassName: agents
      # No Kubernetes API access from inside: the token would be the first
      # thing a prompt-injected agent read. Nothing here needs it.
      automountServiceAccountToken: false
      # User namespaces (stable since Kubernetes 1.36): uid 1000 inside the pod
      # maps to an unprivileged range on the node, so a container escape is
      # worth little. If the pod never leaves ContainerCreating and the event
      # mentions user namespaces, the runtime lacks support: flip this to true
      # and record it in the runbook.
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # kubelet chowns the freshly provisioned volume to this group and sets
        # setgid, which is what lets uid 1000 write /home/node - the same
        # lesson as Vaultwarden and Homepage.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: claude
          image: ghcr.io/baakhoff/claude-agent:2.1.270
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          # Server mode reads keys from its terminal (spacebar shows the QR
          # code). A pseudo-terminal keeps that code path happy with nobody
          # attached, and an open stdin means it never sees EOF and exits.
          tty: true
          stdin: true
          env:
            - name: PROJECT
              value: homelab
            - name: REPO_URL
              value: https://github.com/baakhoff/homelab.git
            - name: PERMISSION_MODE
              value: acceptEdits
            # Commits the agent makes carry the repo's usual identity.
            - name: GIT_AUTHOR_NAME
              value: baakhoff
            - name: GIT_AUTHOR_EMAIL
              value: a@baakhoff.com
            - name: GIT_COMMITTER_NAME
              value: baakhoff
            - name: GIT_COMMITTER_EMAIL
              value: a@baakhoff.com
          resources:
            # The request is what the scheduler reserves and what spreads
            # projects across nodes; the limit is what the kernel enforces.
            # Measure the real numbers on the Grafana namespace graphs before
            # copying these into the next project - a session with subagents
            # and a test suite running sits well above idle.
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: home
              mountPath: /home/node
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: homelab
