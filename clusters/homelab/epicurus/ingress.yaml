# Same shape as podinfo's: host, path, backend, nothing else. No tls block and
# no ingressClassName - ingress-nginx is the default class and serves the lab
# wildcard as its default certificate.
#
# What is different is what sits behind it: `epicurus` is a Service with no
# pods, pointing out of the cluster at an Incus container. From the
# controller's side that distinction does not exist - it resolves endpoints and
# proxies to them, wherever they are.
#
# ACCESS: the platform ships with NO AUTHENTICATION (upstream ADR-0008), and
# reaching the web UI also reaches /platform/v1/* - agent, files, OAuth - with
# nothing in front. That is safe here only because the whole lab is
# tailnet-only: the DNS record points at a Tailscale CGNAT address that does
# not route from the internet. If anything about that ever changes, this host
# needs an auth proxy before it needs anything else.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: epicurus
  namespace: epicurus
  annotations:
    # Discovered by Homepage. href given explicitly because there is no tls
    # block here, so it would otherwise be inferred as http:// and redirect.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: epicurus
    gethomepage.dev/group: Services
    gethomepage.dev/icon: mdi-brain
    gethomepage.dev/description: Agent platform - compose stack in Incus
    gethomepage.dev/href: https://epicurus.lab.baakhoff.com
    # NO pod-selector here, and none is possible. Homepage's health badge asks
    # which pods back the service; this one has none, because the Service is
    # selector-less and its EndpointSlice points out of the cluster at an Incus
    # container. So the card reads NOT FOUND permanently and that is CORRECT -
    # Kubernetes really does have no workload for epicurus. Do not go looking
    # for a selector that fixes it. The honest fix would be an HTTP probe of the
    # URL, which is what a blackbox exporter would give us and what ADR-0003
    # already names as the open gap.
    # The chat UI streams responses over SSE. nginx's default 60s proxy read
    # timeout closes a stream that goes quiet for a minute, which a local model
    # thinking about a long prompt will do routinely.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Never buffer the response: SSE tokens must reach the browser as they are
    # produced, not when nginx decides it has a full buffer.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # UPLOADS - the other direction. ingress-nginx caps request bodies at 1m
    # by default, so a file sent to epicurus fails with a 413 that names nginx
    # and not the application - the same failure Vaultwarden's Ingress fixes
    # with 128m. "0" removes nginx's cap entirely rather than picking a number,
    # and leaves any limit to the application. Acceptable only because the lab
    # is tailnet-only: nobody who cannot already reach the host can send a body
    # at all. If this Ingress is ever exposed further, put a real number here
    # before doing anything else.
    #
    # These two can be set on the live object with kubectl annotate and appear
    # to work, and they belong HERE because Flux enforces exactly the fields
    # written in this file: a key added by hand survives every reconcile as
    # drift Flux cannot see, and a rebuild from git would silently drop it.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    # Stream the upload to the backend as it arrives instead of spooling the
    # whole body to nginx's disk first. With no cap above, that spool could be
    # arbitrarily large, and the application sees nothing until nginx holds
    # the last byte.
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
spec:
  rules:
    - host: epicurus.lab.baakhoff.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: epicurus
                port:
                  number: 8088
