apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.1"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      enabled: true

    # cert-manager has always exposed metrics on :9402; what was missing was
    # anything scraping them. This creates a ServiceMonitor in the
    # cert-manager namespace, which the monitoring stack discovers because
    # its serviceMonitorSelector was widened to the whole cluster rather than
    # to the chart's own release label.
    #
    # Two things arrive with it. The certificate expiry and readiness series
    # that clusters/homelab/monitoring/cert-manager-rules.yaml alerts on -
    # without which those rules would evaluate against nothing forever, which
    # looks identical to everything being fine. And free coverage from the
    # stack's own TargetDown rule, since cert-manager is now a registered
    # target: it going down is reported without writing a rule for it.
    #
    # Lower-case `servicemonitor` is the chart's spelling, not a typo. The
    # camelCase form is silently ignored, as unknown Helm values always are.
    prometheus:
      servicemonitor:
        enabled: true
        # cert-manager reports on Certificates that live in OTHER namespaces,
        # so its metrics carry a `namespace` label naming the certificate's
        # namespace - while the operator attaches its own `namespace` label
        # naming the scraped POD's namespace. On a collision Prometheus
        # defaults to letting the scraper win and shunts the exporter's
        # version aside as `exported_namespace`.
        #
        # That default is wrong here and quietly so: the alerts below print
        # namespace/name, so the lab wildcard came out as
        # cert-manager/lab-wildcard and sent you to a namespace where no such
        # Certificate exists. honorLabels keeps the exporter's value, because
        # for these metrics the exporter is the one that knows.
        #
        # Safe to set broadly: cert-manager emits no job or instance label of
        # its own, so nothing else collides, and controller-level metrics that
        # carry no namespace still inherit the pod's as before.
        honorLabels: true
