version: 2

# The raw layer: one table per source system, filled from Kafka by
# ClickHouse itself (clusters/lab/data/clickhouse-schema.yaml). Every table
# has the same columns; `payload` is the message exactly as produced.
sources:
  - name: raw
    schema: raw
    tables:
      - name: homeassistant
        description: Home Assistant state changes, one JSON state object per message.
      - name: logs
        description: Pod log lines, OTLP JSON from the Alloy collectors. Kept 90 days.
      - name: k8s_events
        description: Kubernetes events, OTLP JSON with the event as JSON in the body.
      - name: firefly
        description: Firefly III API snapshots, one record per message in the ingest envelope.
      - name: vikunja
        description: Vikunja API snapshots, one record per message in the ingest envelope.
      - name: mealie
        description: Mealie API snapshots, one record per message in the ingest envelope.
      - name: paperless
        description: Paperless-ngx API snapshots, one record per message in the ingest envelope.
      - name: sparkyfitness
        description: SparkyFitness API snapshots of one account's diary, one record per message in the ingest envelope.
      - name: dawarich
        description: Dawarich API reads of one account's location history - visits and places as snapshots, points as the last week's, one record per message in the ingest envelope.
      - name: cloudbeaver
        description: CloudBeaver's usage - its ClickHouse queries from system.query_log, and its sessions, users and sign-ins as snapshots, one record per message in the ingest envelope. Its Postgres statements are in logs.
      - name: outline
        description: Outline API snapshots - every document with its Markdown text, and the collections - one record per message in the ingest envelope.
      - name: telegram
        description: Telegram accounts' private chats, each record naming its account - the chats as snapshots, the messages as sent once and again when edited, one record per message in the ingest envelope.
      - name: proton
        description: Proton Mail exports loaded by hand - each message's headers, plain-text body and attachment names and sizes, one record per message in the ingest envelope.
      - name: vk
        description: The VK account's data archive (deleted 2020), loaded by hand - messages, conversations, the music list and every other section's entries, one record per message in the ingest envelope.
      - name: immich
        description: Immich API snapshots - photo and video counts and bytes per account, and the accounts - one record per message in the ingest envelope. Nothing about any photo.
      - name: google
        description: One Google account - Calendar, Contacts, Tasks, Drive and Gmail labels as snapshots, Gmail message metadata as changes, Data Portability exports - one record per message in the ingest envelope.
