version: 2

# Keys that the layers above join on. A failing test here means a source
# changed its API's shape - the model reads a field that is no longer there.
models:
  - name: firefly_accounts
    columns:
      - name: account_id
        tests: [not_null, unique]
  - name: firefly_transactions
    columns:
      - name: journal_id
        tests: [not_null, unique]
  - name: vikunja_tasks
    columns:
      - name: task_id
        tests: [not_null, unique]
  - name: vikunja_projects
    columns:
      - name: project_id
        tests: [not_null, unique]
  - name: mealie_recipes
    columns:
      - name: recipe_id
        tests: [not_null, unique]
  - name: paperless_documents
    columns:
      - name: document_id
        tests: [not_null, unique]
  - name: ha_states
    columns:
      - name: entity_id
        tests: [not_null]
