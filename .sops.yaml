creation_rules:
  - path_regex: .*\.sops\.ya?ml$
    encrypted_regex: ^(data|stringData)$
    # Two recipients: every file opens with either private key.
    #   first  - the cluster's key: Flux decrypts with it, the Linux
    #            workstation holds a copy, the emergency kit has it
    #   second - the MacBook's own key, made on it and never copied off
    #            (backed up in the vault as a note)
    # Adding or removing one is this line plus `sops updatekeys` on every
    # *.sops.yaml, run where an existing key is (docs/runbooks/disaster-recovery.md).
    age: >-
      age12mpq9jh86v2jrttmjqjmw2xfkcs98s8555cr2nz8654w4rwjs3ms8293q7,
      age1cs7j6rqdtw698l29az54ltjepnflpa5apg3zwx45ehdtwtfe89kqvj5mee