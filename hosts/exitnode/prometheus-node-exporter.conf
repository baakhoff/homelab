# /etc/systemd/system/prometheus-node-exporter.service.d/lab.conf
#
# node-exporter listens on every interface, and the Pi has no firewall. This
# lets the service talk to the three cluster nodes - where Prometheus's
# scrape comes from, pod traffic leaving under its node's address - and to
# itself, and to nothing else: systemd enforces it on the service's own
# sockets, so nothing else on the Pi is affected.
[Service]
IPAddressDeny=any
IPAddressAllow=localhost 192.168.68.102 192.168.68.103 192.168.68.104
