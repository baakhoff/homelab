# /etc/sysctl.d/99-inotify.conf on node02, node03 and node04.
#
# Ubuntu's defaults are 128 inotify instances and 8192 watches per user. A
# k3s server node spends them fast: every container's log follower, the
# kubelet's config watches, containerd, and every `kubectl logs -f` or
# `journalctl -f` on top. Once they are gone the symptom is an unrelated
# command failing with "Too many open files" - seen from `systemctl restart`
# on node02 on 2026-09-20, which needs a watch on its own directory - and
# pods whose logs simply stop being tailed, with nothing in dmesg.
#
# 512 and 524288 are the values the Kubernetes ecosystem has converged on
# (kind, Rancher and Ceph docs all ask for them). Cost is a few hundred
# kilobytes of kernel memory at most.
fs.inotify.max_user_instances = 512
fs.inotify.max_user_watches = 524288
