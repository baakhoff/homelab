# /etc/ssh/sshd_config.d/00-hardening.conf
#
# sshd keeps the FIRST value it reads for each keyword, and the Include line
# for this directory sits at the top of sshd_config, so "00-" makes these win
# over the main file and over the image's 50-cloud-init.conf.
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitRootLogin no
