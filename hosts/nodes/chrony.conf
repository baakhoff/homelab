# /etc/chrony/chrony.conf on node02, node03 and node04 - replaces the file the
# chrony package ships, rather than adding to it through conf.d, because the
# point is to take sources AWAY: the stock file adds whatever NTP server the
# DHCP lease names, on top of Ubuntu's pools.
#
# WHY CHRONY AND NOT THE STOCK systemd-timesyncd. The Ceph monitors run on all
# three nodes and raise CephMonClockSkew once any two disagree by more than
# 50 ms. timesyncd is an SNTP client: one server at a time, whichever one the
# current DHCP lease or fallback list offers, corrected in coarse steps. On
# 2026-09-30 the nodes were each on a different server across an hour of
# network changes, were unplugged and came back setting their clocks
# independently, and the monitors tripped the alert. Afterwards the offsets
# were still 1 to 8 ms with up to 46 ms of jitter - inside the limit, but not
# by much. chrony samples several servers continuously, discards the bad ones
# and slews the clock smoothly; sub-millisecond agreement between machines on
# the same LAN is its normal state. It is also what the Ceph documentation
# asks for on monitor hosts.
#
# THE SAME SOURCES ON EVERY NODE. Three nodes steering by the same servers
# drift together, which is what the monitors care about - agreement with each
# other matters more to Ceph than agreement with UTC. Cloudflare's anycast
# service is the primary; Ubuntu's pool is there so one provider going away
# does not leave the nodes free-running. No DHCP-supplied server, so a router
# change can no longer silently change what the cluster keeps time by.
#
# Not covered: with the internet down, each node free-runs on its own crystal
# (10 to 15 ppm apart, from `timedatectl timesync-status`), which reaches the
# 50 ms alert in about an hour. The nodes could steer by each other in that
# case, but only with per-node files, and a one-hour outage has not happened.
server time.cloudflare.com iburst maxpoll 8
pool ntp.ubuntu.com iburst maxsources 2 maxpoll 8

# Where chrony remembers this machine's crystal error between restarts, so a
# reboot starts close instead of re-learning it from nothing.
driftfile /var/lib/chrony/chrony.drift
logdir /var/log/chrony

# Step the clock rather than slew it if it is more than a second off, but only
# in the first three updates - i.e. at boot, when the RTC may be far out. After
# that, only slew: a clock that jumps under a running etcd or Ceph monitor is
# worse than one that is briefly a little wrong.
makestep 1 3

# Copy the system time to the hardware clock every eleven minutes, so the next
# boot starts from a recent value.
rtcsync

# Ignore sources whose own error estimate is implausible.
maxupdateskew 100.0

leapsectz right/UTC
